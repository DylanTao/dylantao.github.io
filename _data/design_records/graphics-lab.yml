      - id: coast-wind
        name: One wind for the coast
        status: shipped
        since: "2026-10-16"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/coast-wind.webp
          alt: The date palm on the clifftop and its shadow on the sand, fronds that sway in the afternoon sea breeze
          frame: Lab camera on the clifftop, 15:00 on Friday, October 16, 2026, reduced motion.
        what: One breeze, measured at Scripps Pier and carried by gust fronts that travel downwind, moves the sea, the clifftop planting, the room plants, the curtains, the steam and the particles.
        how: >-
          `createCoastWind` in `wind-field.mjs` runs a periodic cubic Hermite through the October hourly means at Scripps
          Pier (NDBC LJPC1, 2023–2025) and writes every gust as a function of retarded time t − x·d/c, so a front reaches
          each place in turn at the mean wind's speed, Taylor's frozen turbulence. An exact integer hash makes the shader
          chunk (`coastWindGLSL`) and the CPU agree on every gust. Indoors, a six-mode curl-noise field adds the house's
          own eddies (`sampleWind`), exactly divergence-free, after Bridson, Hourihan and Nordenstam. `patchFloraSway` bends
          the planting by a lean that grows like U^1.4, as streamlining leaves' drag does, and a sway at each species' own
          frequency phased by retarded time, so gusts roll across the bluff; the room plants bend around their real stems.
