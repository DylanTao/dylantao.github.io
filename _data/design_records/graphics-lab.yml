  - id: camera-land
    name: Camera and land
    summary: >-
      A camera that knows the house's walls from its own geometry, and land that continues past the mainland in every
      direction, out to a coast the camera can now see from 160 m.
    techniques:
      - id: camera-field
        name: A camera that knows the house's walls
        status: shipped
        since: "2026-10-15"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/camera-field.webp
          alt: The cave house in its cliff from far out over the Pacific at golden hour, with dark reef and kelp under the clear water, the mesa's planting and the coast fading into haze
          frame: Lab camera about 155 m out over the sea, 17:40 on Friday, October 16, 2026, reduced motion.
        what: Every static mesh is voxelized into a 12 cm field once it loads, and a spring arm keeps the camera on the near side of anything between it and the subject, so visitors can orbit freely and zoom the coast to 160 m.
        how: >-
          `createCameraField` in `camera-field.mjs` voxelizes each static house, room and coast mesh in a module worker
          (`camera-field-worker.mjs`), and `camera.mjs` classifies the cells: pieces under 45 cm in every direction are
          detail, a cell blocks when its neighbourhood holds a plane's worth of structure, and blocking cells grow a 24 cm
          clearance shell. Rays walk the field cell by cell, after Amanatides and Woo. `cameraArm` places the camera at the
          farthest point on the orbit ray the path reaches without crossing a blocking cell, with side rays that pull in
          before an edge reaches it, and `steerOrbit` refuses steps that would leave the arm under 40 % of the requested
          distance. `farView` lets the haze, the clip planes and the sun's shadow follow the coast's orbit out to 160 m. Since
          October 18 the gym's camera works like a tripod, turning to each station from its authored place (`tripodLook`),
          and full screen on a portrait screen widens the lens to hold a room's width (`portraitFov`).
        files:
          - path: assets/js/home-scene/camera-field.mjs
            role: Voxelizes the loaded meshes and decides what may hold the camera back.
            functions: [createCameraField, collidable, airSeeds]
          - path: assets/js/home-scene/camera-field-worker.mjs
            role: Voxelizes off the main thread.
          - path: assets/js/home-scene/camera.mjs
            role: Classifies the cells, walks rays, steers the arm and frames the gym and portrait screens.
            functions: [createCollisionGrid, cameraArm, steerOrbit, farView, outsideClearance, tripodLook, portraitFov]
        tests:
          - test/coastal-camera.test.mjs
          - test/coastal-camera-motion.test.mjs
          - test/visual/desk-scene.spec.js
        sources: [amanatides1987voxel, epic-spring-arm, reed2015depth]
        related:
          - record: homepage-desk-scene
            techniques: [camera-collision-field, spring-arm, far-coast-view, gym-tripod, portrait-fov]
        limits:
          - Ready about 3.3 s after the rooms stream in. Characters, P, the animals and the clifftop planting are not in the field.
          - Nothing scores the composition, and one 40 % threshold serves every room.
        watchlist:
          - source: oskam2009visibility
            effort: medium
            adds: Plans camera transitions through a visibility roadmap, so the subject stays in view while the camera moves around obstacles, a step past refusing moves that would hide it.
          - source: lino2015toric
            effort: medium
            adds: A compact camera space built around on-screen subject positions, so a room's framing could be composed rather than only kept clear.
        next:
          - move: Score candidate yaws for the subject's visibility near obstacles.
            readiness: needs-research
