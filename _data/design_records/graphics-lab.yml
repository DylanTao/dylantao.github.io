          `realism.mjs` gained the haze option and a depth texture on its multisampled target). `atmoHazeDepth` integrates
          the layer exactly along each ray (a 1,400 m mean free path at sea level and a 30 m scale height), and
          `atmoHazeSource` lights it with the sky a little above the horizon in the ray's azimuth, so the haze converges to
          the horizon colour the dome shows there. Between the far view's fog distances, surfaces blend into `atmoDome`, the
          dome's own colour along the ray. Three's linear fog stays defined so programs keep their keys and the sea mirror
          keeps a haze; the pass sets it aside for the beauty pass and restores the far view's distances for the evidence.
