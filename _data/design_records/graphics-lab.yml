      - id: wildlife
        name: Animals that plant their feet
        status: shipped
        since: "2026-10-02"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/wildlife.webp
          alt: Two Brandt's cormorants on a rock at the cliff foot, a California sea lion below them and the sea behind
          frame: Lab camera 4 m from a cormorant's roost, 15:00 on Friday, October 16, 2026, reduced motion.
        what: Twenty-eight skinned animals, from rabbits and sea lions to brown pelicans and Brandt's cormorants, act in irregular epochs sampled from time, with feet that hold their contacts on the exported terrain, rock and sea.
        how: >-
          Each species is one skinned mesh whose bones rest at identity, so backs bend, jaws open and tails, ears, flippers
          and wingtips follow through; 28 animals draw 56 primitives where 17 rigid-part animals drew 256. The acting is
          original and sampled from absolute active time, so a pause or a slow frame cannot accumulate drift. Epoch
          boundaries are jittered (`epochAt`), and posture channels are springs driven by keyed targets (`sprung`): a linear
          spring's response to stepped targets is the sum of one step response per change, so a turn overshoots and settles
          without integrating frames. `rabbitActing` holds a rabbit's travel at takeoff and landing and advances it only in
          the air, `raccoonMotion` keeps stance paws on world anchors while two-joint legs follow (`plantedFoot`),
          `shorebirdMotion` turns sandpipers at each zero-speed reversal, and `gullMotion` joins flight and perch with
          transitions continuous in acceleration. Pelicans fly a line a metre above the displaced sea the renderer draws,
          passing a wave of wingbeats down the line (`pelicanMotion`); `solvePerchLanding` fits each gull's webbed foot to
          exported perch triangles, and the cormorants stand on exported rock roosts.
        files:
          - path: assets/js/home-scene/wildlife-acting.mjs
            role: Epochs, keyed springs, glances, transfers and wingbeats.
            functions: [epochAt, sprung, wingbeat]
          - path: assets/js/home-scene/wildlife-motion.mjs
            role: Rabbit and marine acting.
            functions: [rabbitActing, pinnipedActing]
          - path: assets/js/home-scene/wildlife-neighbor-motion.mjs
            role: Raccoon, sandpiper and gull acting.
            functions: [raccoonMotion, shorebirdMotion, gullMotion, plantedFoot]
          - path: assets/js/home-scene/wildlife-seabird-motion.mjs
            role: The pelican line, its dive and the cormorants.
            functions: [pelicanMotion, cormorantMotion]
          - path: assets/js/home-scene/wildlife-perch-contact.mjs
            role: Gull feet on real perches.
            functions: [solvePerchLanding, samplePerchActing]
          - path: assets/js/home-scene/wildlife.mjs
            role: Skinned clones, populations, the off-screen gate and inspection.
        tests:
          - test/wildlife-motion.test.mjs
          - test/wildlife-neighbors.test.mjs
          - test/wildlife-seabirds.test.mjs
          - test/wildlife-perch-contact.test.mjs
        sources: []
        related:
          - record: homepage-desk-scene
            techniques: [skinned-animal-rigs, animal-repertoires, coastal-seabirds, animal-acting, perch-contact]
        limits:
          - Authored acting, with no aerodynamics, collision solver, feather simulation or motion capture.
