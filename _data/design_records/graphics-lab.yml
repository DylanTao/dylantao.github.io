        what: Four sheer linen panels on rings and bronze rods, and three towels and a shirt on a terrace line, in one small-step XPBD cloth with isometric bending, blowing in the coast's one wind.
        how: >-
          Rebuilt on October 18. `createClothIsland` in `cloth-solver.mjs` steps welded pattern meshes at 30 Hz with six
          substeps: colour-batched stretch and shear distance constraints on the fabric's own rest lengths, the isometric
          quadratic bending of Bergou and colleagues (`bendingWeights`), long-range attachments, ordering constraints that
          keep a gathered stack's folds from crossing, and contacts. `createCurtainCloth` hangs each panel from six rings on
          a pinch-pleated heading whose tape bows between pinches, and `createFacadeDraft` blows the coast's onshore breeze
          and the room's eddies through each open door. `createLaundryLine` pegs the towels and the shirt onto a line chain,
          each peg welding a corner to a line node, with the shirt's layers welded at the seams and kept apart, in the open
          coast's wind at an authored 42 % exposure (`createTerraceDraft`). `createSheerFabric` blends linen's translucency
          with slubs along the warp and a forward-scattering back light, and `createCurtainMeshes` draws each panel through a
          Catmull–Rom spline at three times the simulated resolution, column by column, so a stack's blended layers keep one
          order. `createCurtainRig` and `createLaundryRig` step only what is on screen and tall enough to see.
