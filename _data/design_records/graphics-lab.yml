      - id: light-in-the-air
        name: Marine fog, shafts and sunbeams
        status: shipped
        since: "2026-10-19"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/light-in-the-air.webp
          alt: The coast on a marine-layer morning from over the sea, a fog bank over the water climbing the cliff below the lit house, the mesa's pines in soft light under a pale gold sky
          frame: Lab camera about 120 m out over the sea, 07:30 on Friday, October 16, 2026 with ?weather=marine, reduced motion.
        what: On marine-layer mornings and some evenings a fog bank lies over the water and climbs the cliff, light streams through the shadows of the cliff, the pines and the house in the haze, and at golden hour sunbeams cross the rooms' dusty air through the glass front.
        how: >-
          A raymarch at half the canvas's resolution (a third or a quarter in full screen) walks each view ray through the
          haze, the marine fog and the house's indoor dust, testing each of 24 steps (18 indoors) against the sun's cached
          shadow map, and returns four numbers: the share of the haze's sunlit light that survives the shadows, which carves
          shafts from the analytic haze, the fog's transmittance and sunlit in-scattering, and the dust's. The fog is a bank
          whose top billows with two octaves of a periodic noise volume (`fogNoiseVolume`) drifting with the coast's breeze
          on the scene's clock, thinner over the land and kept out of the house; its light shades itself through the bank
          above. The full-size pass upsamples by depth, choosing among the four nearest samples, and interleaved gradient
          noise staggers the steps. The march runs only when it has something to show (fog, a low sun outside, or a low
          western sun reaching into the house); otherwise the haze stays analytic. `marineLayerAt` gives the bank's
          thickness through the day (thick before dawn, burnt off by 11:30, back after 18:30 on some days) and `marineTop`
          its height; the thickest mornings close a May Gray deck over the dome.
        files:
          - path: assets/js/home-scene/haze.mjs
            role: The march and the composite.
            functions: [createHaze]
          - path: assets/js/home-scene/atmosphere-model.mjs
            role: The weather and the fog's noise.
            functions: [weatherFor, marineLayerAt, marineTop, fogNoiseVolume]
          - path: assets/js/home-scene/controller.mjs
            role: The drift on the scene's clock.
            functions: [createCoastalHome]
        tests:
          - test/atmosphere.test.mjs
