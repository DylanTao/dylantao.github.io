      - id: onsen-water
        name: A height-field onsen
        status: shipped
        since: "2026-10-02"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/onsen-water.webp
          alt: Sirui soaking in the onsen on a Saturday afternoon, the clear water rippling around his hands and light patterns on the basin's floor
          frame: Lab camera over the pool, 16:10 on Saturday, August 22, 2026 (page clock fixed), after seven seconds of motion; captured October 19.
        what: The onsen is a 40 × 40 shallow-water height field whose waves carry water between cells, reflect off the rim and the bather, start from the bather's hand, and throw caustics on the basin.
        how: >-
          `createHeightfieldWater` follows section 2.1 of Chentanez and Müller: staggered heights and face velocities,
          conservative upwind depth fluxes, pressure from the free-surface gradient and reflecting solid faces, at fixed
          1/120 s ticks with CFL subdivision; total volume holds to about 10⁻¹⁴. `measurePoolGeometry` measures the real
          basin, about 0.127 m deep. `createPoolStroke` drives a slow hand skim, and the palm's submerged velocity relaxes
          nearby face velocities inside each step, so a resting hand adds no energy. `createOnsenWater` packs elevation,
          slopes and wet weight into a texture for the pool's material and runs only when the camera can see the pool. Since
          October 18 the basin's stone takes the water's light: light from above refracts into the water, and the simulated
          surface refocuses it by 1/|det(I + l(1 − 1/n) Hess h)| (`poolCausticGLSL`, the differential form of Watt's beam
          areas), with six sub-grid capillary-gravity ripples riding on the simulated waves (`poolRippleGLSL`), so a calm
          pool stays exactly flat.
        files:
          - path: assets/js/home-scene/heightfield-water.mjs
            role: The conservative shallow-water solver.
            functions: [createHeightfieldWater]
          - path: assets/js/home-scene/onsen-water.mjs
            role: The renderer adapter, the palm coupling, the caustics and the sub-grid ripples.
            functions: [createOnsenWater, poolCausticGLSL, poolRippleGLSL]
          - path: assets/js/home-scene/pool-geometry.mjs
            role: Measures the native basin.
            functions: [measurePoolGeometry]
          - path: assets/js/home-scene/pool-stroke.mjs
            role: The prescribed hand skim.
            functions: [createPoolStroke, samplePoolStroke]
          - path: assets/js/home-scene/ONSEN-WATER.md
            role: Equations, coupling limits and numerical evidence.
        tests:
          - test/onsen-water.test.mjs
          - test/onsen-caustics.test.mjs
          - test/pool-geometry.test.mjs
          - test/pool-stroke.test.mjs
        sources: [chentanez2010water, watt1990beam]
        related:
          - record: homepage-desk-scene
            techniques: [onsen-water]
        limits:
          - Shallow-water waves travel at the wrong speed when their wavelength nears the 12.7 cm depth or is shorter; the sub-grid ripples that carry the caustics are a rendering closure riding on the solver.
          - One-way coupling, with no wet and dry cells, splashes or buoyancy; caustics take one paraxial sheet for light from overhead.
        watchlist:
          - source: jeschke2023dispersive
            effort: medium
            adds: Splits each step into shallow-water bulk flow and Airy surface waves, so the hand's short ripples would travel at their true speed in this shallow basin.
          - source: chentanez2015coupling
            effort: large
            adds: Couples a height field to a 3D grid and particles where the surface breaks, for splashes when someone steps in or the spout drips.
