history:
  - date: "2026-10-14"
    title: Two renderers, one minute
    system: light-transport
    frame: I agreed to the Metropolis experiment. Show, on light the house actually has, when Markov chain Monte Carlo beats independent sampling and when it does not.
    dimensions:
      [
        paths next-event estimation cannot connect,
        the sun's size against a minute's budget,
        what equal means,
        how error is measured,
        where the reference comes from,
        how much of a visitor's processor the page may use,
      ]
    move: A dependency-free renderer of a simplified onsen whose single path sampler is fed independent numbers (path tracing) or mutated ones (Kelemen's Metropolis), raced in module workers on its own page.
    backtalk: After a minute path tracing was off by 984 % and Metropolis by 180 %. Metropolis's total brightness is itself a rare-event estimate, because the bootstrap usually holds no sun path. Lazily replayed small steps left a few-percent bias until unread coordinates were redrawn, and a slab shortcut created ghost water hits that tests now catch.
    reframe: The engine is ready for the pool light's caustics, and for manifold-based mutations if the race should be won outright.
    commit: "a1b4d3bd3"
    sources: [veach1997mlt, kelemen2002pssmlt, jakob2012manifold, zeltner2020sms]
  - date: "2026-10-16"
    title: One lab instead of a page per experiment
    system: method
    frame: Sirui wanted the graphics experiments written up as a record that newer SIGGRAPH papers could extend, and found a project page for every experiment too much, so he asked for a hierarchy.
    dimensions:
      [
        how many entries the projects index shows,
        what each experiment gets (its own page or a section of the record),
        what a row says at a glance,
        where the papers to try live,
        how a still stays honest,
      ]
    move: One Graphics Lab entry on the projects index, with a row per experiment that opens its own page (the light lab) or its section of this record, which gains entry-point functions, links to the coastal home record and a watchlist of newer papers with effort guesses. Light Paths in the Onsen keeps its address as a child of the lab.
    backtalk: The October noon sun stays below the light well's shaft, so the first light-well still showed no beam and the frame moved to an August noon. Night frames hid the steam and the hand's ripples, so those stills moved to daylight. A pattern meant to find the pines framed the avatar's spine instead. Checking the papers caught four DOIs in the draft list that resolved to other papers.
    reframe: Which paper comes first is Sirui's call; the shortlist puts a visible change in each of light, sky, water and wind.
    sources: [zeltner2020sms, hillaire2020sky, jeschke2023dispersive, diener2009wind]
  - date: "2026-10-18"
    title: Measure the frame, then cut what it actually spends
    system: performance
    frame: Sirui asked for further optimization of the site and the 3D scene, and for the state of the art to be written down for later models.
    dimensions:
      [
        per-pass draw attribution,
        script time against GPU time,
        uniform uploads,
        program switches,
        the shadow map,
        decoding,
        the full-screen buffer,
        pixel parity,
      ]
    move: >-
      Vector-array uniforms stored flat, opaque draws grouped by program, a cached static sun shadow, one shared Draco pool
      and a pixel budget for full screen, each measured interleaved against the same tree without it. Outside, script time
      per frame fell from 89.8 to 56.9 ms and draws from 1,554 to 1,292; the WebGPU question was priced and deferred, and
      the remaining work was ranked.
    backtalk: >-
      The outside view ran at about 10 fps. Per-pass attribution found four separate costs (three's transmission copy,
      the sea mirror, the shadow map and per-draw uniform uploads), and a CPU profile found the largest single cost in
      three's uniform code rather than in draw count. The first transmission check reported zero changed pixels, because
      hiding objects under reduced motion without requesting a frame re-captured the old frame; a sweep then showed the
      water from 21 of 108 cameras, and the gate built for it never engaged. A parity run differed by 2,334 px of
      wildlife, and holding the decoder change back showed the same race in the unchanged base.
    reframe: Per-draw uniform cost and the sea mirror remain; material sharing, a lighter mirror and a cheaper distant water are next, and the last two need Sirui.
    commit: "c861eed23"
    sources: [myers2021coldwar, binks2011dynres]
  - date: "2026-10-18"
    title: Linen on rings, and laundry in the breeze
    system: cloth-bodies
    frame: Sirui found the curtains "a bit weird" and asked for more cloth simulation, with three linen towels pegged on a sunny Mediterranean terrace as the reference.
    dimensions:
      [
        heading and hardware,
        fold shape from the rod to the hem,
        stack width and flare,
        translucency and grain,
        motion in gusts and lulls,
        cost per frame,
        a place for cloth to shine,
      ]
    move: >-
      A new small-step XPBD cloth with isometric bending, long-range attachments, fold ordering and welded patterns; the
      panels hang from six rings on bronze rods with a pinch-pleated heading, true rest lengths, a weighted hem, blended
      linen translucency and a refined drawn mesh, and three towels and a shirt hang pegged on a terrace line in the same
      wind.
    backtalk: >-
      The October 16 panels repeated the heading's corrugation at every row, so a gathered stack twisted like a ribbon in
      the doorway jet and alpha-to-coverage left a screen-door grain. A 10 cm bending length fanned a stack's hem 1.6 m
      wide. The first laundry exploded until each line node was tethered to both posts, and towels pegged flat hung like
      boards until they were pegged with slack. Drawn row by row, the blended stack showed a light line at every row where
      the drawing order between its layers flipped; drawn column by column it holds. The first tuning cost 3 to 5 ms a
      frame in a room view; six rings, 21 rows, six substeps and box tests against the view brought it to 3.4 ms of cloth
      in the kitchen view, within noise of the October 16 frame.
    reframe: Self-collision for the heading tape and the stack's contacts would pay off next, and vertex block descent could cut the substeps.
    commit: "6c796c017"
    sources: [bergou2006bending, macklin2019smallsteps, kim2012lra, catmull1974splines]
  - date: "2026-10-18"
    title: Water with depth, caustics and lamplight
    system: water-air
    frame: >-
      Sirui showed two three.js scenes he liked: a teal harbour that mirrors its lamps in long streaks through mist, and a
      Mediterranean cove whose turquoise shallows show the seabed with moving caustics. The Pacific was a painted teal
      with a wet-sand tint near the beach, and the onsen read as a white basin.
    dimensions:
      [optical depth over the seabed, caustics, the low sun, reflections at night, the waterline, the bath's light, GPU cost per frame, compile time]
    move: >-
      A seabed read from the coast's own geometry and extended offshore; the sea coloured by Lee and colleagues'
      shallow-water reflectance over it, with paraxial caustics from the wind ripples; a mirror stretched into vertical
      bands, the sun's path broken into glints and the terrace lamps' streaks; the swash on the captured waterline; and
      caustics in the onsen from its own simulated surface, with sub-grid ripples riding on the hand's waves.
    backtalk: >-
      The beach slopes only 0.75 m under the sea, so the seabed past it had to be extended. The hand's own waves focused
      light by a tenth of a percent in 13 cm of water, which is why the sub-grid ripples exist. The first version cost 4
      to 7 ms of GPU per frame outside; four-tap shadow compares, skipping unresolvable ripples and footprint-gated seabed
      detail brought it back to the base's range. The optics more than doubled the sea program's cold compile on ANGLE's
      Direct3D compiler until uniform-bound loops over flat arrays, explicit texture levels and a short integer hash
      brought it to 2.7 s against 2.1 s. Mean-preserving glints alone thinned the sunset path to scattered dots, because
      tone mapping compresses a rare bright flash far more than a steady path of the same mean, so half the lobe now stays
      a steady glow.
    reframe: The depth under every point is now known, so the swell itself can start to feel the seabed.
    commit: "9c4e4007b"
    sources: [pope1997water, lee1998shallow, lee1999shallow, watt1990beam, kasten1989airmass, hansen1974rayleigh]
  - date: "2026-10-19"
    title: A sunset by scattering
    system: water-air
    frame: >-
      Sirui asked for a better-designed sunset and reflections, softer haze at the scene's edges, and fog and light
      simulation: "just make sure things look great on first principle, don't get limited by old rules."
    dimensions:
      [
        the sky model,
        the sun's colour by altitude,
        the eye's adaptation,
        the haze's colour,
        the world's edge,
        fog density and depth,
        the march's budget,
        cold shader compile,
      ]
    move: >-
      Hillaire's three tables on the GPU with a JavaScript twin for the light colours and the tests; the sun's disc set by
      NOAA's minute and squashed by refraction; the moon and stars placed by Meeus and the Almanac; a post-pass haze from
      the depth buffer that converges to the horizon's colour and dissolves the world's edge into the dome; and a
      half-resolution, shadow-mapped march for fog, shafts and indoor sunbeams.
    backtalk: >-
      An explicitly lit haze drew a dark band above a sunset horizon until it took the horizon's own colour. An aerosol
      optical depth of 0.1 washed the golden hour out and the bloom spread a capped disc over the frame; 0.045 and a
      20-unit cap on the disc brought the gold back. Partial white balance turned the dawn sky green, and the first
      twilight lift brightened the sky after sunset until it was derived from the model's own zenith. The fog never
      showed: a reversed smoothstep is undefined in GLSL and ANGLE's Direct3D path returned 0, and a bank 11 m deep at
      300 m visibility is nearly transparent from above. The probe field's single horizon colour turned the shaded
      west-facing cliff red at sunrise until its bands were weighted toward the west.
    reframe: Clouds lit through Earth's shadow are the next step for the sunset.
    commit: "1104eb491"
    sources: [hillaire2020sky, bruneton2008atmosphere, noaa-solar, meeus1998algorithms, cox1954glitter, wronski2014fog, hillaire2015frostbite]
  - date: "2026-10-19"
    title: The performance work gets a page of its own
    system: performance
    frame: >-
      Sirui asked why the graphics and optimization work in the 3D home had no project pages he could see. The lab sat
      two closed decks down on the projects index, and this system, kept off the lab's rows, appeared nowhere a visitor
      would look.
    dimensions:
      [
        what a closed deck says about what it holds,
        which deck opens by default and on which screens,
        where the write-up sits in the hierarchy,
        what the write-up leads with,
        how the 3D home looks on its card,
      ]
    move: >-
      Every deck's face now names what it holds, branches first, each name a link to its page; the website revamp opens by
      default on screens at least 992 px wide. Making the 3D home fast, a child of the lab built from this system and the
      performance notes, joins the lab's page and deck as one Performance row, and the 3D home's card shows the renovated
      house at golden hour instead of a July frame of the first room.
    backtalk: >-
      Flattening the revamp's descendants gave fourteen names, too many for a card, so a face links six and counts the
      rest. The lab's deck had counted only experiments, so the write-up's card is counted separately from them. The two
      evidence stills under docs/ are not published, so the page carries copies.
    reframe: The title, the default-open deck and the names on each face are Sirui's call.
    sources: []
