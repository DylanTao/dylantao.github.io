          - source: cordonnier2017landscapes
            effort: large
            adds: Couples erosion with vegetation simulation, so the canyons and the planting could grow together instead of being placed by distance.
          - source: paris2019amplification
            effort: large
            adds: Amplifies terrain with implicit 3D features, the overhangs and caves a height field cannot hold, so the sea caves and undercut cliffs could belong to the ground itself.
        next:
          - move: Extend the shore samples so surf follows the new beaches.
            readiness: needs-decision

  - id: drawing
    name: Drawing
    summary: >-
      The house drawn in pen while it loads, traced offline from the authored views' geometry and morphed from drawing to
      drawing as each piece arrives.
    techniques:
      - id: loading-sketch
        name: A pen sketch while the house loads
        status: shipped
        since: "2026-10-14"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/loading-sketch.webp
          alt: Pen strokes drawing the bedroom while the 3D home loads, the bed and its duvet, a plant, the bedside lamp and a tall cupboard
          frame: The homepage 4.6 s into loading, at 04:00 on Friday, October 16, 2026 (page clock fixed), reduced motion (each drawing still).
        what: Pen strokes traced offline from geometry buffers draw the sea, the cliff, the cut-away house and the occupied room while the scene loads, then trace the first rendered frame.
        how: >-
          `strokesFrom` in `bin/build_loading_sketch.cjs` traces each authored view's object-ID and surface-normal passes,
          after Saito and Takahashi's geometry buffers: object outlines weighted by how much of the frame each object fills,
          creases sharper than about 57°, and long straight runs favoured by the structure tensor's coherence. Eight
          drawings pack into 45 KB. `createSketchEngine` flies strokes on a damped spring (`springStep`), pairs them with
          their next targets in Hilbert-curve order (`hilbertIndex`) so a morph flows instead of tangling, and lets a
          resting drawing breathe (`breathDepth`). `createLoadingSketch` hands an OffscreenCanvas to a worker so model
          parsing never stalls the strokes.
        files:
          - path: bin/build_loading_sketch.cjs
            role: Traces the drawings from the authored views.
            functions: [strokesFrom]
          - path: assets/js/home-scene/loading-sketch-core.mjs
            role: Stroke motion, Hilbert pairing, breathing and edge tracing.
            functions: [createSketchEngine, springStep, hilbertIndex, breathDepth, frameStrokes]
          - path: assets/js/home-scene/loading-sketch.mjs
            role: The page side, the worker hand-off and the first-frame trace.
            functions: [createLoadingSketch]
          - path: assets/js/home-scene/loading-sketch-worker.mjs
            role: Draws off the main thread.
          - path: assets/models/home/loading-sketch.json
            role: The packed drawings.
        tests:
          - test/loading-sketch.test.mjs
        sources: [saito1990comprehensible]
        related:
          - record: homepage-desk-scene
            techniques: [loading-sketch]
        limits:
          - The drawings are fixed captures of the authored views and go stale when a room or a camera changes.
          - Image-space outlines and creases only, with no view-dependent lines such as suggestive contours.
        watchlist:
          - source: decarlo2003suggestive
            effort: medium
            adds: Draws lines where a contour would appear from a nearby viewpoint, so rounded stones and the cliff's bulges would read as volume.
          - source: yang2018ftpsc
            effort: medium
            adds: Matches strokes between drawings while keeping their neighbours' layout, so morphs would pair strokes by shape instead of by Hilbert order.
          - source: benard2012active
            effort: medium
            adds: Image-space snakes that keep stylized lines coherent on animated 3D models, for the hand-off where the strokes trace the first live frame.
          - source: cole2008lines
            effort: small
            adds: Measures where artists draw lines on the same models, a test for which lines the tracer keeps.
        next: []

  # Performance is engineering on the same scene rather than a visible experiment, so its techniques stay off the
  # Graphics Lab page's rows; the page and the lab's deck show the system as one row that opens its write-up. Its
  # prioritized next techniques are the open problem `next-performance`, and the WebGPU decision is `webgpu`.
  - id: performance
    name: Performance
    index: false
    page:
      title: Making the 3D home fast
      url: /projects/graphics-performance/
      what: Where each frame went, the five changes that cut the view from outside from 89.8 to 56.9 ms of script, what I tried and dropped, and what comes next.
    thumbnail:
      path: assets/img/project_pics/graphics-lab/performance.webp
      alt: The authored view from outside at 1:20 in the afternoon, the house in its cliff above the beach, the frame the performance pass measured
      frame: The authored outside view on the weekday clock, Friday, October 16, 2026, 13:20, the view and hour bin/measure_coastal_views.cjs samples; captured October 19
    summary: >-
      Where the coastal home's frame goes, and what was cut on October 18, 2026. Outside, the frame was bound by three's
      per-draw work rather than by pixels, so the cuts target uniform uploads, program switches, shadow-map draws and
      decoding. In three interleaved pairs, script time per outside frame fell from 89.8 to 56.9 ms, draws from 1,554 to
      1,292, shadow-map draws from 353 to 91 and program switches from 579 to 173; at the 160 m coast script time fell from
      86.9 to 50.7 ms. Measured on one shared Windows laptop (Intel Core Ultra 7 155H, Arc integrated GPU, headless
      Chromium on ANGLE/D3D11, a 545 × 461 canvas), where other processes used about half the CPU, so draw counts, script
      time and pixel parity carry the result and frame rates only illustrate it. The next techniques, in priority order,
      and the WebGPU decision are under Open problems.
    techniques:
      - id: measurement-tools
        name: Per-pass frame attribution and still parity
        status: shipped
        since: "2026-10-18"
        what: Two scripts measure where each frame's time goes and prove when a change leaves a still frame untouched, so every cut below was measured interleaved, never batch against batch.
        how: >-
          `bin/measure_coastal_views.cjs` opens the home in a fresh headless browser per run, seeds page randomness, fixes
          the routine's clock at Friday 13:20 and samples the occupied study, the authored outside view and the 160 m coast
          for 6 s each. It attributes every WebGL draw to a pass by its viewport (the 2048 px sun shadow, the 384 px sea
          mirror, the beauty and output passes at the canvas size, the contact prepass), times the script inside the frame
          callback and, where the browser allows, the GPU with a timer query, and reads process CPU time. Variants run base,
          work, work, base, and the result is the median of run medians with the range. `bin/compare_coastal_stills.cjs`
          captures reduced-motion stills in the same order, and the base pair is the control.
        files:
          - path: bin/measure_coastal_views.cjs
            role: Per-view, per-pass frame cost in interleaved variants.
            functions: [instrument, measureRun]
          - path: bin/compare_coastal_stills.cjs
            role: Pixel parity, base, work, work, base.
            functions: [capture, compare]
          - path: docs/performance-notes.md
            role: How to measure, the results, the rules for later work and the next steps.
          - path: docs/evidence/performance-2026-10-18/README.md
            role: The October 18 tables, attribution, parity and decoding runs.
        tests: []
        sources: []
        limits:
          - Hiding objects under reduced motion needs a requested frame, or the capture repeats the old frame; the first transmission check reported zero changed pixels for that reason.
          - Other processes on the shared laptop stretch frame intervals while the page is idle, so frame rates are reported but not relied on.
        next: []
      - id: flat-vector-uniforms
        name: Vector-array uniforms stored flat
        status: shipped
        since: "2026-10-18"
        what: The light installations' and the light field's arrays of vectors are stored as flat Float32Arrays, so three no longer re-flattens them on every material switch, which was the largest single cost of an outside frame.
        how: >-
          Three r164 flattens a uniform that is an array of `Vector3` or `Vector4` element by element whenever a material's
          uniforms upload, and this scene switches material on nearly every draw, because each mesh owns its material. The ten
          arrays in `createLightInstallations` (4 or 12 vectors each) and the three in `createStaticLightField` cost about
          100,000 `Vector3.toArray` calls per outside frame: a CPU profile put 19.9 % of the main thread in `toArray` and
          7.9 % in three's `flatten`. As flat typed arrays they pass through untouched, and the GPU receives the same float32
          values (the CPU sampler keeps a double-precision copy). With every other change in place, holding these two files
          back left the outside frame at 80 ms of script against 42 to 47 ms, so this change is what makes the draw grouping
          and the shadow cache pay off.
        files:
          - path: assets/js/home-scene/light-installations.mjs
            role: Line and point emitters as flat arrays.
            functions: [createLightInstallations]
          - path: assets/js/home-scene/static-light-field.mjs
            role: Region bounds and the fallback as flat arrays.
            functions: [createStaticLightField]
        tests:
          - test/light-installations.test.mjs
          - test/static-light-field.test.mjs
        sources: []
        related:
          - record: homepage-desk-scene
            techniques: [light-installations, static-light-field]
        limits:
          - Every draw still refreshes its own material's uniforms; only materials shared between meshes would skip that.
        next:
          - move: Share identical materials between meshes, so runs of draws with one material skip three's material refresh. About 35 µs of script remain per outside draw; the expected saving is a further 20 to 40 % of outside script time, in about half a day.
            readiness: needs-decision
            why: It touches materials.mjs and realism.mjs, which the renovation owns.
      - id: program-sorted-draws
        name: Opaque draws grouped by shader program
        status: shipped
        since: "2026-10-18"
        what: Opaque draws that share a shader program run together, which cut program switches in an outside frame from about 580 to 173.
        how: >-
          Three r164 sorts opaque draws by material id, and with one material per mesh nearly every draw switched program,
          each switch re-uploading the camera, the light structs and the material's uniforms. `sortOpaqueByProgram` installs an
          opaque sort that groups draws by program and ranks each group by the earliest material id that uses it, so groups
          keep three's old relative order and the sea still draws before the beach, then sorts by material and depth. Against
          the same build without it, outside script time fell from 59 to 44 ms and the study's from 15.7 to 12.7 ms (two runs
          each). Only exact depth ties between surfaces of different programs can resolve differently: in matched stills 39
          pixels changed outside (at most 40 of 255 in one channel, on the clifftop planting and the glass front's edges), 6
          in the study and 4 at 160 m. An unranked first version changed about 340 pixels along the waterline.
        files:
          - path: assets/js/home-scene/draw-order.mjs
            role: The program-grouped opaque sort.
            functions: [sortOpaqueByProgram]
          - path: assets/js/home-scene/controller.mjs
            role: Installs the sort; `?draw-order=material` restores three's order.
          - path: docs/evidence/performance-2026-10-18/draw-order-outside-diff.png
            role: The 39 changed pixels, ringed.
        tests: []
        sources: []
        limits:
          - Whether any tie pixel matters is Sirui's call.
          - Merging static meshes stays rejected, because nearly every mesh is interactive, animated or wind-swayed.
        watchlist:
          - source: webgl-multi-draw
            effort: medium
            adds: Lets three's BatchedMesh draw the hinterland's 156 static primitives and the planting's 23 in a few multi-draw calls with per-object culling, about 100 to 150 fewer draws per pass outside, once each piece's transform is baked into its geometry.
          - source: greene1993hiz
            effort: medium
            adds: A hierarchical depth test that would skip the rooms hidden behind the cliff and the roof when the camera is out at the coast, where they draw about 130 meshes per pass.
          - source: hasselgren2016moc
            effort: medium
            adds: Rasterizes a few large occluders on the CPU into a coarse depth buffer and tests room bounds against it, answering in the same frame instead of a frame late like a GPU query.
          - source: haar2015gpudriven
            effort: large
            adds: Two-phase occlusion culling that reuses last frame's visible set, which would hide the rooms from the coast without the pop-in of a one-frame-late query.
          - source: decoret2003billboard
            effort: large
            adds: Replaces the far hinterland canopy (82,000 triangles in 19 chunks) and the clifftop flora (184,000) with a few textured planes at distance, cutting triangles where they are smallest on screen.
        next: []
      - id: two-stage-shadow-cache
        name: A cached static sun shadow
        status: shipped
        since: "2026-10-18"
        what: Casters that never move are drawn into the 2048 px sun shadow map once and copied in each frame; only moving casters are drawn over the copy.
        how: >-
          `createShadowCache` wraps three's shadow pass. Static casters go into a cached map; each frame `blitFramebuffer`
          copies the cached packed depth and depth buffer into the light's map, and the moving casters are drawn over it
          without a clear: the two-stage cache of Myers's shadows for Call of Duty: Black Ops Cold War, the same split as Unity
          HDRP's cached shadows and Unreal Engine's virtual shadow map page cache. Movement is observed, not declared: a change
          of world matrix, geometry, position or index buffer version, draw range or material makes a caster dynamic until it
          has held still for 30 rendered frames, twice as long each time it moves again (up to 1,800). Skinned, morphing,
          instanced and batched meshes and casters with their own depth material, such as the swaying planting, always are.
          The cache is redrawn when the static set changes, when the light or its shadow camera moves (the coast's shadow
          square follows the camera target in whole texels; the sun follows the clock, checked every 30 s) or when the map is
          replaced: 12 rebuilds in 1,795 study frames. Shadow-map draws per frame fell from 267 to 37 in the study, 353 to 82
          outside and 404 to 91 at the coast. Redrawing the whole map inside a live frame matched the cached map to the texel
          in 7 of 8 checks; the eighth differed in 1 of 4,194,304 texels, an exact tie between a static and a moving caster.
        files:
          - path: assets/js/home-scene/shadow-cache.mjs
            role: Caster classification, the cached map and the per-frame copy.
            functions: [createShadowCache]
          - path: assets/js/home-scene/controller.mjs
            role: Installs the cache; `?shadow-cache=0` turns it off, and the lab's check compares it with a full redraw.
            functions: [verifyShadowCache]
        tests:
          - test/coastal-shadow-cache.test.mjs
        sources: [myers2021coldwar, unity-hdrp-shadows, epic-vsm]
        limits:
          - Three r164 tests shadow layers against the main camera, so the split toggles `castShadow` around each pass.
          - A caster animated only in its vertex shader without its own depth material would be cached in place. None exists, and the performance notes make it a rule.
        next:
          - move: Cull room casters by the camera's cell, so a room the camera cannot see leaves the moving set.
            readiness: needs-measurement
      - id: draco-worker-pool
        name: A shared Draco decoder pool
        status: shipped
        since: "2026-10-18"
        what: Every model loader on the page shares one pool of up to four Draco decoder workers, so a model's primitives decode in parallel.
        how: >-
          Three's GLTFLoader decodes each Draco primitive as its own task, and one worker per loader serialized them.
          `createModelLoader` gives every loader on the page (the home, its wildlife, the footer coast) one pool of half the
          cores, at most four, and ends it when the last loader is disposed. In isolation (eight interleaved rounds, warmed
          decoders, median) the house shell decoded in 118 ms instead of 323, the avatar in 130 instead of 315, the kitchen in
          74 instead of 151 and the hinterland in 180 instead of 388. Because the pool outlives any one load, it must not
          remember a failure: a failed decoder download is fetched again by the next decode, a failed worker is retired, and
          a retry after a failed load starts fresh.
        files:
          - path: assets/js/home-scene/model-loader.mjs
            role: The shared pool, its reference count and its failure handling.
            functions: [createModelLoader, StaticDracoLoader]
        tests:
          - test/coastal-model-loader.test.mjs
        sources: []
        related:
          - record: homepage-desk-scene
            techniques: [streaming-order]
        limits:
          - In full cold starts on the loaded laptop the gain disappeared in the noise. Startup is dominated by compiling about 70 shader programs, 12 to 19 s to the first composed frame there.
          - Decode order now varies, which exposes a race in how reduced-motion wildlife poses compose (2,334 px of animals in different poses, seen in the unchanged base too).
        watchlist:
          - source: kapoulkine2020pr1830
            effort: small
            adds: Meshopt decoded 3.4 to 7.5 times faster than the four-worker Draco pool here (the house shell in 23 ms instead of 118) at 1 to 46 % more bytes after gzip; it would run as a post-process after the Blender export, with quantization matched to the Draco settings and the planting's custom attributes kept.
        next: []
      - id: pixel-budget
        name: A drawing-buffer pixel budget with adaptive density
        status: shipped
        since: "2026-10-18"
        what: The drawing buffer is capped at 2.1 megapixels, and a full-screen buffer of a megapixel or more steps its density down only while frames wait on the GPU.
        how: >-
          Full screen can ask for 2560 × 1440 CSS pixels at a device pixel ratio of 1.5, about 8.3 MP, where the 4×
          multisampled half-float composer targets alone take on the order of a gigabyte. `createResolutionGovernor` caps the
          buffer at `PIXEL_BUDGET` (a 2560 × 1440 screen at DPR 1.5 draws 1920 × 1080). On buffers of 1 MP or more it steps
          density down by 0.85, to no less than 0.7, only while frames are slow and waiting on the GPU rather than on script;
          it keeps a step only if the 75th-percentile frame time improves by 10 %, stops after two unhelpful probes, steps
          back up after three fast seconds and never moves while the scene is still, after Binks's dynamic resolution
          rendering and the hysteresis of drei's PerformanceMonitor. It scales the logical size handed to the renderer and to
          the finish composer, never the pixel ratio the composer captured, so every pass stays at the canvas size. In the
          home's full screen at 2560 × 1440 and DPR 1.5, main drew 3840 × 2160 at 4.4 fps in the study and 2.7 fps outside;
          with the budget the buffer was 1642 × 923, at 11.9 and 6.1 fps.
        files:
          - path: assets/js/home-scene/resolution.mjs
            role: The budget and the adaptive factor.
            functions: [createResolutionGovernor, PIXEL_BUDGET]
          - path: assets/js/home-scene/controller.mjs
            role: Feeds the renderer and the composer; `?resolution=fixed` keeps the budget without adaptation.
        tests:
          - test/coastal-resolution.test.mjs
        sources: [binks2011dynres, drei-performance-monitor]
        related:
          - record: homepage-desk-scene
            techniques: [world-fullscreen]
        limits:
          - The ordinary canvas (0.25 to 1 MP) never adapts. Outside frames are bound by draw submission, so fewer pixels would only blur.
        watchlist:
          - source: yang2020taa
            effort: large
            adds: Temporal antialiasing in place of the 4× multisampled half-float targets would save bandwidth and allow a lower internal resolution, but only with correct motion vectors for the skinned, swaying and cloth meshes.
        next:
          - move: When frames are GPU-bound, lower the multisample count before the resolution.
            readiness: needs-decision
            why: It changes the composer targets in realism.mjs, a look decision.
          - move: Cap ambient animation at 60 fps on high-refresh displays, keeping the full rate while the visitor drags.
            readiness: needs-decision
            why: A smoothness decision, and untestable on this 60 Hz headless setup.
      - id: transmission-gate
        name: A visibility gate for three's transmission copy
        status: retired
        since: "2026-10-18"
        what: An occlusion-query gate that would have skipped three's opaque copy for refraction whenever no transmissive surface was visible from a held camera pose.
        how: >-
          Three redraws every opaque object into a full-size multisampled target whenever a transmissive mesh survives
          frustum culling (the onsen water, the coffee hopper's glass), about a quarter of an outside frame's draws. In a sweep
          of 108 coast cameras the onsen water showed from only 21, at 3 to 143 pixels, so hiding it outright was not
          acceptable. The gate queried the transmissive meshes' padded bounding boxes against the shell, coast and room depth
          at a pose held still, and used the answer only for that exact pose.
        files: []
        sources: [webgl2-spec]
        limits: []
        next: []
        retired:
          date: "2026-10-18"
          reason: It was correct but never engaged. All 13 queries in a 12-angle sweep said visible, because the padded boxes show between the cedar slats, over the pool rim and through the glass front where the meshes add no pixels, and the damped camera rarely repeats a pose exactly. It was removed before the performance work merged; a non-transmissive stand-in for distant water is the open move.

  - id: method
    name: How the lab is kept
    index: false
    summary: >-
      The tools that keep the Graphics Lab page and this record honest: stills captured from the live scene, and a brief
      that ranks the next moves and the papers to try.
    techniques:
      - id: lab-stills
        name: Stills from the live scene
        status: shipped
        since: "2026-10-16"
        what: Each thumbnail is a frame of the running scene at a named hour, room and camera, scaled but not retouched.
        how: >-
          `bin/capture_graphics_lab_stills.cjs` opens the homepage's authoring lab (`?scene-lab=1`) in headless Chromium,
          sets the hour, the room and, where the authored view does not show a technique, a lab camera or a camera aimed at a
          named object. It fixes the page clock, to Friday, October 16, 2026 unless a still names its own date, so a capture
          on a weekend keeps the weekday routine; removes the homepage's feathered edge so a frame reads on either theme; and
          writes each 4:3 frame with its scene evidence to an unwatched folder. The loading sketch needs a run of its own,
          because once earlier stills have compiled the house's programs the browser's shader cache shows the house before
