          in its file, that every watchlist paper is a listed source the technique does not already build on, and that each
          link to the coastal home record resolves.
        files:
          - path: bin/design_record_brief.py
            role: The brief, with candidate moves and papers to try.
            functions: [build_brief, watchlist, markdown]
          - path: test/test_design_records.py
            role: The record's checks.
        tests:
          - test/test_design_records.py
        sources: []
        limits:
