        related:
          - record: homepage-desk-scene
            techniques: [daylight]
        limits:
          - Single scattering with an isotropic allowance for the fog's multiple scattering; no froxel volume and no temporal accumulation, so the 24 samples show as a faint grain in thin shafts.
          - Shafts exist only inside the sun's shadow square (36 m around the authored coast view, 120 m at 160 m), and surfaces inside the fog keep their direct sunlight.
          - The weather's monthly chances follow the season's known shape, not a fit to a station record.
