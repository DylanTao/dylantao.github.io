# Technical record for the graphics and simulation experiments in the homepage's coastal home, rendered at
# /projects/graphics-lab/record/, served as JSON at /assets/json/design-records/graphics-lab.json, and drawn on
# the Graphics Lab page (/projects/graphics-lab/) by _includes/graphics_lab.liquid.
#
# Schema version 1, as in homepage-desk-scene.yml, plus optional fields this record uses (test/test_design_records.py
# checks them):
#   systems[].index: false   keeps a system's techniques off the Graphics Lab page; they stay in this record
#   systems[].page           {title, url, what}: a write-up of a system kept off the page, which the page and the
#                            lab's deck then show as one row (Performance, /projects/graphics-performance/)
#   systems[].thumbnail      {path, alt, frame}: that row's still, as for a technique
#   techniques[]
#     page                   {title, url}: the experiment's own page, when it has one
#     thumbnail              {path, alt, frame}: a frame of the live scene (bin/capture_graphics_lab_stills.cjs)
#     related[]              {record, techniques[]}: the same work in another record, for its full build history
#     watchlist[]            {source, adds, effort}: newer work that would advance the technique; the source is listed
#                            below and is not one the technique already builds on. Effort is small (days inside one
#                            module and its tests), medium (a new module or render pass) or large (a new pipeline,
#                            such as GPU compute, ray tracing or learned motion).
#     files[].functions      the key functions or exports in that file; each name must appear in the file
#   sources[].venue, .year   required for watchlist papers
#   bench[]                  {name, what}: work in progress that has not reached the scene
#   shortlist[]              {technique, source}: watchlist entries proposed as the next experiment
#
# The coastal home record keeps each technique's full implementation notes and every design move; this record keeps
# each technique's method, entry points, research lineage, limits and the papers to try next. When a move changes a
# method, update both. Cite only sources you have checked against a DOI record, a publisher page or the authors' page.
# Run `python -m unittest test.test_design_records` before committing.

schema_version: 1
slug: graphics-lab
title: Graphics Lab, a technical record
project:
  title: Graphics Lab
  url: /projects/graphics-lab/
  source: _projects/graphics-lab.md
record_url: /projects/graphics-lab/record/
json_url: /assets/json/design-records/graphics-lab.json
repository: https://github.com/DylanTao/dylantao.github.io
branch: main
updated: "2026-10-19"
summary: >-
  The rendering and simulation experiments behind the homepage's coastal home, one technique at a time: what each does
  in the scene now and which files and functions hold it, the papers it adapts, what it cannot do yet, and newer papers
  that would take it further, each with what it would add and a rough effort. A performance system records where the
  frame goes, what was cut on October 18, 2026, and the next techniques to try in priority order.
scope: >-
  Each experiment adapts a published method in a small, bounded form for a browser scene, and each entry says where it
  simplifies. Thumbnails are frames of the live scene with the scene's clock set to Friday, October 16, 2026: most were
  captured on October 18, after the renovation and the skinned wildlife, and the sea, the sky, the haze, the fog, the
  linen, the onsen and the coast's far views on October 19, at golden hour where the light matters. The light well, the
  steam and the onsen are dated in late August, when the noon sun reaches the shaft and the bath runs in daylight.
  Measurements come from one shared Windows laptop (Intel Core Ultra 7 155H with Arc integrated graphics) unless an entry
  says otherwise. Shader warmup and loading are in the coastal home record.
credit: >-
  Compiled on October 16 to 19, 2026 by Anthropic's Claude from the code, the scene notes and the coastal home record,
  for Sirui Tao to review. The performance system and the renovation's surfaces joined on October 18, and the sea's
  optics, the cloth, the scattering sky, its haze and the marine fog on October 19, from entries the agents who built
  them prepared and checked. Every citation was checked against its DOI record, its publisher's page or its authors'
  page.

read_first:
  - path: _data/design_records/homepage-desk-scene.yml
    why: The coastal home record. Each technique's full implementation notes, its design moves and the house's constraints.
  - path: docs/homepage-desk-scene-brief.md
    why: The active brief. The 2D-first rule, the San Diego routine and the acceptance evidence map.
  - path: assets/js/home-scene/PHYSICS.md
    why: The ocean, the coast's wind, the record mechanics and the curtains, with equations, sources, evidence and limits.
  - path: assets/js/home-scene/CONTACT-LIGHTING.md
    why: The horizon integral, its reconstruction and the controlled comparisons.
  - path: assets/js/home-scene/ONSEN-WATER.md
    why: The height-field pool, its hand coupling and its numerical evidence.
  - path: assets/js/home-scene/SKIN-DIFFUSION.md
    why: The curved-patch diffusion integral, metric curvature and the exact shader hook.
  - path: assets/js/home-scene/THERMAL-STEAM.md
    why: Steam transport, light integration around glass and the light-well mask.
  - path: docs/static-light-field.md
    why: The traced sky and lamp bounce, its probes and its cost.
  - path: docs/coherent-wind-equations.md
    why: The curl field, leaf attachment and particle integration.
  - path: docs/performance-notes.md
    why: How to measure the frame, what was cut on October 18, the rules for later work and the next techniques to try.

constraints:
  - The homepage opens in 2D on every screen, 3D loads only on request, and any WebGL or model failure returns the 2D desk. No experiment may change that.
  - Every simulation advances on the scene's active clock in fixed ticks, accepts at most 0.25 s per call and drops the rest. Paused, hidden, offscreen and reduced-motion scenes compose a still frame.
  - Every new material, pass or override draw joins `program-warmup.mjs`, or its first draw blocks the page.
  - A change meant only to save cost must change 0 pixels in seeded, paused-clock captures; a change of look needs a matched A/B, measured interleaved.
  - The scene renders through WebGL2 and three.js r164, with no compute shaders and no ray queries; GPU work is vertex and fragment passes.
  - Store any array-of-vectors uniform as a flat `Float32Array`, and give a caster animated only in its vertex shader its own depth material, or the shadow cache keeps its shadow in place.
  - Each technique's notes say where it simplifies the paper it adapts. Never present an adaptation as a full reproduction or as the state of the art.

tests:
  - path: test/test_design_records.py
    covers: This record's schema, paths, named functions, links to the coastal home record, sources and watchlists.
    command: python -m unittest test.test_design_records
  - path: test/light-lab.test.mjs
    covers: The light lab's optics against Fresnel and Snell, its water hits, and agreement between the two estimators.
    command: node --test test/light-lab.test.mjs
  - path: test/coastal-physics.test.mjs
    covers: Wave derivatives, slope-energy accounting, water Fresnel and La Jolla's sun.
    command: node --test test/coastal-physics.test.mjs
  - path: test/coast-wind.test.mjs
    covers: The coast's breeze against the station means, its gust fronts, the wind sea and the planting's sway.
    command: node --test test/coast-wind.test.mjs
  - path: test/onsen-water.test.mjs
    covers: Conservation, reflecting boundaries, energy decay and the hand's coupling in the pool.
    command: node --test test/onsen-water.test.mjs
  - path: test/steam-transport.test.mjs
    covers: Steam transport across frame rates, positive diffusion and Beer–Lambert composition.
    command: node --test test/steam-transport.test.mjs
  - path: test/cloth-solver.test.mjs
    covers: Bending weights, stretch bounds, energy decay, no tunnelling, determinism and allocation-free steps.
    command: node --test test/cloth-solver.test.mjs test/curtain-cloth.test.mjs test/curtain-schedule.test.mjs test/laundry-line.test.mjs
  - path: test/sea-optics.test.mjs
    covers: The seawater optics, the shallow-water reflectance, the caustic lens, the seabed fill and the setting sun's light on the sea, and the onsen's caustics and sub-grid ripples.
    command: node --test test/sea-optics.test.mjs test/onsen-caustics.test.mjs
  - path: test/atmosphere.test.mjs
    covers: The sunset minute, the sky's colour through dusk, the moon and the weather.
    command: node --test test/atmosphere.test.mjs
  - path: test/skin-diffusion.test.mjs
    covers: The diffusion integral's normalization, limits and curvature.
    command: node --test test/skin-diffusion.test.mjs
  - path: test/coastal-lift-rig.test.mjs
    covers: The lifts' reach, contacts and head clearances on every avatar.
    command: node --test test/coastal-lift-rig.test.mjs test/coastal-gym-session.test.mjs test/coastal-training.test.mjs
  - path: test/coastal-shadow-cache.test.mjs
    covers: Which casters the shadow cache keeps, what redraws it, and the cases that keep three's own shadow path.
    command: node --test test/coastal-shadow-cache.test.mjs test/coastal-resolution.test.mjs test/coastal-model-loader.test.mjs
  - path: test/visual/desk-scene.spec.js
    covers: Nonblank WebGL, the rooms, recovery and reduced motion in a real browser.
    command: npm.cmd run test:visual:scene

systems:
  - id: light-transport
    name: Light
    summary: >-
      Light that has to be traced rather than rasterized: down a drilled shaft, around the house's walls, into the creases
      where things touch, and through rippled water in a lab page of its own.
    techniques:
      - id: light-paths
        name: Light paths through the onsen
        status: experimental
        since: "2026-10-14"
        page:
          title: Light Paths in the Onsen
          url: /projects/light-paths/
        thumbnail:
          path: assets/img/project_pics/graphics-lab/light-paths.webp
          alt: The lab's onsen rendered twice, specks of path tracing on the left and Metropolis light transport's sunlit pool floor on the right
          frame: The lab's eleven-minute comparison at 800 × 600, scaled.
        what: A plain-JavaScript renderer races path tracing against Metropolis light transport on the sunlight the light well bends through the onsen's water.
        how: >-
          `createRenderer` in `core.mjs` builds one path sampler that reads every random decision from a fixed coordinate
          of a sample vector. `PathTracer` feeds it fresh numbers and `MetropolisRenderer` feeds it Kelemen and colleagues'
          small and large mutations, so the two estimators share every line of path construction. Both use next-event
          estimation to the sun and sky with power-heuristic multiple importance sampling, after Veach, and water hits use
          safeguarded Newton iteration on seven frozen ripples. The page runs each estimator in a module worker for the
          same wall time, and `make_light_lab_reference.mjs` splits path space at the first hit for a 24-minute reference.
        files:
          - path: assets/js/light-lab/core.mjs
            role: The scene, the path sampler and both estimators.
            functions: [createRenderer, createScene, tracePath, MetropolisRenderer]
          - path: assets/js/light-lab/worker.mjs
            role: One estimator per worker.
          - path: assets/js/light-lab/page.mjs
            role: The race, its chart and the still frames.
          - path: bin/make_light_lab_reference.mjs
            role: The reference renderer, split by path type.
        tests:
          - test/light-lab.test.mjs
        sources: [veach1997mlt, kelemen2002pssmlt, veach1997thesis, pbrt3-mlt]
        related:
          - record: homepage-desk-scene
            techniques: [lab-renderer, lab-race, lab-reference]
        limits:
          - A simplified scene. A box grotto, frozen ripples, no steam, a round opening instead of the tilted shaft, and a sun three times its real size by default.
          - Metropolis takes its total brightness from independent samples that usually miss the sun, and its chains start in skylight.
        watchlist:
          - source: zeltner2020sms
            effort: medium
            adds: Solves for the path through the water from a point on the pool floor to the sun, so even plain path tracing could aim at the sun. The lab's pool has a single refracting surface, the method's simplest case.
          - source: loubet2020slope
            effort: medium
            adds: Integrates the light arriving through each facet of a triangulated water surface in closed form, a next-event estimator for caustics under water.
          - source: jakob2012manifold
            effort: large
            adds: Moves a chain along the family of paths that stay connected through the water instead of hoping a random change does, so the race's caustic paths would mix much faster.
          - source: muller2017guiding
            effort: medium
            adds: Learns which directions reach the sun from each region and samples them, an unbiased alternative to Metropolis whose independent samples also give the image's brightness.
        next:
          - move: Add the pool light to the lab scene and render its caustics on the vault.
            readiness: needs-research
      - id: light-well
        name: A light well with traced shaft light
        status: shipped
        since: "2026-10-14"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/light-well.webp
          alt: The onsen at noon in late August, a hazy beam from the light well falling across the room onto the pool
          frame: Onsen view, 12:40 on August 20, 2026 (page clock fixed), reduced motion.
        what: A shaft drilled from the clifftop brings sun into the onsen, and its beam, its sun patch, its skylight and the lit steam share one visibility function.
        how: >-
          `bin/coastal_lightwell.py` drills a shaft of 0.42 m radius through 1.67 m of rock, leaning 28° toward the noon
          sun. `createLightWell` in `light-well.mjs` follows four light paths. The sun's shadow map carries the patch on the
          floor or the water. Dust and humid air in the beam are single scattering with a forward Henyey–Greenstein phase,
          marched only inside the shaft's elliptic cylinder, after Wronski. `shaftExitRadiance` path-traces the drilled
          cylinder on a fixed Halton sequence for the radiance leaving the aperture, and the aperture and the sun patch then
          light the bath as two small area lights in closed form (`wellIrradianceGLSL`).
        files:
          - path: assets/js/home-scene/light-well.mjs
            role: Shaft visibility, the beam, the traced aperture radiance and the area lights.
            functions: [createLightWell, shaftExitRadiance, wellOpenFraction, wellSunPatch, wellIrradianceGLSL]
          - path: bin/coastal_lightwell.py
            role: The drilled shaft and the shadow-only vault.
          - path: assets/js/home-scene/steam-volume.mjs
            role: Masks the steam's sunlight with the shaft's visibility.
        tests:
          - test/light-well.test.mjs
        sources: [wronski2014fog]
        related:
          - record: homepage-desk-scene
            techniques: [light-well]
        limits:
          - The shaft passes 5.5 % of the sky, so outside midday the grotto is darker than an open bath. The beam needs a high sun; the October 16 noon frame shows none, the August 20 frame does.
          - The two area lights are Lambertian, so the wet rim and the water show no glossy reflection of the aperture.
          - The beam's scattering sees only the shaft's own visibility, not the bather or the screens.
        watchlist:
          - source: heitz2016ltc
            effort: medium
            adds: Shades polygonal area lights with rough specular lobes in closed form, so the aperture and the sun patch would gleam on the wet rim and the water instead of only lighting them diffusely.
          - source: chen2011minmax
            effort: medium
            adds: Computes single scattering with shadows from a shadow map, one slice of rays at a time, so the beam and the steam could show the bather's shadow.
        next: []
      - id: light-field
        name: Traced sky and lamp bounce
        status: shipped
        since: "2026-10-02"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/light-field.webp
          alt: The renovated office at 23:10, Sirui coding at the L-shaped marble desk, the brass task lamp's warm light bouncing onto the desk, the floor and the bookshelf wall
          frame: Study view, 23:10 on Friday, October 16, 2026, reduced motion.
        what: A CPU ray tracer bakes sky visibility and one diffuse bounce into probe cages once, then relights them from the actual sky and lamp powers without tracing again.
        how: >-
          `createStaticLightField` builds a triangle BVH over the house's static opaque meshes (`createTriangleBVH`),
          traces eight cosine-weighted sky rays per primary hit, and stores irradiance as first-order spherical harmonics
          (`accumulateL1`, `evaluateL1`) in 64 probes, eight per room-sized cage, with octahedral distance moments, after
          Ramamoorthi and Hanrahan and the probe visibility of Majercik and colleagues. Unit sky and lamp bases let a change
          of hour recombine the cache with zero rays, and since October 19 the three sky colours are fitted to the scattering
          sky's irradiance, weighted toward the west the house faces. The field replaces three.js's ambient terms once; direct light,
          reflections and refraction stay native. The bake runs in yielded slices and frees its accelerator afterwards. When
          the renovation moved the rooms, the cages followed: the living room and the gym got cages of their own, 61 of the
          64 probes stand in free space, and the living room's washi lantern, whose closed globe had hidden its bulb from the
          bake's 0.18 m emitter radius, declares a 0.26 m emitter so its bounce is no longer zero.
        files:
          - path: assets/js/home-scene/static-light-field.mjs
            role: Probe cages, the bake and the shader binding.
            functions: [createStaticLightField, STATIC_LIGHT_REGIONS]
          - path: assets/js/home-scene/light-trace-core.mjs
            role: The triangle BVH and the diffuse quadrature.
            functions: [createTriangleBVH, cosineDirections, accumulateL1, evaluateL1]
          - path: docs/static-light-field.md
            role: Equations, ownership and cost.
        tests:
          - test/static-light-field.test.mjs
          - test/visual/static-light-field.spec.js
        sources: [ramamoorthi2001irradiance, majercik2019ddgi, pbrt4-bvh]
        related:
          - record: homepage-desk-scene
            techniques: [static-light-field]
        limits:
          - Static and one bounce. People, props and swaying plants do not shade it.
          - Four coefficients lose directional contrast, and sparse probes can leak at thin walls.
        watchlist:
          - source: iwanicki2017dice
            effort: medium
            adds: A basis of twelve lobes on an icosahedron's vertices with close to third-order quality from fewer reads, which would restore the directional contrast four coefficients flatten.
          - source: silvennoinen2017probes
            effort: large
            adds: Precomputes, for each receiver, which few probes it can see, so the bounce would stop leaking through thin walls.
          - source: rodriguez2020glossy
            effort: large
            adds: Stores multi-bounce glossy light in probes and reprojects it, so the glass, the water and the polished wood would reflect the lit house rather than the environment map.
        next: []
      - id: contact-light
        name: Horizon-based contact light
        status: shipped
        since: "2026-10-01"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/contact-light.webp
          alt: The office at 15:00, Sirui at the marble desk, soft contact shadows under the monitors, the laptop, the turntable and the shelves
          frame: Study view, 15:00 on Friday, October 16, 2026, reduced motion.
        what: A visibility buffer computed before the beauty pass darkens only indirect diffuse light near contacts, with the closed-form horizon integral of ground-truth ambient occlusion.
        how: >-
          `contact-occlusion.mjs` projects the geometric normal into four fixed view-aligned slices and integrates the
          cosine-weighted visibility above each slice's two horizons in closed form (`horizonIntegral`), Jimenez and
          colleagues' inner integral, with at most 32 depth probes per pixel. A 3 × 3 reconstruction keeps neighbours on the
          same tangent plane (`bilateralWeight`), and the paper's cubic fit adds back the light a pale neighbourhood bounces
          (`bounceVisibility`). `bindContactLighting` scales only each material's indirect diffuse term, so sunlight,
          emission and reflections are untouched, and a still composes the same way every time.
        files:
          - path: assets/js/home-scene/contact-occlusion.mjs
            role: The horizon integral and the edge-aware reconstruction.
            functions: [horizonIntegral, bounceVisibility, bilateralWeight, bindContactLighting]
          - path: assets/js/home-scene/realism.mjs
            role: The room finish that runs the pass.
            functions: [createFinish]
          - path: assets/js/home-scene/CONTACT-LIGHTING.md
            role: Equations, controlled comparisons and cost.
          - path: assets/js/home-scene/contact-lab.html
            role: An unlisted comparison page.
        tests:
          - test/coastal-contact-lighting.test.mjs
          - test/coastal-contact-rendering.test.mjs
        sources: [jimenez2016gtao]
        related:
          - record: homepage-desk-scene
            techniques: [contact-occlusion]
        limits:
          - Screen-space, so it cannot see hidden or offscreen geometry and overestimates thin occluders.
          - Four fixed slices keep a directional bias, and there are no bent normals or specular occlusion.
        watchlist:
          - source: therrien2023bitmask
            effort: medium
            adds: Replaces the two horizons with a bitmask of occluded sectors, so light passes behind thin shelves and chair legs and nearby surfaces add one bounce of their colour.
        next:
          - move: Specular occlusion and bent normals from the same report (its GTSO), so reflections dim in creases too.
            readiness: needs-research

  - id: surfaces
    name: Surfaces
    summary: >-
      The renovation's stone family, computed in the shader from world position: lime plaster on every wall, milky veined
      marble and travertine, with no texture downloads.
    techniques:
      - id: lime-plaster
        name: Lime plaster, marble and travertine from noise
        status: shipped
        since: "2026-10-17"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/lime-plaster.webp
          alt: The renovated living room in the afternoon, a white U-sofa facing the TV on a plaster media wall, lime-plaster walls, a travertine drum table and an oak floor
          frame: Living room view, 16:30 on Friday, October 16, 2026, reduced motion.
        what: Walls carry soft clouds and overlapping trowel strokes, the office desk and the kitchen run wandering marble veins, and the tables travertine's bands and pores, all from noise evaluated at each surface point.
        how: >-
          `finishPhysicalMaterial` keys a procedural kind by material name and builds every pattern from hashed value noise
          in world-space metres (`surfaceNoise`), so the scale survives the glTF exports' many UV layouts. Plaster blends soft
          clouds about a metre across with streaks of noise stretched along three stroke directions whose mix changes from
          patch to patch, drawn in the three axis planes and weighted by the surface normal, Geiss's triplanar texturing, so a
          curved vault shows no seam; a faint burnish lowers roughness along the strokes. Marble's veins are the sine of a
          warped coordinate, the construction of Perlin's image synthesizer, widened and faded with the pixel's footprint so
          they never shimmer; travertine stacks warm bands and small open pores. Each kind perturbs the normal with
          Mikkelsen's surface-gradient bump mapping and fades its detail below a pixel.
        files:
          - path: assets/js/home-scene/realism.mjs
            role: The procedural kinds and their bump.
            functions: [finishPhysicalMaterial, surfaceNoise]
          - path: bin/coastal_renovation.py
            role: The palette whose material names key the kinds.
            functions: [apply_palette]
        tests: []
        sources: [geiss2007terrain, perlin1985image, mikkelsen2010bump]
        related:
          - record: homepage-desk-scene
            techniques: [procedural-materials, soft-edges]
        limits:
          - Trowel strokes fade once a pixel covers more than about 5 mm of wall, so walls read smooth in the wider views.
          - The light field's bounce uses base colours, so the patterns do not tint the bounced light.
          - Stretched value noise rather than an exemplar of real plaster, so close up the strokes are softer and more regular than a hand-trowelled wall.
        watchlist:
          - source: heitz2018byexample
            effort: medium
            adds: Tiles a small photograph of real lime plaster or marble across any wall without visible repetition, by blending random patches while preserving the photograph's histogram, so close-ups would show real trowel texture.
          - source: tricard2019phasor
            effort: medium
            adds: Oriented noise with exact control of stroke direction and spacing and no loss of contrast, which would let the trowel strokes curve in arcs as a plasterer's do.
          - source: lagae2009gabor
            effort: medium
            adds: Anisotropic noise with a chosen spectrum and built-in filtering, an alternative to stretched value noise that keeps the strokes crisp without shimmer at a distance.
        next: []

  - id: water-air
    name: Water, air and sky
    summary: >-
      Two bodies of water with different models, bath steam carried by its own heat, one breeze from the Pacific through
      the house, and since October 19 a scattering sky for La Jolla's real sun, with haze, marine fog and sunbeams in the
      air.
    techniques:
      - id: ocean
        name: A Pacific of Gerstner waves
        status: shipped
        since: "2026-10-01"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/ocean.webp
          alt: The Pacific from the beach at golden hour, turquoise shallows over the sand and the seabed's shadows giving way to blue water, a sandstone headland under a hazy gold sky
          frame: Lab camera on the beach, 17:40 on Friday, October 16, 2026, reduced motion.
        what: >-
          Ten Gerstner waves displace the sea and its normals together, with a wind sea that grows with the breeze; the
          water's colour comes from its optics over a seabed read from the coast (turquoise over sand, deep blue offshore,
          caustics on the sand), with a live mirror that streaks the terrace lamps, the sun's glints in the hue of the
          day's real low sun, and swash on the true waterline.
        how: >-
          `sampleOcean` in `ocean-spectrum.mjs` sums ten choppy Gerstner components with gravity–capillary dispersion and
          analytic tangents, after Finch, with footprint filtering after Bruneton, Neyret and Holzschuch; the wind sea,
          ripples and whitecaps follow the coast's breeze. Since October 18 `createBathymetry` reads the seabed from one
          orthographic draw of the coast, and `fillSeabed` extends it offshore. The sea shader refracts each view ray to that
          seabed and evaluates Lee and colleagues' shallow-water reflectance (`shallowReflectance`, with `seawaterIOPs` from
          Pope and Fry's pure water), lights the sand with the sun's shadow and paraxial caustics from the wind ripples
          (`causticGain`, the differential form of Watt's beam areas), breaks the sun's GGX lobe into glints, draws GGX lamp
          streaks, and runs the swash on the captured waterline. The glints first took their hue from the slant path's
          transmittance (`sunTint`, after Kasten and Young's air mass and Hansen and Travis's Rayleigh depth); since October
          19 the water reads the scattering sky's own sun. `createSeaReflection` renders the mirror with exact water Fresnel
          and streak taps.
        files:
          - path: assets/js/home-scene/ocean-spectrum.mjs
            role: Wave components, footprint filtering, the wind sea and the CPU wave sampler.
            functions: [sampleOcean, windSeaScale, rippleScale, whitecapCoverage, waterFresnel]
          - path: assets/js/home-scene/sea-optics.mjs
            role: Seawater optics, the shallow-water reflectance, the caustic lens, the seabed fill and the first low-sun hue.
            functions: [seawaterIOPs, shallowReflectance, causticGain, fillSeabed, sunTint]
          - path: assets/js/home-scene/bathymetry.mjs
            role: The seabed capture.
            functions: [createBathymetry]
          - path: assets/js/home-scene/environment.mjs
