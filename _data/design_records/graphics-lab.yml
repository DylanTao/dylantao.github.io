          frame: Sleep view, 04:00 on Friday, October 16, 2026, reduced motion.
        what: Each avatar's duvet is dropped over the sleeping body offline by a position-based cloth solver and its pillow pressed in by the head, so no cover cuts through a chest; in the scene the cover breathes.
