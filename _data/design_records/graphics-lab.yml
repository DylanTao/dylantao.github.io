        tests:
          - test/test_design_records.py
        sources: []
        limits:
          - Frames go stale when the scene changes; recapture after a room, camera or look change. The October 18 set shows the renovated house and the skinned wildlife.
          - Captured in headless Chromium on one machine's integrated GPU, so colours follow its driver.
        next: []
      - id: lab-brief
        name: A brief that proposes the next paper
        status: shipped
