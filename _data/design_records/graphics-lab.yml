            effort: medium
            adds: Advects along forward and backward maps for about the cost of two semi-Lagrangian steps, so the 18³ field would keep its wisps instead of blurring them away.
          - source: kim2008wavelet
            effort: medium
            adds: Synthesizes the turbulence a coarse grid misses with wavelet noise, detail far finer than 18 cells at shader cost.
