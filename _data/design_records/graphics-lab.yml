      - id: skin
        name: Preintegrated skin diffusion
        status: shipped
        since: "2026-10-02"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/skin.webp
          alt: Sirui at his desk in the late afternoon, close up, his face lit softly from the side, the turntable and the bookshelf behind him
          frame: Lab camera at the face, 16:40 on Friday, October 16, 2026, reduced motion.
        what: Skin spreads direct light across a curved patch with a normalized diffusion profile, so a shadow's edge on the face turns warm instead of hard.
        how: >-
          `buildDiffusionTable` in `skin-diffusion-profile.mjs` integrates Christensen and Burley's normalized
          two-exponential profile over a locally spherical patch (`diffuseResponse`, with 96-node Gauss–Legendre quadrature)
          into a 257 × 49 half-float table. `createSkinDiffusion` measures mean curvature in metres from view-space
          derivatives of the skinned surface and replaces only the direct diffuse term of three.js's physical material with
          a 70/30 mix of diffused and ordinary response (`patchSkinDiffusionShader`). The red, green and blue distances,
          3.2, 1.2 and 0.65 mm, are authored, not measured.
        files:
          - path: assets/js/home-scene/skin-diffusion-profile.mjs
            role: The profile integral and the lookup table.
            functions: [buildDiffusionTable, diffuseResponse, estimateMeanCurvature]
          - path: assets/js/home-scene/skin-diffusion.mjs
            role: Curvature and the material hook.
            functions: [createSkinDiffusion, patchSkinDiffusionShader]
          - path: assets/js/home-scene/SKIN-DIFFUSION.md
            role: Derivation, integration and limits.
        tests:
          - test/skin-diffusion.test.mjs
        sources: [christensen2015profiles, jimenez2015separable, chen2014pdss]
        related:
          - record: homepage-desk-scene
            techniques: [skin-diffusion]
        limits:
          - A local convex-sphere approximation with pointwise shadows, so no light crosses a shadow's edge and nothing shines through an ear.
          - Anisotropic shapes reduce to scalar mean curvature.
        watchlist:
          - source: xie2020sss
            effort: medium
            adds: One-pass screen-space subsurface scattering with variance-guided sampling, so light would cross shadow edges on the face, which a per-point table cannot.
        next:
          - move: A spatial, diffuse-only buffer filtered with separable kernels, after Jimenez and colleagues, to carry light across shadow edges.
            readiness: needs-research
      - id: hair
        name: Strand highlights on hair
        status: shipped
        since: "2026-10-13"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/hair.webp
          alt: Sirui at the desk at night, the desk lamp drawing bright bands across his long black hair
          frame: Lab camera at the head, 23:10 on Friday, October 16, 2026, reduced motion.
        what: Hair gets two shifted highlight bands across its strands, the primary and secondary lobes of hair scattering, instead of a round spot.
        how: >-
          `strandHighlights` in `realism.mjs` adds two lobes to each avatar's hair material: a near-white primary shifted
          toward the tips and a broader, hair-tinted secondary shifted toward the roots, the R and TRT lobes of Marschner and
          colleagues in Scheuermann's real-time form, on Kajiya and Kay's strand model. The avatars carry no strand
          tangents, so each strand direction is combed from the crown of the hair mesh's bind pose and skinned like a
          normal. Widening each lobe by the normal's variance across the pixel, while keeping its energy, removes sparkle
          at the hairline.
        files:
          - path: assets/js/home-scene/realism.mjs
            role: The strand-highlight material hook.
            functions: [strandHighlights, finishPhysicalMaterial]
