      - id: sun-sky
        name: A scattering sky for La Jolla
        status: shipped
        since: "2026-10-01"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/sun-sky.webp
          alt: The sun touching the Pacific at 18:13, its disc flattened by refraction, under an orange sky with a red glitter path across the dark swell
          frame: Lab camera on the beach looking west, 18:13 on Friday, October 16, 2026, reduced motion; the sun sets at 18:16.
        what: >-
          The sky is a scattering atmosphere computed for the actual sun, so the Pacific sunset goes from gold to apricot and
          rose with the disc sinking, squashed, into the sea at NOAA's minute, then a pink afterglow, the blue hour, stars on
          the turning sky and a moon at its true place and phase; the scene's key light, fill and reflections follow it.
        how: >-
          Since October 19 `createAtmosphere` in `atmosphere.mjs` draws Hillaire's three tables on the GPU (EGSR 2020, on
          Bruneton's parameterization): transmittance to space (256 × 64, once), the multiple-scattering transfer Ψ_ms
          (32 × 32, once, its axes warped toward the horizon and the ground) and the sky seen from 30 m above the sea
          (192 × 108, redrawn each light step). `atmosphere-model.mjs` holds the same physics in plain JavaScript for the
          light colours and the tests (`transmittanceToTop`, `integrateRay`, `buildMultipleScatteringTable`, `skyRadiance`):
          Rayleigh, ozone and a clean marine aerosol (optical depth 0.045 at 550 nm, Ångström exponent 0.4, a Cornette–Shanks
          phase with g = 0.76). The dome adds the night sky that follows twilight (its stars are the next technique's), the
          moon from the Astronomical Almanac's low-precision series (`moonPosition`) lit
          by the sun so its phase is drawn exactly, the sun's disc drawn 2.8 times larger with its light conserved, placed so
          its top limb sets at NOAA's minute and squashed and reddened by refraction (`sunDisc`, `refraction`, after
          Sæmundsson and Bennett), and the Pacific beyond the modelled sea with Cox and Munk's glitter. `skyLighting` turns the
          sky into the scene's light: the key light is the sun through the atmosphere, or the moon once the sun's light is
          gone; the probe field's three sky colours are fitted to the scattering sky's irradiance, weighted toward the west
          the house faces; the eye's adaptation lifts twilight by a gain taken from the model itself (`adaptationGain`); and
          the reflections' capture is rebuilt every half degree of sun near the horizon and every 20 minutes otherwise
          (`setPalette`, `makeEnvironment`). `weatherFor` draws the day's mood from its date.
        files:
          - path: assets/js/home-scene/atmosphere-model.mjs
            role: The atmosphere, refraction, the moon and the weather.
            functions:
              [
                transmittanceToTop,
                integrateRay,
                buildMultipleScatteringTable,
                skyRadiance,
                refraction,
                unrefract,
                moonPosition,
                weatherFor,
                adaptationGain,
              ]
          - path: assets/js/home-scene/atmosphere.mjs
            role: The GPU tables, the dome and the scene's light.
            functions: [createAtmosphere, skyLighting, sunDisc, apparentDirection, weatherOverride]
          - path: assets/js/home-scene/environment.mjs
            role: The dome, the capture and the palette step.
            functions: [setPalette, makeEnvironment]
          - path: assets/js/home-scene/daylight.mjs
            role: Solar position.
            functions: [coastalDaylight, LA_JOLLA]
        tests:
          - test/atmosphere.test.mjs
          - test/coastal-physics.test.mjs
          - test/sun-arc-math.test.mjs
        sources:
          [hillaire2020sky, bruneton2008atmosphere, noaa-solar, meeus1998algorithms, astronomical-almanac-moon, cornette1992phase, cox1954glitter]
        related:
          - record: homepage-desk-scene
            techniques: [daylight, sea-sunset]
        limits:
          - The tables and the light colours use the same equations at different resolutions (192 × 108 on the GPU against a 24 × 8 CPU table for Ψ_ms), so the probe field's sky can differ from the dome by 10 to 30 % in deep twilight.
          - The sky's radiance carries a fill of two over the model and a highlight shoulder, choices of exposure rather than physics, and the night sky after nautical twilight is authored.
          - Refraction bends the drawn disc but not the scattering geometry; there is no green flash and there are no clouds yet.
          - The moon is good to about 0.3 degrees, with no libration or exact orientation of its limb.
        watchlist:
          - source: hillaire2016clouds
            effort: large
            adds: Clouds lit through the same atmosphere, with their own multiple-scattering approximation and shadows, the step from a clear sunset to one that colours a cloud deck.
        next:
          - move: A high cloud layer for the sunset, lit through the atmosphere and Earth's shadow, from the weather's cirrus days.
            readiness: ready
      - id: night-stars
        name: Stars the eye could see from La Jolla
        status: shipped
        since: "2026-10-22"
        what: >-
          The night sky carries the naked-eye stars of the Yale Bright Star Catalogue where they stand over La Jolla at the
          minute, only as many as the coast's suburban glow and the moon leave visible: about four hundred on a moonless
          night, under a hundred beneath a full moon, coming out one at a time at dusk. Each is a round point about a CSS
          pixel across, its colour from its B-V index, reddened and twinkling toward the horizon.
        how: >-
          `createStarField` in `stars.mjs` draws one `THREE.Points` of 3,249 stars over the dome. `starMatrix` precesses
          their J2000 positions to the date (IAU 1976, Meeus chapter 21) and turns them by local mean sidereal time (Meeus
          12.4); on the live clock they turn with the page clock between minutes. The vertex shader dims each star by the
          atmosphere's own transmittance and the coast's haze along its line of sight, then compares it with the naked eye's
          limiting magnitude (`limitingMagnitude`, after Schaefer) for the sky behind it: twilight from the scattering
          sky's table, a 19.4 mag/arcsec² suburban glow that brightens toward the horizon and most toward San Diego, and
          the moon's light by Allen's phase law. Above the limit, brightness rises as the 0.55 power of the flux and size as
          its 0.14 power, so the brightest stars grow instead of blooming; each point spread is widened by a pixel's box
          filter with its light kept, so a moving star neither crawls nor flickers. Colour comes from B-V through
          Ballesteros's temperature and the Planckian locus, white-balanced to the 6504 K blackbody (against D65 the
          locus is faintly magenta between 5,000 and 8,000 K, which had turned white stars pink), and desaturated for
          faint stars as night vision desaturates them. Scintillation grows as the air mass to the 1.5 power on the
          scene's clock and stops under reduced motion; by day the field is not drawn, and the sea mirror leaves it out.
          It replaced a procedural field of about 100,000 hashed cells whose warm tints read as pink dots.
        files:
          - path: assets/js/home-scene/stars.mjs
            role: The catalogue, the turning sky, the eye's limit and the star field.
            functions: [createStarField, starMatrix, precessionMatrix, greenwichMeanSiderealTime, limitingMagnitude, starColor, countVisibleStars]
          - path: assets/js/home-scene/star-catalogue.mjs
            role: The packed catalogue, eight bytes a star.
          - path: bin/build_star_catalogue.mjs
            role: Packs the catalogue from the CDS's copy.
          - path: assets/js/home-scene/environment.mjs
            role: The light step, the scene's clock and the mirror's exclusion.
            functions: [setPalette, reflect]
        tests:
          - test/stars.test.mjs
          - test/visual/desk-scene.spec.js
        sources: [hoffleit1991bsc, meeus1998algorithms, schaefer1993vision, ballesteros2012blackbody, kim2002planckian, kasten1989airmass]
        related:
          - record: homepage-desk-scene
            techniques: [daylight]
        limits:
          - Stars fainter than magnitude 5.6 are left out, and there is no Milky Way; under a suburban sky it would barely show.
          - Proper motion and nutation are ignored (under an arcminute this century), and each star is lifted by Sæmundsson's mean refraction.
          - The sky glow is a model of a Bortle 5 to 6 coast, not a measurement, and the moonlit sky brightens only within about 15 degrees of the moon.
        next:
          - move: Venus, Mars, Jupiter and Saturn from Standish's Keplerian elements, in the same draw.
            readiness: ready
