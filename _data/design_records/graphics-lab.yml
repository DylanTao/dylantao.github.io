          Gauss–Seidel distance constraints and a soft bend, after Müller and colleagues and Fratarcangeli, Tibaldo and
          Pellacini; the cover is then trimmed across the chest, quilted and given 3 cm of fill. `sleepers` poses every
          avatar's sleep clip at its deepest and shallowest breath, and `pillow` presses each pillow wherever a sleeping head
          rests. `bin/refresh_coastal_bedding.py` rebuilds the six bed variants in the retained house. In the scene,
          `createBreathingCover` in `bedding-breath.mjs` lifts the sleeper's cover a few millimetres along its normals
          around the chest at about fourteen breaths a minute, inhaling over 40 % of each breath (`breathAt`).
