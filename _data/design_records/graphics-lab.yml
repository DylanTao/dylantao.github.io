open_problems:
  - id: next-experiment
    title: Which paper first
    system: method
    why_hard: >-
      Every watchlist entry would make a technique more faithful, but they differ by an order of magnitude in effort and in
      how much a visitor would notice. The shortlist proposes four with a visible payoff; the choice is a taste call. The
      scattering sky left the list when it shipped on October 19, and boundary-aware waves took its place.
    candidate_moves:
      - "Light paths: specular manifold sampling, to win the race on the caustics outright."
      - "Ocean: boundary-aware waves over the captured seabed, so the swell slows, shortens and turns toward the beach."
      - "Onsen: dispersive surface waves, so the hand's ripples travel at their true speed."
      - "Wind: a wind projection basis, so the pines and the palm sway as trees."
    sources: [zeltner2020sms, jeschke2020boundary, jeschke2023dispersive, diener2009wind]
    readiness: needs-decision
  - id: gpu-compute
    title: Simulation without compute shaders
    system: water-air
    why_hard: >-
      The scene renders through WebGL2 and three.js r164, which have no compute shaders. An FFT ocean, a pressure solve
      for the steam, cloth on the GPU and probe updates all want them, so each must become chains of fragment passes or
      wait for WebGPU, a move that would touch every material and pass the shader warmup knows. The performance pass priced
      that move on October 18 and deferred it (open problem "When to move to WebGPU").
    candidate_moves:
      - Prototype one FFT pass chain as fragment passes on a separate page and time it against the authored spectrum.
      - Keep the small solvers (the onsen, the steam, the cloth) on the CPU and move only the ocean's spectrum to the GPU.
    sources: [tessendorf2004ocean, horvath2015spectra]
    readiness: needs-decision
  - id: hard-paths
    title: Light that only a tracer can find
    system: light-transport
    why_hard: >-
      Caustics on the onsen's vault, glossy reflections of the lit house and light through the sheer all follow paths a
      rasterizer cannot aim at. Since October 18 the basin's floor and the sea's sand take paraxial caustics from their
      own rippled surfaces, one sheet for light from overhead, but light reflected onto the vault and strongly folded
      caustics still need a tracer. The light lab finds them on the CPU, but the house has no runtime tracer, and WebGL
      offers no ray queries.
    candidate_moves:
      - Reflect the same paraxial lens off the onsen's surface onto the vault, checked against the light lab's reference.
      - Shade the light well's aperture with glossy area lights, the cheapest specular path the house is missing.
    sources: [loubet2020slope, heitz2016ltc, watt1990beam]
    readiness: needs-research
  - id: next-performance
    title: Where the frame still goes
    system: performance
    why_hard: >-
      Outside, the frame is still bound by three's per-draw path. After the October 18 cuts about 800 draws go to the
      view and three's transmission copy and about 400 to the sea mirror, and each draw refreshes its own material, about
      35 µs of script per draw. The three largest remaining savings change pixels or touch the renovation's materials, so
      they need Sirui; the rest are engineering. The moves are in priority order, with the expected win and the effort for
      one agent estimated from these measurements.
    candidate_moves:
      - Share identical materials between meshes, so grouped draws skip three's material refresh; a further 20 to 40 % of outside script time, in half a day (needs a decision on materials.mjs and realism.mjs).
      - A non-transmissive stand-in for the hopper glass and the distant onsen water, which removes three's transmission copy outside, about a quarter of the frame's draws, in hours (a look change of a few dozen pixels).
      - A lighter sea mirror, without interiors or redrawn every other frame while the camera is still; up to half its ~400 draws, in hours (13 of 108 sampled stills changed, median 126 px).
      - BatchedMesh with multi-draw for the hinterland's 156 static primitives and the planting's 23, with each piece's transform baked into its geometry; 100 to 150 fewer draws per pass outside, in a day.
      - Meshopt instead of Draco as a post-process, with quantization matched to the Draco settings and custom attributes kept (the default prune strips the planting's TEXCOORD_0 and COLOR_1); about 0.3 to 0.5 s less decoding on a first view for about 0.9 MB more, in half a day.
      - Minify the ES modules, which jekyll-terser skips; the 3D modules would go from 330 to 201 KB gzipped and the site's other 31 from 110 to 72 KB, in hours, keeping `bin/profile_coastal_startup.cjs` able to find the frame callback.
      - A content-hashed Service Worker cache, because GitHub Pages serves every file with max-age=600 and re-sends about 10 MB of unchanged models after each deploy; a day.
      - Room-level occlusion culling from the coast, by one-frame-late queries with hysteresis, two-phase culling or a CPU depth test against real room hulls; up to 130 draws per pass, in two to three days (pop-in while moving needs a decision).
      - Level of detail for distant planting, simplified chunks with `THREE.LOD` and then impostors; a large triangle cut at distance, in one to two days and three to five for impostors.
      - Shader compile time at startup (about 70 programs, 12 to 19 s to the first frame on the loaded laptop); measure each program's compile cost, then fewer variants or explicit-level texture reads in the light field's probe loops; possibly seconds, after one to two days of investigation.
      - Temporal antialiasing instead of 4× multisampled half-float targets, practical only with correct motion vectors for skinned, swaying and cloth meshes, most easily under WebGPURenderer's TRAA node.
      - Cap ambient animation at 60 fps on high-refresh displays, keeping the full rate while the visitor drags; an hour (a smoothness decision).
    sources:
      [
        threejs-batchedmesh,
        webgl-multi-draw,
        kapoulkine2020pr1830,
        ext-meshopt,
        gltf-transform,
        jekyll-terser,
        terser-docs,
        gh-pages-cache-discussion,
        webgl2-spec,
        haar2015gpudriven,
        greene1993hiz,
        hasselgren2016moc,
        meshoptimizer,
        decoret2003billboard,
        epic-impostor-baker,
        khr-parallel-shader-compile,
        karis2014taa,
        yang2020taa,
        html-raf,
      ]
    readiness: needs-decision
  - id: webgpu
    title: When to move to WebGPU
    system: performance
    why_hard: >-
      Not now. Three.js r186 (September 24, 2026) still calls WebGPURenderer experimental and recommends WebGLRenderer for
      pure WebGL 2 applications, and WebGPURenderer runs neither `onBeforeCompile` patches, ShaderMaterial nor
      EffectComposer passes. Every string-patched material here (the procedural kinds, the light field, contact lighting,
      skin diffusion, the light installations, the light well, the plant and ocean displacement) and the contact, bloom and
      output passes would be rewritten in TSL. Three.js issue 30560, open since February 2025, reports WebGPURenderer's
      per-object uniform buffers running several times slower than WebGLRenderer with many distinct objects (about 60
      against 15 fps for 20,000 cubes), which is this scene's profile, and a September 2026 comment there measured its
      WebGL 2 fallback on r186 at 31 % more render CPU and 80 % more GL calls in a draw-heavy app. WebGPU ships in Chrome
      on Windows, macOS and ChromeOS since 113, on Android since 121 and on Linux from 144, in Safari 26 and in Firefox 141
      on Windows, then on Apple-silicon macOS; everyone else would get the WebGL 2 backend. What it would buy here is
      render bundles that replay static draws without per-draw script, and compute-driven culling with indirect draws,
      both aimed at the per-draw cost this scene is bound by.
    candidate_moves:
      - Wait until issue 30560 is resolved, so WebGPURenderer is at least level with WebGLRenderer on about a thousand distinct draws.
      - First move the scene from r164 to a current three.js on WebGLRenderer, itself a project, because r182 to r186 rewrote the shadow and BRDF chunks the string patches target.
      - Then port the materials one at a time to node materials and TSL under WebGLRenderer's NodeMaterial compatibility layer (r184), and switch renderers only if an A/B wins on both the WebGPU and the WebGL 2 backend; several weeks of focused work.
      - Until then, attack the same per-draw cost on WebGL 2 with material sharing, batching and a lighter mirror.
    sources:
      [
        threejs-webgpurenderer,
        threejs-30560,
        threejs-32851,
        threejs-releases,
        chrome-webgpu-release,
        chrome-webgpu-121,
        chrome-webgpu-144,
        webkit-safari26,
        mozilla-firefox141,
        w3c-webgpu,
        wihlidal2016compute,
      ]
    readiness: blocked
