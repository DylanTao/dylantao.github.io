        status: shipped
        since: "2026-10-02"
        thumbnail:
          path: assets/img/project_pics/graphics-lab/steam.webp
          alt: Bath air over the onsen at noon in late August, the light well's beam showing as a pale shaft through it
          frame: Lab camera beside the pool, 12:40 on August 20, 2026 (page clock fixed), reduced motion.
        what: Bath mist is two transported fields, droplet concentration and temperature, rendered with single scattering that composes in order around the glass and the water.
        how: >-
          `createSteamDensity` advects an 18³ concentration and temperature field at a fixed 30 Hz with midpoint
          semi-Lagrangian backtracing, after Stam, and lets warmer cells rise faster, after Fedkiw, Stam and Jensen's
          separate smoke density and temperature; diffusion and cooling use exact exponential factors, and since October 16
          the drift follows the house's share of the coast's breeze (`setWind`). `createSteamVolume` marches up to 40 samples
          with Beer–Lambert extinction and a Henyey–Greenstein phase (`integrateSteamSamples`, `steamPhase`), after Wronski,
          and splits each ray once at the nearest glass or water (`steamRayIntervals`) so the gas in front and behind
          composes in order.
