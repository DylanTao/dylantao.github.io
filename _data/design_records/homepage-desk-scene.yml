      - id: light-installations
        name: Light installations that keep the house's hours
        status: shipped
        since: "2026-10-14"
        what: A terrace festoon, a fire bowl, a gallery soffit, stair step lights, a pool light and, since the renovation, the kitchen's downlights, shelf light and dining lantern switch with the time of day and the routine.
        how: >-
          `light-installations.mjs` shades every emitter analytically in every material. Line emitters use the exact
          irradiance of a uniformly glowing segment on a matte surface, clipped to the surface's horizon; the test checks it
          against brute-force integration on 40 random layouts and against the infinite-line limit 2I/h. Each emitter is
          bounded by a box, so the festoon lights the terrace and the front of the living floor through the glass but not
          the cliff under the ledge. Schedules fade in and out and wrap past midnight: the festoon from dusk to 23:30, the
