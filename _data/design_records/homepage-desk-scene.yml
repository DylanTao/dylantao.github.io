          - move: Extend the shore samples so surf follows the new beaches.
            readiness: needs-decision
      - id: ridge-gliders
        name: Gliders soaring the bluffs
        status: shipped
        since: "2026-10-15"
        what: Three paragliders and a hang glider follow closed loops along the north bluffs, banking into their turns.
        how: >-
          `gliders.mjs` tabulates each closed loop as a centripetal Catmull–Rom curve by arc length and banks each wing by
          tan(bank) = v²κ/g, a coordinated turn. Poses are pure functions of the scene clock, so pause, hidden tabs and
          reduced motion hold every glider where it is.
        files:
          - path: assets/js/home-scene/gliders.mjs
            role: Routes, poses and banking.
        tests:
          - test/coastal-hinterland.test.mjs
        sources: [banked-turn]
        limits:
          - Authored loops, with no response to the wind.
        next:
          - move: Crab into the live coast wind.
            readiness: needs-decision
      - id: soft-edges
        name: Weighted normals and small bevels
        status: shipped
        since: "2026-10-17"
        what: Interior meshes are shaded smooth with weighted normals, only true corners stay sharp, and unbevelled slats, frames, steel and wall ends get a small rounded bevel.
        how: >-
          Every box-built piece of furniture had been flat shaded, so its bevels read as a run of creases. `soften_interiors`
          in `bin/coastal_renovation.py` shades each room mesh smooth, keeps edges sharper than 48° crisp and applies a
          face-area weighted-normal modifier; `bevel_corners` first gives unbevelled pieces a two-segment rounded bevel of 2
          to 18 mm, from the gym's barbells to the limestone wall ends. Organic, sculpted or carved meshes keep their authored
          normals, and glass, water and paper stay flat. Shared normals also shrank the shell from 1,022 KB to 626 KB, and
          over the four renovation phases the shell and room GLBs went from 2,706,812 to 1,639,640 bytes, 39 % smaller.
        files:
          - path: bin/coastal_renovation.py
            role: Softening, bevels and the two-family palette.
            functions: [soften_interiors, soften, bevel_corners, apply_palette]
          - path: bin/refresh_coastal_renovation.py
            role: Applies the renovation to the retained house and refreshes the manifest.
        tests:
          - test/test_coastal_assets.py
        sources: [blender]
        limits:
          - Bevel radii are chosen by object name, so a renamed piece loses its bevel.
        next: []
      - id: deeper-house-and-office
        name: A deeper cave and an office
        status: shipped
        since: "2026-10-18"
        what: The cave is carved 2.4 m deeper, and the upper floor gains an office with an L-shaped marble desk, Sirui's two monitors, laptop and tower, and a bookshelf wall for the records.
        how: >-
          `deepen_cave` in `bin/coastal_shell.py` carves the extra depth with an exact Boolean, putting the back wall at
          Blender y = −7.88 m with a second lift-away ceiling solid, and `move_back` takes the stair, the cupboards, the corner
          returns, the onsen's slat panel and the seascape back with the wall; `build_floors` relays both floors in wide oak
          boards, and the upper walk is guarded. `build_office` in `bin/coastal_office.py` sets an L-shaped milky veined
          marble desk on waterfall legs with an oak drawer pedestal, the 43-inch monitor straight ahead and the 32-inch
          angled on the corner, the LG gram open at Sirui's right hand, a black glass-sided tower (an RTX 3080 Ti, an AIO
          radiator, RGB fans and RAM), a keyboard on an indigo mat, an ergonomic chair, a footrest, a brass task lamp and a
          bookshelf wall that holds the records. Sirui types facing the room's −x, and the new study camera (yaw 2.85, a
          3.9 m radius, a 40° lens) shows his profile, both screens, the turntable and the tower. The controller reads the
          desk from the manifest's study room.
        files:
          - path: bin/coastal_shell.py
            role: The deeper cave, the moved stair and the oak floors.
            functions: [deepen_cave, move_back, build_floors]
          - path: bin/coastal_office.py
            role: The office and its equipment.
            functions: [build_office, build_desk, build_monitor, build_pc]
          - path: bin/refresh_coastal_renovation.py
            role: Rewrites room actors, walks and the manifest.
          - path: assets/js/home-scene/controller.mjs
            role: Places the desk objects and the records from the manifest.
            functions: [makeDeskObjects, updateRecords]
        tests:
          - test/test_coastal_assets.py
          - test/coastal-navigation.test.mjs
        sources: []
        limits:
          - The deeper back of the house is still sparsely furnished.
        next: []
      - id: living-room
        name: A cloud U-sofa facing the TV, not the glass
        status: shipped
        since: "2026-10-18"
        what: The ground floor's middle bay is a living room with a white bouclé U-sofa that faces an 85-inch TV and leaves the view of the sea open.
        how: >-
          `build_living` in `bin/coastal_living.py` sets the U with its arms parallel to the glass; the window arm is a long
          backless chaise, so nothing blocks the view. It opens north to the TV on a plaster media wall that runs inland from
          the glass, with a smoked-oak slatted panel and a fluted credenza holding the room's own record player
          (`build_media_wall`). A travertine drum table, an ochre pouf, indigo, ochre and terracotta cushions, an oatmeal wool
          rug and a washi floor lantern that glows at dusk complete it. Watching the Pacific moved to the sofa's inland arm,
          feet on the pouf.
        files:
          - path: bin/coastal_living.py
            role: The sofa, tables, media wall, lantern and reading nook.
            functions: [build_living, build_sofa, build_media_wall, build_lamp]
        tests:
          - test/coastal-navigation.test.mjs
          - test/light-installations.test.mjs
        sources: []
        limits:
          - Where the TV wall and the reading nook sit is still Sirui's call.
        next: []
      - id: kitchen-and-dining
        name: Oak and marble around the gallery's fin
        status: shipped
        since: "2026-10-18"
        what: The kitchen is one light-oak run under milky marble with a coffee bar at its sea end, a travertine island, and a round travertine dining table under a washi lantern.
        how: >-
          `build_run` in `bin/coastal_kitchen.py` lays one light-oak run under milky marble, with a nickel espresso machine and
          grinder at its sea end where the breakfast routine reaches (`build_coffee_bar`). The run parts around the
          structural plaster fin that carries the gallery's edge, with the cooking bay and a tall oak-panelled refrigerator
          behind the print wall under a tapered plaster hood. A travertine island has fluted oak sides (`build_island`); a
          round honed-travertine table stands on a fluted oak column with a nickel footrest ring, four wishbone chairs and a
          74 cm washi lantern 80 cm above the top (`build_table`, `build_dining`). Two soffit downlights, two vault downlights
          over the island and a light line under the lower shelf are written into the manifest's `interiorLights`
          (`build_downlights`), at task strength for meals and a low glow after dark.
        files:
          - path: bin/coastal_kitchen.py
            role: The run, the coffee bar, the island, the table, the chairs and the fixtures.
            functions: [build_run, build_coffee_bar, build_island, build_table, build_dining, build_downlights]
        tests:
          - test/light-installations.test.mjs
        sources: []
        limits:
          - The run parting around the fin, the refrigerator in the back kitchen, the two soffit downlights and the dining top's 82.5 cm height with its 22 cm footrest ring are Sirui's to confirm.
        next: []
  - id: light-lab
    name: The light-paths lab
    summary: >-
      A separate site experiment at /projects/light-paths/ that renders the onsen's sunlit pool twice in the browser, to
      show when Metropolis light transport beats independent path sampling on light the house actually has.
    techniques:
      - id: lab-renderer
        name: One path sampler, two estimators
        status: experimental
        since: "2026-10-14"
        what: A dependency-free JavaScript renderer draws a simplified onsen with path tracing and with primary-sample-space Metropolis light transport from the same path sampler.
        how: >-
          `assets/js/light-lab/core.mjs` traces a box grotto, a round pool with seven frozen analytic ripples and a radial drip
          ripple, a disc light well and a 0.8° sun. Every random decision reads a fixed coordinate of a sampler. Path tracing
          feeds it fresh numbers; Kelemen and colleagues' Metropolis feeds it mutated ones, evaluated lazily with PBRT's
          bookkeeping. Both use next-event estimation to the sun and sky with power-heuristic multiple importance sampling,
          after Veach. Water hits use safeguarded Newton iteration and a certified march that cannot skip a crossing, and hot
          loops write into typed arrays so tracing allocates nothing.
        files:
          - path: assets/js/light-lab/core.mjs
            role: Scene, path sampler and both estimators.
          - path: assets/js/light-lab/worker.mjs
            role: Runs one estimator per worker.
          - path: _projects/light-paths.md
            role: The public lab page.
        tests:
          - test/light-lab.test.mjs
        sources: [veach1997mlt, kelemen2002pssmlt, veach1997thesis, pbrt3-mlt]
        limits:
          - A simplified scene. Frozen ripples, no steam, a round opening instead of the tilted shaft, and a sun three times the real size by default.
          - Metropolis's total brightness rests on independent samples that usually miss the sun, and chains start in skylight and need about 20,000 mutations each to settle.
        next:
          - move: Manifold exploration or specular manifold sampling, to win the race on the caustic paths outright.
            readiness: needs-research
      - id: lab-race
        name: A race with the same minute each
        status: experimental
        since: "2026-10-14"
        what: The lab page runs the two renderers in module workers for the same wall time and charts their error against a converged reference.
        how: >-
          `page.mjs` starts one worker per renderer only on request, pauses after a minute, off screen and in hidden tabs,
          and shows still frames before a run and where a browser cannot run one. Error is the luminance RMSE on an 80 × 60
          grid divided by the reference mean. After a minute in the recorded browser run, path tracing was off by 984 % and
          Metropolis by 180 %; across three seeds Metropolis ended 4 to 15 times closer.
        files:
          - path: assets/js/light-lab/page.mjs
            role: Workers, controls, chart and still frames.
          - path: _sass/_light-lab.scss
            role: Lab layout.
          - path: bin/capture_light_lab_frames.mjs
            role: Renders the still frames and the teaser.
        sources: []
        limits:
          - Wall time per worker depends on the visitor's machine; the dashed lines are one laptop's run.
        next: []
      - id: lab-reference
        name: A reference split by path type
        status: experimental
        since: "2026-10-14"
        what: The 24-minute reference on 18 threads splits path space at the camera ray's first hit and gives each part the estimator that suits it.
        how: >-
          `bin/make_light_lab_reference.mjs` uses light tracing with camera connections where the camera first sees a dry
          surface (748 million particles), which converges the reflected caustics, and Metropolis restricted to the water
          with a path-traced brightness correction where it sees the pool (1.63 billion steps). It writes the 80 × 60
          luminance grid and the 240 × 180 reference image.
        files:
          - path: bin/make_light_lab_reference.mjs
            role: The split reference renderer.
          - path: assets/js/light-lab/onsen-reference.json
            role: The luminance grid behind the error measure.
        sources: []
        limits:
          - Brightness in the pool is uncertain by a few percent; the walls are much tighter.
        next: []

history:
  - date: "2026-06-17"
    title: A paper desk learns a 3D view
    system: shared-desk
    frame: The paper collage introduced the papers, portrait and records quickly, but visitors could not wander through that little world.
    dimensions: [view (2D or 3D), state shared between views, camera framing]
    move: Added the visible 2D | 3D switch and a first Three.js room that copied the desk into a small stage.
    backtalk: At ordinary screen sizes the furniture disappeared, dropped cards floated, rear turns exposed blank space, and the outside looked like a separate dollhouse.
    reframe: Make inside and outside two camera views of the same room, and share the record player and discoveries with the 2D desk.
    commit: "c8ed8e5da"
  - date: "2026-07-13"
    title: One room, two cameras
    system: camera-navigation
    frame: The exterior was a hand-matched miniature that drifted from the room it was meant to show.
    dimensions: [one scene graph or two, camera position, raycast targets]
    move: Replaced the miniature with the actual room graph under reciprocal cameras. The July 14 checkpoint (`1b07cea4c`) accepted the organic shell, the high cliff aperture and live-geometry raycasts across the viewport matrix.
    backtalk: The same stopped record and empty discovery pile now carried into the room seen from inside or outside. Material realism remained open.
    reframe: Keep the room shape, then test stone, lighting, materials and controls on more phones and high-density laptops.
    commit: "a765c5291"
  - date: "2026-09-12"
    title: An inhabited home from Blender sources
    system: authoring
    frame: The September brief asked for an inhabited coastal home with connected rooms and a daily rhythm, built as real geometry.
    dimensions: [authoring tool, rooms, avatars and clips, load order]
    move: Split the 3D runtime out of `home.js` into schedule, controller, material and environment modules, and authored six rooms, coastal headlands and five skinned Sirui variants in Blender through `bin/build_coastal_home.py`.
    backtalk: I rejected the first face. It read as a doll with paired hair locks, not my swept-back long hair, exposed forehead, glasses and clean-shaven face.
    reframe: Judge likeness in front, profile and full-body renders before lighting, and connect the house to the cliff.
    commit: "72ce1637d"
  - date: "2026-09-13"
    title: Two floors carved into one cliff
    system: authoring
    frame: A single-level pedestal and arch read as a freestanding stage, not a home carved into a cliff.
    dimensions: [floors and stair, "continuity of the cliff, beach and shoreline", what the cutaway lifts]
    move: "`bin/coastal_section.py` carved two storeys at 0 and 2.6 m into one mainland mesh with a 15-riser stair, and `navigation.mjs` and `locomotion.mjs` began following the exported corridors and treads."
    backtalk: Hiding the roof could erase the mountain behind the rooms, so only the local ceiling lifts. Walking contacts moved from an approximate stair equation to the exported tread surfaces.
    reframe: Judge the section before the lighting. Stairs must be walkable, the mainland continuous and the beach at its foot.
    commit: "5cd5432fc"
  - date: "2026-09-13"
    title: Neighbours on the coast
    system: wildlife
    frame: The home sat in an empty landscape.
    dimensions: [beach depth, animal species and counts, atmosphere]
    move: Widened the beach from 6.6 to 14 m, with Blender terrain, surf and animal contacts sharing one set of shoreline parameters, and added rabbits, a raccoon, gulls and sandpipers in browser geometry with spray, dust and vapor particles.
    backtalk: The coast read as inhabited, but the animals were simple inline shapes without articulated acting or planted contacts.
    reframe: Give the animals articulated bodies and contacts on the same terrain the house stands on.
    commit: "a40e8b5e9"
  - date: "2026-09-14"
    title: Closed solids and fitted activities
    system: characters
    frame: The roof split left open boundaries, the camera could look behind unfinished geometry, and activities did not touch their equipment.
    dimensions: [solid topology, camera envelope, equipment contacts]
    move: Rebuilt the cave from exact Boolean solids, exported camera envelopes from the finished terrain, furnished the kitchen and gym, and drove coffee and strength sequences from exported equipment contacts.
    backtalk: Review renders caught a missing trouser weighting branch, sideways sleeve cuffs, wrongly oriented typing hands, an obsolete stair equation and groundcover crossing the terrain. Each was fixed in the authoring source and the runtime together.
    reframe: Keep the full exterior orbit instead of hiding rear geometry with a front-only camera.
    commit: "8ea3bb504"
  - date: "2026-09-14"
    title: Walks that keep time when rendering slows
    system: shared-desk
    frame: On slow software renderers, walks and gestures stretched with the frame interval.
    dimensions: [active time against render cadence, catch-up after a stall]
    move: Route and clip timing now follow active elapsed time, independent of rendering cadence, with spring integration bounded separately.
    backtalk: A Linux probe with 4 to 5 seconds between frames kept the authored walking duration and the stair and seated contacts.
    reframe: Every new motion system samples the same active clock and never queues catch-up work.
    commit: "1ac0e4c7d"
  - date: "2026-10-01"
    title: A bounded ocean and a driven record
    system: water-atmosphere
    frame: The sea had analytic vertical waves and the record a prescribed rotation; neither held up close.
    dimensions: [wave components and steepness, footprint filtering, rotor and tonearm dynamics]
    move: Added choppy Gerstner displacement with analytic tangents, footprint filtering that moves unresolved slope into roughness, exact water Fresnel on indirect specular, and a driven-rotor record with critically damped tonearm coordinates shared by the 2D and 3D players.
    backtalk: The ocean grew from 28,800 to 51,200 triangles with no new draw call or pass, and frame intervals stayed at a 16.7 ms median on the desktop test machine.
    reframe: Contact light was next, because the old SSAO pass dimmed direct sun as well as ambient light.
    commit: "7c241e110"
    sources: [finch2004gerstner, bruneton2010ocean]
  - date: "2026-10-01"
    title: Contact light on the right term
    system: rendering-light
    frame: The full-image SSAO pass multiplied the finished image, dimming sunlight, highlights and emission, and its blur left grey halos.
    dimensions: [which lighting term is occluded, reconstruction weights, determinism]
    move: A horizon-based visibility buffer, computed before the beauty pass, now scales only indirect diffuse light inside each material.
    backtalk: In a controlled sun-only capture the old pass changed 4.96 % of pixels and the new one 0.00 %; with ambient light only, the new pass changed 13.51 %. Repeated stills became identical.
    reframe: Five rendering stages replaced seven. The footer coast keeps its older pass until a matched comparison.
    commit: "88582b3dd"
    sources: [jimenez2016gtao]
  - date: "2026-10-01"
    title: Fingers that hold the bar
    system: characters
    frame: Ghibli's open hands floated above the pull-up bars, and the contact targets put wrist skin inside the handles.
    dimensions: [finger joints, wrist target against skin offset]
    move: "`coastal_hands.py` added twenty finger joints and fitted the two grip clips to anatomical wrist positions beside the bars."
    backtalk: A skin-offset prototype produced flared wrists and was rejected. In 132 sampled grip frames every digit came within 2 mm of its bar, the deepest intersection was 2.09 mm, and wrist error stayed under 0.33 mm.
    reframe: Move the true wrist target, not the skin. The other avatars kept byte-identical files.
    commit: "0fc3b00ef"
  - date: "2026-10-02"
    title: Eyes that notice, then return
    system: characters
    frame: The avatars never acknowledged a visitor, and their eyes could not close.
    dimensions: [eye and head bandwidth, habituation and cooldown, which clips may move the head]
    move: Added native eyelids and blink morphs to all five models and an additive layer for blinks, breathing and a short eyes-first glance toward the pointer.
    backtalk: The first lids, at the sclera's depth, left the protruding irises visible and were rejected. Integration review corrected the exported gaze axes, so horizontal attention turns about the vertical axis instead of rolling the head.
    reframe: Contact-sensitive clips cancel head motion immediately, and eating and drinking allow the eyes only.
    commit: "19b1648b4"
    sources: [pan2020gaze]
  - date: "2026-10-02"
    title: Animals that plant their feet
    system: wildlife
    frame: The animals were simple inline shapes, with no articulated acting and no planted contacts.
    dimensions: [contact holds, trajectory continuity, support surfaces]
    move: Rebuilt the raccoon, gull and sandpiper as articulated Blender masters and sampled their acting from active time. Gull soles were fitted to real perch triangles the same day (`7bd235902`).
    backtalk: Rabbit loops had physically crossed the planting and moved to clear scrub edges. Gulls had sampled grass blades as footing until plants were excluded from perch support.
    reframe: Animals, feet and foam all read the same exported terrain.
    commit: "a58764f38"
  - date: "2026-10-02"
    title: One wind for leaves and particles
    system: wind-plants
    frame: Leaves moved by a small material sway, and dust, spray and vapor each drifted by their own rule.
    dimensions: [spatial coherence of the wind, where a leaf is attached, what shadows see, determinism across frame rates]
    move: A bounded curl-noise field shared by the room plants and every particle population, with each leaf bending around its actual stem attachment and the same bend in its shadow passes.
    backtalk: Only 110 of 132 olive-leaf components had a supporting stem nearby, and one agave component happened to come close to wood, so the automatic resolver is limited to olive leaves. The first shadow version computed the bend inside the depth shader's displacement guard and lost it (`c7e779a1d`).
    reframe: Run the identical hook on every pass that draws a leaf, or report the mismatch.
    commit: "f095c818c"
    sources: [bridson2007curl]
  - date: "2026-10-02"
    title: Skin, water and wind as transport
    system: rendering-light
    frame: Skin, the bath and the leaves were art-directed effects. The terminator was hard, the pool bobbed on a sine, and the leaves swayed unattached.
    dimensions: [diffusion distance per channel, conservation and boundaries, divergence-free wind]
    move: Integrated three bounded, tested adaptations of published methods. Preintegrated skin diffusion after Christensen and Burley, a conservative height-field pool after Chentanez and Müller, and curl-noise wind for rooted leaves and particles after Bridson and colleagues.
    backtalk: The pool held its volume to about 10⁻¹⁴ over a ten-second pulse, and 20 sampled GPU wind velocities matched the CPU within the 8-bit quantization step. A first leaf-shadow compile attempt failed and is kept out of the accepted evidence.
    reframe: The pool should move only when something moves it, so drive it from the bather's hand.
    commit: "0b7b9cef7"
    sources: [christensen2015profiles, chentanez2010water, bridson2007curl]
  - date: "2026-10-02"
    title: Waves from the hand, not a timer
    system: water-atmosphere
    frame: Periodic height pulses made the bath ripple whether or not anyone moved.
    dimensions: [forcing source, coupling strength, rest without energy]
    move: "`pool-stroke.mjs` drives a slow anatomical hand skim, and the palm's measured submerged velocity relaxes nearby face velocities inside each CFL step."
    backtalk: Resting hands now add no energy. First samples, stalls and avatar changes cannot turn a placement jump into a fluid kick.
    reframe: Keep the coupling honest in the notes. The water never pushes the hand.
    commit: "edb99aee7"
  - date: "2026-10-02"
    title: Steam and light that know the house
    system: rendering-light
    frame: Eighteen vapor points did not read as steam, and diffuse light ignored the walls between rooms.
    dimensions: [scalar transport, volume compositing around glass, static visibility and bounce]
    move: Replaced the points with an 18³ thermal density and temperature field rendered by single scattering, and added a CPU-traced static light field with one diffuse bounce and four warm fixtures.
    backtalk: The bath shirt read as skin, so it became opaque teal fabric with diffusion off, and privacy no longer depends on steam or angle. Trials with dense steam and misplaced fixtures were excluded from the accepted evidence.
    reframe: Keep native refraction and reflections separate from the custom diffuse cache.
    commit: "780f1292f"
    sources: [stam1999stable, fedkiw2001smoke, wronski2014fog, ramamoorthi2001irradiance, majercik2019ddgi]
  - date: "2026-10-12"
    title: Twenty-six seconds of shaders, moved off the page
    system: loading
    frame: Opening the 3D home froze the page for about 13 seconds, then again when the rooms streamed in and on the first Look around.
    dimensions: [programs first used in a frame, blocking time per program, time to the first view, changed pixels (must stay zero)]
    move: "`program-warmup.mjs` creates every program a frame needs and waits for the driver without blocking, and streamed rooms join the house once their programs are ready."
    backtalk: Three's `compileAsync` cut blocking from 26 s to 5 s, but each first frame still linked ten programs; a define diff showed the shadow pass is keyed without fog. The result was 0.6 s of blocking reads, readiness from 11.3 to 7.5 s, and 0 changed pixels.
    reframe: Next was the outside view's cost, about 2,000 draws a frame.
    commit: "011fe99b2"
    sources: [khr-parallel-shader-compile]
  - date: "2026-10-13"
    title: A mirror that rendered the house twice
    system: water-atmosphere
    frame: Stepping outside cost about 1,900 draws a frame, and the sea's reflection was a large share.
    dimensions: [draws and triangles per pass, mirror resolution, changed pixels]
    move: The 384 px mirror skips transmissive meshes, and the house and footer canvases stopped multisampling because their composers already multisample off screen.
    backtalk: A transmissive mesh made Three redraw the whole opaque scene at full canvas size even inside the mirror. The outside frame fell from 1,934 to 1,574 draws and from 4.45 to 3.57 million triangles, with 0 changed pixels.
    reframe: A profile then showed draw submission takes about 11 of the 16 ms outside, and merging static meshes became the next suspect.
    commit: "38ee5438e"
  - date: "2026-10-13"
    title: A look lab instead of a guess
    system: rendering-light
    frame: A new tone curve or bloom changes every frame of the home, so the choice needed matched evidence.
    dimensions: [tone curve, exposure matched to mean brightness, bloom threshold, fabric sheen]
    move: URL flags became session-long previews (`95f1f27e7`). I asked for the call to be made from the matched sheet, and the shipped look is ACES Filmic, bloom above 1.6 and fabric sheen.
    backtalk: At equal exposure AgX and Neutral rendered 4 % and 12 % darker than ACES, so exposure factors of 1.08 and 1.24 came first. Neutral was truest at noon outside but greyed the evening shadows. Raising the bloom threshold from 0.92 to 1.6 removed the midday haze while the evening sconce still glows.
    reframe: Hair highlights, smoother edges and the ocean are now judged against this look.
    commit: "84cc25a7b"
    sources: [agx, khronos-pbr-neutral]
  - date: "2026-10-13"
    title: A loading bar that only reports finished work
    system: loading
    frame: Opening the 3D home showed an empty frame and a status line for 2 to 6 seconds, with nothing to say whether it was working.
    dimensions: [work known up front, progress source per piece, whether the bar can run ahead, longest main-thread task]
    move: A five-segment progress bar fills from real events, and the warmup creates programs in batches of six materials with a task boundary between them.
    backtalk: The first bar sat at 80 % for 2.2 s because one task created every program. A profile blamed the shadow variants, but timing each section showed `renderer.compile(scene)` took 0.1 to 1.6 s in a single task. Batches cut the longest frame from 658 to 196 ms, with the same 48 programs and 0 changed pixels.
    reframe: A sampling profile is a lead, not a verdict. Time the sections before changing one.
    commit: "cd395cbae"
    sources: [harrison2007progress]
  - date: "2026-10-13"
    title: Starved, not slow
    system: loading
    frame: The page still froze in steps of up to 0.7 s while the bar filled, and the plan was to spread out buffer and texture uploads.
    dimensions: [wall time against CPU time per task, concurrent compiles, programs created after the warmup, readiness]
    move: The warmup submits a batch only while no more than half the logical cores' worth of programs are compiling, and gives custom depth materials the side and alpha state the shadow pass copies onto them.
    backtalk: The uploads were not the problem. The worst tasks used 3 to 7 ms of CPU across 1.0 to 1.5 s of wall time, because the GPU process ran up to 21 compiles at once on 22 cores and the page waited for a turn. Interleaved runs moved the longest task from 658 to 209 ms and readiness from 4.66 to 5.17 s; an earlier batch-against-batch gain was drift.
    reframe: Compare variants interleaved, never batch against batch.
    commit: "b0834bbac"
