      - id: glazing
        name: Anti-reflective glass front
        status: shipped
        since: "2026-10-14"
        what: The cave front and the terrace balustrade use low-iron, anti-reflective glass, about 1 % reflectance head-on, so the cut-away house stays readable by day.
        how: >-
          `glazing.mjs` draws each pane over what is behind it with premultiplied blending: its color is only what it
          reflects, and the view through is dimmed by that share plus a little absorption. A Schlick term still turns the
          pane into sky toward grazing angles, as real glass does. The panes are not transmissive, because a transmission
          material would refract a copy of the opaque scene and lose the transparent onsen water and steam behind the front.
          Glass casts no shadow and does not occlude the contact pass, the volume depth or the light field; its frames do.
        files:
          - path: assets/js/home-scene/glazing.mjs
            role: The anti-reflective glass material.
          - path: bin/coastal_facade.py
            role: The frame, panes and sliding doors.
        sources: []
        limits:
          - Ordinary glass (4 %) is physically right and turned the cut-away view into sky by day; the 1 % coating is a legibility choice.
        next: []
      - id: light-well
        name: A light well with traced shaft light
        status: shipped
        since: "2026-10-14"
        what: A shaft drilled from the clifftop brings direct sun into the onsen, and the beam, its sun patch, the shaft's skylight and the lit steam all share one visibility function.
        how: >-
          `bin/coastal_lightwell.py` drills a shaft of 0.42 m radius, 1.67 m through the rock, leaning 28° toward the noon
          sun, and exports a shadow-only copy of the onsen's vault, so the bath receives direct sun only through the shaft
          even while the cutaway lifts the roof. `light-well.mjs` follows four light paths. The sun's shadow map carries the
          moving patch on the floor or water. Dust in the beam is single scattering with a mildly forward Henyey–Greenstein
          phase, marched only inside the shaft's elliptic cylinder, and the same visibility masks the steam's sunlight.
          Quasi-Monte Carlo path tracing of the drilled cylinder, on a fixed Halton sequence so it does not flicker, gives
          the radiance leaving the aperture whenever the sun moves. Lambert's closed form for a uniformly bright polygon then
          lights the bath from the aperture and from the sun patch as two small area lights. `?onsen-light=open` restores
          the open sky for comparison.
        files:
          - path: bin/coastal_lightwell.py
            role: The drilled shaft and the shadow-only vault.
          - path: bin/refresh_coastal_lightwell.py
            role: Rebuilds the shaft in the retained house.
          - path: assets/js/home-scene/light-well.mjs
            role: Shaft visibility, dust beam, traced aperture radiance and area lights.
          - path: assets/js/home-scene/steam-volume.mjs
            role: Masks the steam's sunlight with the shaft visibility.
        tests:
          - test/light-well.test.mjs
        sources: [wronski2014fog]
        limits:
          - Only 5.5 % of the sky passes a shaft four radii long (the tracer matches the analytic view factor to within 0.4 %), so outside midday the grotto is darker than the open cutaway was.
          - At plausible dust densities the beam is invisible; it shows because the bath air is humid.
        next:
          - move: Choose between the grotto and an open onsen with the well seen only from the clifftop.
            readiness: needs-decision
      - id: look-and-finish
        name: Tone curve, bloom and fabric sheen
        status: shipped
        since: "2026-10-13"
        what: The finish tone-maps with ACES Filmic, blooms only true light sources and gives woven fabric a sheen; URL flags preview alternatives for matched comparisons.
        how: >-
          `realism.mjs` owns the room finish: the contact pass, beauty, an optional bloom and the output pass. Bloom is the
          vendored r164 `UnrealBloomPass`, loaded on demand, glowing HDR values above 1.6 before tone mapping. That is above
          sunlit walls, so midday frames are unchanged while the evening lamps glow. Linen, textile and jute use Three's
          Charlie sheen, after Estevez and Kulla. `look.mjs` keeps session-long preview flags (`?tone=aces`, `agx` or
          `neutral`, `&bloom=0|1`, `&sheen=0|1`, `?look=reset`), and exposure factors keep AgX and Khronos PBR Neutral within
          2 to 3 % of ACES's mean brightness, so a comparison is not decided by brightness alone.
        files:
          - path: assets/js/home-scene/look.mjs
            role: Session-long look flags.
          - path: assets/js/home-scene/realism.mjs
            role: Finish pipeline, bloom and sheen materials.
          - path: assets/js/home-scene/controller.mjs
            role: Exposure factors per tone curve.
        tests:
          - test/scene-look.test.mjs
        sources: [estevez2017sheen, agx, khronos-pbr-neutral, threejs-r164]
        limits:
          - The chosen curve is a judgment from one matched sheet. Neutral kept the truest coast colors at noon but lifted evening shadows into grey; AgX greyed the sandstone and whitened lamplight.
        next: []
      - id: hair-highlights
        name: Strand highlights on hair
        status: shipped
        since: "2026-10-13"
        what: Hair gets two shifted highlight bands across the strands instead of a round spot.
        how: >-
          `strandHighlights` in `realism.mjs` adds two lobes to every avatar's hair material: a near-white primary shifted
          toward the tips and a broader, hair-tinted secondary shifted toward the roots. They are the R and TRT lobes of
          Marschner and colleagues in Scheuermann's real-time form, on Kajiya and Kay's strand model, broken up by slow clumps. The avatars carry no strand tangents, so each strand
          direction is combed from the crown of the hair mesh's bind pose along the surface and skinned like a normal. The
          lobes join Three's per-light loop, so shadows and every lamp apply. Widening the lobe by the normal's variance
          across the pixel, while keeping its energy, removed sparkle at the hairline (geometric specular antialiasing).
        files:
          - path: assets/js/home-scene/realism.mjs
            role: The strand-highlight material hook.
        sources: [kajiya1989fur, marschner2003hair, scheuermann2004hair, kaplanyan2016normals, tokuyoshi2019gsaa]
        limits:
          - Direct light only; reflections of the environment on hair stay a plain rough response.
        next:
          - move: Measure sparkle on other bumpy surfaces before applying the same lobe widening everywhere.
            readiness: needs-measurement
      - id: procedural-materials
        name: Physical-scale surface detail
        status: shipped
        since: "2026-09-13"
        what: Wood grain, fabric weave, lime plaster, veined marble, travertine, sandstone bedding, honeycomb weathering and wet intertidal rock are computed in the shader from physical coordinates, with no texture downloads.
        how: >-
          `realism.mjs` derives detail from world-space meters, so its scale survives batching and the many UV layouts in the
          glTF exports, from three octaves of hashed value noise (`surfaceNoise`). Close-range sandstone gets bedding planes
          of uneven thickness that show only where weathering picks them out and fade before they are thinner than a pixel,
          honeycomb weathering (tafoni) from Worley cells in patches on steep faces, runoff streaks, and a soil-and-grass tint
          on the clifftop. Rock the high tide reaches stays wet, darker and glossier, with a band of algae low and barnacle
          specks above. Since the October 17 renovation every wall is lime plaster: soft clouds about a metre across,
          overlapping trowel strokes whose direction changes from patch to patch, drawn in the three axis planes and blended
          by the surface normal so a curved vault shows no seam (Geiss's triplanar texturing), and a faint burnish that lowers
          roughness along the strokes. Milky marble gets soft clouds and wandering veins from the sine of a warped coordinate,
          Perlin's marble, which widen and fade with distance instead of shimmering; travertine gets warm bands and small open
          pores. Bumps use Mikkelsen's surface-gradient bump mapping, filtered below a pixel.
        files:
          - path: assets/js/home-scene/realism.mjs
            role: Procedural surface detail for every finished material.
            functions: [finishPhysicalMaterial, surfaceNoise]
          - path: assets/js/home-scene/materials.mjs
            role: Shared material art direction.
          - path: bin/coastal_renovation.py
            role: The renovation's palette, whose material names key the procedural kinds.
            functions: [apply_palette]
        sources: [worley1996cellular, geiss2007terrain, perlin1985image, mikkelsen2010bump]
        limits:
          - Procedural detail is not included in the light field's bounce albedo.
          - Trowel strokes fade once a pixel covers more than about 5 mm of wall, so walls read smooth in the wider views.
        next:
          - move: Bark plates for the Torrey pines.
            readiness: ready

  - id: water-atmosphere
    name: Water and atmosphere
    summary: >-
      Two bodies of water with different models. The Pacific is a bounded analytic spectrum whose colour comes from its
      optics over a seabed read from the coast's own geometry: turquoise over sand, deep blue offshore, caustics on the
      sand, a live mirror with lamp streaks, the sun's glints in the hue of the day's real low sun, and a shore that runs
      to the true waterline. The onsen is a small simulated height field driven by the bather's hand, whose waves and
      sub-grid ripples throw caustics on the basin. Steam rises from the bath as transported scalar fields.
    techniques:
      - id: ocean-spectrum
        name: A bounded Gerstner ocean
        status: shipped
        since: "2026-10-01"
        what: Ten deterministic wave components displace the sea geometry and its pixel normals together, and twelve short ripples tilt the normals up close.
        how: >-
          `ocean-spectrum.mjs` authors ten choppy Gerstner components from 24.7 m to 6.1 cm with gravity–capillary
          dispersion, ω² = gk + (σ/ρ)k³, and analytic tangents of the actual displacement, after Finch's GPU Gems chapter.
          Keeping the steepness sum Σqak under 0.3 prevents foldover. Each amplitude fades with a Gaussian weight of the
          pixel's footprint, and the slope energy it loses widens the GGX lobe, so a distant sea neither flattens nor
          sparkles: a scalar version of Bruneton, Neyret and Holzschuch's transition from geometry to BRDF. Twelve
          normal-only ripples, spread over the wind's half-plane by the golden angle from 0.9 m to 2.4 cm, break up the ruled
          stripes that single plane waves made at walking distance.
        files:
          - path: assets/js/home-scene/ocean-spectrum.mjs
            role: Wave components, footprint filtering and the CPU wave sampler.
          - path: assets/js/home-scene/environment.mjs
            role: The sea shader.
          - path: assets/js/home-scene/PHYSICS.md
            role: Equations and evidence.
        tests:
          - test/coastal-physics.test.mjs
          - test/coast-wave-motion.test.mjs
        sources: [finch2004gerstner, bruneton2010ocean, arcblanc2025]
        limits:
          - A sparse authored spectrum on a finite 400 m surface, with no FFT, measured spectrum, cascades or weather.
          - The roughness widening is a scalar isotropic fit, not the paper's anisotropic slope statistics.
        next:
          - move: A spectral FFT ocean after Tessendorf, kept consistent with the CPU sampler that floats objects and aims arrival rays.
            readiness: needs-research
      - id: sea-optics
        name: Seawater optics over the seabed
        status: shipped
        since: "2026-10-18"
        what: >-
          The sea's colour comes from what the water absorbs and scatters over the seabed beneath it: sand at the waterline,
          turquoise over a metre of water, blue-green and navy offshore, darker in shadow and at night, with no palette.
        how: >-
          `seawaterIOPs` in `sea-optics.mjs` builds absorption and backscattering at 650, 550 and 450 nm from Pope and Fry's
          pure water (0.34, 0.0565 and 0.00922 m⁻¹) plus phytoplankton and CDOM after the bio-optical relations Lee et al.
          use, for an authored clear La Jolla day (0.25 mg m⁻³ of chlorophyll, 0.015 m⁻¹ of CDOM at 440 nm). The sea shader
          refracts the view ray at the wave normal, takes two steps along it to the captured seabed, and evaluates Lee et
          al.'s semianalytical shallow-water reflectance (1998, equation 21) with the upward factors stretched by 1/cos θ_v
          for an oblique view, then R_rs = 0.5 r_rs/(1 − 1.5 r_rs) (Lee et al. 1999) times the light arriving at the pixel and
          the surface's transmission. The bottom's light separates the sun, whose shadow on the seabed is looked up where its
          refracted ray crossed the surface and whose ripples focus it into caustics, from the sky. The seabed is rippled
          sand, rock with algae, coralline crust and surfgrass, and reef with kelp past the authored coast. Breakers add
          spectrally flat backscattering in the surf zone, so it turns milky, and Fresnel splits refraction from the mirror.
        files:
          - path: assets/js/home-scene/sea-optics.mjs
            role: Inherent optical properties, the shallow-water reflectance, the caustic lens and the seabed's albedo, in JavaScript and GLSL.
            functions: [seawaterIOPs, shallowReflectance, aboveSurface, causticGain, causticMean, fillSeabed, seaOpticsGLSL]
          - path: assets/js/home-scene/environment.mjs
            role: The sea shader's optics, shadow lookups, glitter, lamp streaks and wakes.
            functions: [createPacific]
          - path: assets/js/home-scene/PHYSICS.md
            role: Equations, sources, cost and limits ("Seawater optics, the seabed and the shore").
        tests:
          - test/sea-optics.test.mjs
          - test/visual/desk-scene.spec.js
        sources: [pope1997water, lee1998shallow, lee1999shallow, watt1990beam, cox1954glitter]
        limits:
          - Lee et al.'s model is a fit for nadir viewing over a Lambertian bottom; the oblique stretch and the split between sun and sky are adaptations.
          - The water's constituents are authored for one clear day, with no weather, plume or season.
          - Caustics come from the pixel-stage ripples on one paraxial sheet of the refracted map, without the overlapping images of a strongly folded caustic.
          - The subsurface reflectance stops at 0.3 before Lee et al.'s conversion, which diverges at 2/3 under a focused caustic over bright sand.
        next:
          - move: Let the swell feel the captured seabed, shoaling and refracting toward the beach, now that the depth under every point is known.
            readiness: needs-research
            why: Boundary-aware procedural waves keep the analytic spectrum but need a wave speed that depends on depth and the boundary.
      - id: seabed-capture
        name: A seabed read from the coast
        status: shipped
        since: "2026-10-18"
        what: One orthographic draw of the coast from above records the sand and rock under the water; the open seabed continues down from it, and the shoreline gets its own distance field.
        how: >-
          `createBathymetry` in `bathymetry.mjs` draws the coast's meshes once into an 800 × 160 float target (0.5 m cells
          over x −200 to 200 m and z −80 to 0 m), each cell keeping the highest surface below a clip plane 0.5 m over the
          sea. A back face seen from above below sea level is the inside of a solid that rises through the water: it wins
          every depth test and marks the column dry. `fillSeabed` keeps every captured height and extends the open seabed by
          max(h − 0.08 d) over captured cells (a two-pass chamfer), steepened by 0.003 r² from the coast to a 14 m floor, and
          measures each cell's distance to dry land and to the captured coast. The coast's capture reads back synchronously
          before the first composed frame; the hinterland's coves follow through a pixel-pack buffer behind a fence, polled
          with scheduler tasks. The shader samples a half-float texture of height, rock share, shore distance and coast
          distance.
        files:
          - path: assets/js/home-scene/bathymetry.mjs
            role: The capture draw, the synchronous and fenced readbacks, the texture and the probes.
            functions: [createBathymetry]
          - path: assets/js/home-scene/sea-optics.mjs
            role: The slope-limited extension and the shoreline distance fields.
            functions: [fillSeabed]
          - path: assets/js/home-scene/controller.mjs
            role: Captures the coast at load and the hinterland when it streams in.
        tests:
          - test/sea-optics.test.mjs
          - test/visual/desk-scene.spec.js
        sources: []
        limits:
          - Beyond the authored beach (0.75 m deep) and the cliff's foundation the seabed is a smooth extension, not surveyed bathymetry.
          - Nothing under the water casts a shadow or shows in the mirror, and the 0.5 m cells soften small rocks.
        next:
          - move: Author reef, sand channels and a kelp bed into the coast model, so the capture reads real underwater geometry instead of noise.
            readiness: needs-decision
            why: The capture already takes any mesh below the clip plane; the decision is how much underwater art the coast should carry.
      - id: sea-sunset
        name: The low sun on the water
        status: shipped
        since: "2026-10-18"
        what: >-
          At golden hour and sunset the sun's path on the swell takes the hue of the day's real low sun over La Jolla, gold
          at 8 degrees and red-orange on the horizon; it breaks into glints that flash near the house and twinkle far out,
          and widens as the wind roughens the water.
        how: >-
          The water reads the sun through one accessor, `waterSky`. On October 18 it coloured the sun's path with `sunTint`
          in `sea-optics.mjs`, the direct beam's transmittance at the sea's three bands along its slant path (Kasten and
          Young's optical air mass at the sun's altitude, Hansen and Travis's Rayleigh optical depth and an authored clean
          coastal haze), relative to the sun at 40 degrees, so only the hue changed. Since October 19 `waterSky` takes the
          scattering sky's own sun, already gold and dim through the atmosphere (`atmosphere.state`), and that tint is one.
          The sea's shader keeps the sun's GGX lobe apart from the other lights (`RE_Direct_SeaSun` in three r164's
          directional-light loop) and breaks it into glints: a patch of sea, 9 cm or the pixel's footprint, holds on average
          N = (patch / 3 cm)² D(h) cos θ_h Ω / (4 h·l) facets aimed at the sun's disc; each patch draws its count for its own
          seventh of a second with mean one, and half the lobe draws as that count and half as a steady glow, which tone
          mapping keeps.
        files:
          - path: assets/js/home-scene/environment.mjs
            role: The separated sun lobe, the glints and the water's sky accessor.
            functions: [createPacific, waterSky]
          - path: assets/js/home-scene/sea-optics.mjs
            role: Air mass, Rayleigh and haze optical depths and the first low-sun hue, kept with its tests.
            functions: [airMass, rayleighDepth, sunTransmittance, sunTint]
          - path: assets/js/home-scene/atmosphere.mjs
            role: The scattering sky whose sun the water now reads.
            functions: [createAtmosphere]
        tests:
          - test/sea-optics.test.mjs
          - test/visual/desk-scene.spec.js
        sources: [hillaire2020sky, kasten1989airmass, hansen1974rayleigh, cox1954glitter]
        limits:
          - Glints are a statistical closure on the GGX lobe with an authored 3 cm facet, not individual ripples.
          - The three-band tint survives in `sea-optics.mjs` and its tests but no longer colours the water.
        next: []
      - id: shoreline
        name: Swash, wet sand and lit foam on the true waterline
        status: shipped
        since: "2026-10-13"
        what: >-
          Where the sea meets the beach and the rocks, a lacy swash band breathes with each wave's run-up, broken fronts
          travel in and fade, foam is lit like a white surface, and since October 18 all of it follows the waterline the
          seabed capture measures, around the haul-out rocks too.
        how: >-
          In the sea shader, foam comes from compression of the horizontal displacement Jacobian and from crest height near
          the shore; a swash band follows a periodic run-up, and a broken front starts about 3 m out and fades as it
          travels. The distance they use is the captured distance to dry land (`bathymetry.mjs`), which fixed the authored
          profile's 1.5 m offset on the left of the beach. Foam takes the pixel's own diffuse light. Beach sand no longer
          casts sun shadows (it lies within a shadow-map texel of the shallow water over it and shaded that water in
          straight-edged patches), and the sea's shadow lookup rises 20 cm; rocks, animals and the cliff still shade it. The
          swimming sea lions draw a Kelvin-angle V wake with white water close behind and a ring where they re-enter, and
          the diving pelican a ring where it hits the water (`waterMarks` in `wildlife.mjs`), as slopes and foam on the
          surface.
        files:
          - path: assets/js/home-scene/environment.mjs
            role: Foam, swash, surf-zone silt, wakes and rings, and the shadow lift.
          - path: assets/js/home-scene/bathymetry.mjs
            role: The shoreline distance field.
          - path: assets/js/home-scene/wildlife.mjs
            role: Where the swimmers and the diving pelican meet the water.
            functions: [waterMarks]
          - path: assets/js/home-scene/shore.mjs
            role: Exported shoreline rows and support polygons, the fallback before the capture.
        sources: []
        limits:
          - Art-directed, with no foam transport, conservation of foam or breaking-wave solver.
          - The 0.5 m shoreline field softens the swash around small rocks.
          - Wakes and rings are patterns drawn from the animals' poses, not waves that travel, reflect or interfere.
        next:
          - move: Crest glow, which needs back light the default camera rarely sees.
            readiness: needs-research
      - id: sea-reflection
        name: Planar sea reflection, glitter and lamp streaks
        status: shipped
        since: "2026-09-13"
        what: >-
          A 384-pixel live mirror reflects the actual cliff and house with exact water Fresnel; since October 18 the ripples
          stretch it into vertical bands, the sun's or the moon's path breaks into glints, and after dark the terrace's lamps
          streak across the water.
        how: >-
          `reflection.mjs` renders the scene from a camera mirrored across the water plane with an oblique near plane, after
          three.js r164's Water, in linear radiance. The wave normal's screen-space tilt distorts the mirror more vertically
          than across, and seven taps along the vertical blur it by about the slope deviation. Unpolarized dielectric
          Fresnel with n = 1.333 replaces only indirect specular. In the sea shader the festoon's swags, the fire bowl and the
          terrace wall lights are mirrored by GGX with inverse-square falloff and at most the roughness of 2 m ripples, their
          bulbs counted at four times their lighting budget. The mirror still skips transmissive meshes, and since October
          19 it hides the sun's disc while it draws, because the sea's own specular lobe reflects the sun.
        files:
          - path: assets/js/home-scene/reflection.mjs
            role: The mirror camera, clipping, distortion, streak taps and Fresnel.
            functions: [createSeaReflection]
          - path: assets/js/home-scene/environment.mjs
            role: The lamp streaks.
        tests:
          - test/coastal-physics.test.mjs
        sources: [threejs-r164]
        limits:
          - A flat reference plane with slope-based distortion and seven taps, not a ray-traced curved reflector.
          - Lamp streaks have no occlusion, and indoor lamps are left out.
        next: []
      - id: onsen-water
        name: A height-field onsen
        status: shipped
        since: "2026-10-02"
        what: The onsen is a 40 × 40 shallow-water height field. Waves carry water between cells, reflect off the rim and the bather, and fade.
        how: >-
          `heightfield-water.mjs` follows section 2.1 of Chentanez and Müller: staggered heights and face velocities,
          conservative upwind depth fluxes, pressure from the free-surface gradient and reflecting solid faces, at fixed
          1/120 s ticks with CFL subdivision. `pool-geometry.mjs` measures the real basin (about 0.127 m deep). The bather is
          a one-way circular obstacle; `pool-stroke.mjs` drives a slow anatomical hand skim whose submerged palm velocity
          relaxes nearby face velocities, so resting hands add no energy. `onsen-water.mjs` packs elevation, slopes and wet
          weight into a 40² texture for the existing material. Since October 18 the basin's stone takes the water's light
          (`bindCausticReceiver`): light from above refracts into the water, and the simulated surface refocuses it on the
          stone by 1/|det(I + l(1 − 1/n) Hess h)|, with the surface's transmission, the water's absorption and wet stone,
          evaluated once per fragment for every light. Six sub-grid capillary-gravity ripples (1.6 to 5 cm) ride on the
          simulated waves with a height set by the simulated slope, so a calm pool stays exactly flat; they tilt the surface
          and focus the light but carry no mass or energy. The water's attenuation distance fell from 1.5 to 0.6 m and its
          sky reflection from 1.2 to 0.55, so the bath reads as clear turquoise over stone. The solver runs only when the
          camera can see the pool.
        files:
          - path: assets/js/home-scene/heightfield-water.mjs
            role: The conservative shallow-water solver.
          - path: assets/js/home-scene/onsen-water.mjs
            role: Renderer adapter, palm coupling, caustic receivers, sub-grid ripples and evidence.
            functions: [createOnsenWater, bindCausticReceiver, poolCausticGLSL, poolRippleGLSL]
          - path: assets/js/home-scene/pool-geometry.mjs
            role: Measures the native basin.
          - path: assets/js/home-scene/pool-stroke.mjs
            role: The prescribed hand skim.
          - path: assets/js/home-scene/ONSEN-WATER.md
            role: Equations, coupling limits and numerical evidence.
        tests:
          - test/onsen-water.test.mjs
          - test/onsen-caustics.test.mjs
          - test/pool-geometry.test.mjs
          - test/pool-stroke.test.mjs
        sources: [chentanez2010water, watt1990beam]
        limits:
          - First-order semi-Lagrangian velocity advection, and no wet and dry terrain, open boundaries, buoyancy or splashes.
          - One-way coupling. The water never pushes the hand or the bather.
          - Shallow-water dispersion is inaccurate for wavelengths near the depth; the sub-grid ripples are a rendering closure, not simulated surface tension.
          - Caustics take one paraxial sheet for light from overhead; a low lamp would shift its pattern, and an extended lamp's size does not blur it.
        next:
          - move: A steady drip from the bamboo spout into the solver at the spout's mouth, which would keep the pool and its caustics alive between strokes.
            readiness: needs-decision
            why: The brief says the water's forcing comes from the palm; a spout adds a second source, which is Sirui's call.
      - id: thermal-steam
        name: Thermal steam
        status: shipped
        since: "2026-10-02"
        what: Bath mist is two transported scalar fields, droplet concentration and temperature, rendered with emission-free single scattering.
        how: >-
          `steam-density.mjs` advects an 18³ concentration and temperature field at a fixed 30 Hz with midpoint
          semi-Lagrangian backtracing, after Stam, and lets warmer cells rise faster, after Fedkiw, Stam and Jensen's
          separate smoke density and temperature. It diffuses and cools them with exact exponential factors and relaxes the
          warm surface sources. Wind inside the bath is the shared curl field at 0.16 strength. `steam-volume.mjs` marches up
          to 40 samples with Beer–Lambert extinction and a normalized Henyey–Greenstein phase, after Wronski, and splits each
          ray once at the nearest glass or water interface so the gas behind and in front of it composes in order.
        files:
          - path: assets/js/home-scene/steam-density.mjs
            role: Concentration and temperature transport.
          - path: assets/js/home-scene/steam-volume.mjs
            role: Single-scattering ray march and the interface split.
          - path: assets/js/home-scene/volume-depth.mjs
            role: Opaque and nearest-transmissive depth for the split.
          - path: assets/js/home-scene/THERMAL-STEAM.md
            role: Model, light integration and cost.
        tests:
          - test/steam-transport.test.mjs
        sources: [stam1999stable, fedkiw2001smoke, wronski2014fog]
        limits:
          - Prescribed buoyant rise, with no pressure solve, phase change or mass-conserving gas solver.
          - Single scattering and short-range attenuation only; beyond the light-well mask there is no opaque sun-shadow query.
        next: []

  - id: wind-plants
    name: Wind, plants and cloth
    summary: >-
      One coastal wind, the October sea breeze measured at Scripps Pier with gust fronts that travel downwind,
      moves the sea's wind waves, ripples and whitecaps, the clifftop planting, the room plants, the curtains, the
      bath steam, and the dust and spray. Inside the house a small divergence-free eddy field adds the room's own air.
    techniques:
      - id: coast-wind
        name: One wind for the coast
        status: shipped
        since: "2026-10-16"
        what: >-
          One wind state drives the sea, the planting, the room plants, the curtains, the steam and the particles, so a
          gust that roughens the water reaches the bluff seconds later and the curtains when it meets the glass.
        how: >-
          `wind-field.mjs` runs a periodic cubic Hermite through the October averages at Scripps Pier (NDBC LJPC1,
          2023–2025): a land breeze from the east at night, a 0.7 m/s lull at 09:00 while the wind turns through north, a
          west-north-westerly sea breeze peaking at 2.75 m/s at 15:00, and a lighter evening. Gusts are a function of
          retarded time t − x·d/c, with c the mean speed (Taylor's frozen turbulence). They come in hashed 8-second slots,
          each rising over 1.2 s and decaying over 3.5 s, in patches 70 m across. The envelope averages 1, with a
          turbulence intensity of 0.15 and a ten-minute gust factor of 1.67. The lowbias32 integer hash is exact in
          JavaScript and in GLSL ES 3.00, so the GPU matches the CPU to 3.3 × 10⁻⁵. The sea turns and grows its wind waves
          (a Pierson–Moskowitz cut, never above the authored heights), scales its pixel ripples by the Cox–Munk slope law
          in the local, gusty wind, and adds Monahan whitecaps. Indoors the breeze leaks in at 1.2 % with the doors shut
          and 6 % with them open. The spray rides the open wind, and the dust and steam drift in the house's air.
          `coastWind.vane(x, z)` serves a wind sock.
        files:
          - path: assets/js/home-scene/wind-field.mjs
            role: The daily breeze, gust fronts, indoor share, samplers, vane and shared GLSL.
          - path: assets/js/home-scene/ocean-spectrum.mjs
            role: Wind sea, ripples and whitecaps in the coast's wind.
          - path: assets/js/home-scene/environment.mjs
            role: Binds the sea and the spray and dust to the coast's wind.
          - path: assets/js/home-scene/PHYSICS.md
            role: Equations, station data, sources, evidence and limits ("One wind for the coast").
        tests:
          - test/coast-wind.test.mjs
          - test/coastal-transport-rendering.test.mjs
        sources: [ndbc-ljpc1, taylor1938turbulence, pierson1964spectrum, cox1954glitter, monahan1980whitecaps, wellons2018hash]
        limits:
          - Frozen turbulence over flat ground. There is no shelter or speed-up from the bluff, the house or the cliff, and no change with height.
          - The outdoor field is not divergence-free; only the indoor eddies keep the curl field's guarantee.
          - October's cycle all year, though summer afternoons at the pier average 3.5 m/s.
          - Whitecap coverage is exaggerated tenfold, and the swell components stay authored.
        next:
          - move: Follow the station's monthly cycles, so summer afternoons blow harder than October's.
            readiness: ready
            why: The station records are already averaged by hour; a month axis is a table, not a model.
          - move: Calm the lee of the house and the cliff edge with a coarse shelter mask on the gust envelope.
            readiness: needs-research
            why: A mask breaks no guarantee here, but where the lee falls needs the cliff's profile against the breeze.
      - id: curl-wind
        name: A divergence-free wind field
        status: shipped
        since: "2026-10-02"
        what: A six-mode curl-noise field adds the small eddies of the house's own air to the coast's wind, for the room plants, the curtains, the dust and the bath steam.
        how: >-
          `wind-field.mjs` takes the analytic curl of a bounded vector potential, a small Fourier basis in place of
          Bridson, Hourihan and Nordenstam's Perlin potentials, so the velocity is exactly divergence-free and bounded.
          Wavelengths run from 1.2 to 7 m. Since October 16 its amplitude is 0.6 of the coast breeze's indoor share, so the
          eddies grow when the doors open and fall nearly still when they shut. The same field runs in GLSL and on the
          CPU, which agree within the 8-bit quantization step in native fixtures.
        files:
          - path: assets/js/home-scene/wind-field.mjs
            role: The curl-potential field, CPU and GLSL.
          - path: assets/js/home-scene/coastal-wind.mjs
            role: Binds the room plants to the field and the coast's state.
          - path: docs/coherent-wind-equations.md
            role: Field, bound, attachment and particle equations.
        tests:
          - test/coastal-wind.test.mjs
        sources: [bridson2007curl]
        limits:
          - Procedural, not a pressure-projected flow, with no obstacles or building collision.
        next: []
      - id: rooted-leaves
        name: Leaves attached to real stems
        status: shipped
        since: "2026-10-02"
        what: Room-plant leaves bend in the wind around their actual attachment points, with corrected normals and matching shadows.
        how: >-
          `plant-motion.mjs` finds each leaf component's attachment once, from nearby support vertices of the real stems, and
          stores a root, a weight and its gradient per vertex. Each component follows the steady periodic response of a
          critically damped oscillator to the wind, at most 11.7 mm of horizontal deflection from the eddies; in the coast's
          breeze a bend saturates softly toward 15 mm (`PLANT_BEND_LIMIT`). Normals use the inverse
          transpose of the bend's Jacobian. The identical hook runs on beauty, depth and distance materials, so shadows bend
          with the leaves. 110 of 132 olive-leaf components bend; hanging vines and agave stay rigid. The renovation's new
          plants first had floating leaves: a plain cylinder stem has vertices only at its ends, so no stem vertex lay within
          the 2.5 cm search. `rooted_leaf` now puts every leaf on its own short twig, and the study's fig and the living room's
          and kitchen's olives sway too (403 rooted components bend, 30 stay still).
        files:
          - path: assets/js/home-scene/plant-motion.mjs
            role: Attachments, damped response and the shared shader hook.
            functions: [PLANT_BEND_LIMIT]
          - path: assets/js/home-scene/coastal-wind.mjs
            role: Binds plants to the field.
          - path: bin/coastal_office.py
            role: Builds leaves on twigs for the renovation's plants.
            functions: [rooted_leaf]
        tests:
          - test/coastal-wind.test.mjs
          - test/coastal-transport-rendering.test.mjs
        sources: [bridson2007curl]
        limits:
          - An authored damped response, not calibrated leaf elasticity.
          - The indirect contact buffer sees the rest pose, a documented mismatch below 12 mm.
        next: []
      - id: facade-curtains
        name: Linen curtains on rings
        status: shipped
        since: "2026-10-16"
        what: Four sheer linen panels hang from rings on two bronze rods inside the sliding doors. Pinch-pleated headings soften into gravity folds and a weighted hem; the doorway panels lift in the coast's gusts and settle, the panels by fixed glass stir in the house's air, and they draw part way against the low western sun and close at night.
        how: >-
          Rebuilt on October 18. `createCurtainRig` and `createCurtainHardware` hang the panels on a 25 mm bronze rod 25 cm
          in front of each door head, with return brackets and finials; six rings per panel clip its top edge. Each panel
          (`createCurtainCloth`, `facadeCurtainPanels`, `createFacadeCurtains`) is a 33 × 21 particle island of
          `cloth-solver.mjs` (`clothBuilder`, `createClothIsland`): small-step XPBD at 30 Hz with six substeps, stretch and
          shear distance constraints on the fabric's own rest lengths, the isometric quadratic bending energy of Bergou and
          colleagues (`bendingWeights`, `projectBending`) at a 2.9 cm bending length, long-range attachments to the clips,
          ordering constraints that keep a gathered stack's folds from crossing, and contacts against the door pulls' plane,
          the door head beam, the rod and the floor. The heading row is a kinematic pinch-pleated tape: each clip pinches
          three columns, and the tape between pinches bows as a half sine at its own length, alternately toward the room and
          the glass (`foldAmplitude`). `createFacadeDraft` blows the coast's onshore breeze through each open doorway (0.55 ×
          softplus, about 1.2 m/s on an October afternoon) and carries the room field's divergence-free eddies through the
          doorway at 0.8 m/s. `createSheerFabric` draws linen: a 27 % open weave whose covered fraction is blended in the
          transparent pass, both faces in one draw, with slubs stretched along the warp, back light through the yarn with a
          forward Henyey–Greenstein lobe and a dithered partial shadow, and `createCurtainMeshes` draws each panel through a
          Catmull–Rom spline at three times the simulated resolution, column by column, so a stack's blended layers keep one
          drawing order down the drop. A panel steps only while the box around its cloth is on screen and about 90 px tall;
          the starting drapes settle on background tasks while the page loads, and `curtainSchedule` keeps its hours.
        files:
          - path: assets/js/home-scene/cloth-solver.mjs
            role: The small-step XPBD cloth.
            functions:
              [clothBuilder, createClothIsland, bendingWeights, projectBending, projectDistance, projectTethers, projectOrders, projectSeparations]
          - path: assets/js/home-scene/curtain-cloth.mjs
            role: Panels, heading, draft and schedule.
            functions: [createCurtainCloth, facadeCurtainPanels, createFacadeDraft, createFacadeCurtains, curtainSchedule, foldAmplitude]
          - path: assets/js/home-scene/curtain-rig.mjs
            role: The live rig, the hardware and the budget.
            functions: [createCurtainRig, createCurtainHardware]
          - path: assets/js/home-scene/sheer-fabric.mjs
            role: Linen shading and the refined meshes.
            functions: [createSheerFabric, patchSheerShader, patchSheerShadowShader, weaveOpenness, linenDensity, createCurtainMeshes]
          - path: assets/js/home-scene/PHYSICS.md
            role: '"Curtain cloth": what read as weird, the solver, the curtains, the draft, the fabric, cost, evidence and limits.'
        tests:
          - test/cloth-solver.test.mjs
          - test/curtain-cloth.test.mjs
          - test/curtain-schedule.test.mjs
          - test/visual/desk-scene.spec.js
        sources:
          [
            macklin2016xpbd,
            macklin2019smallsteps,
            muller2007pbd,
            bergou2006bending,
            bender2014continuous,
            kim2012lra,
            peirce1930handle,
            keckeisen2004wind,
            catmull1974splines,
            kotey2009screens,
            estevez2017sheen,
            henyey1941,
          ]
        limits:
          - No general self-collision. Ordering constraints keep a stack's folds in order, but a violent gust can fold a bay through its neighbour's far side.
          - One pass per substep leaves a few percent of local stretch near the clips (5.5 % at the median and 6.3 % at worst in the doorway jet), and an indoor gale stretches the panels like sails.
          - The heading tape is kinematic, so the very top row does not sway; the flat-plate air force cannot make flutter from vortex shedding, which the advected eddies stand in for.
          - In a room view the two panels on screen cost about 3.4 ms of the main thread a frame while they step (0.9 ms for the October 16 panels), with 4 to 6 more draws.
        next:
          - move: Step the panels on a worker, so the cloth never shares the main thread with the frame.
            readiness: needs-measurement
            why: Positions would arrive a frame late, and GitHub Pages cannot send the headers SharedArrayBuffer needs, so it would use transferable buffers.
          - move: Self-collision for a gathered stack by a spatial hash, once a step, in place of the ordering constraints.
            readiness: needs-measurement
            why: About 0.3 ms per panel per step is the budget.
      - id: terrace-laundry
        name: Laundry on the terrace
        status: shipped
        since: "2026-10-18"
        what: Three linen towels and Sirui's white linen shirt hang pegged on a cotton line between the first two festoon posts on the parapet, lifting toward the house in the afternoon sea breeze with the sea behind them; they are out while the house is open and in at dusk.
        how: >-
          `createLaundryLine` builds one `cloth-solver.mjs` island. The line is a chain of particles with long-range
          attachments to both posts, sagging 6 cm under the load; each 8 g wooden peg welds a cloth corner to a line node,
          so the towels' weight pulls the line into a V at every peg. The towels (indigo with natural warp stripes, natural
          with an ochre band, and terracotta; flat-woven linen, 230 g/m², 3.0 cm bending length) are pegged with slack, the
          pegs 72 % of the fabric apart, so their tops scallop and folds run down from the pegs. The shirt's front and back
          are welded at the shoulders and side seams, its rolled sleeves are tubes welded to the armholes, separation
          constraints keep its layers apart, and a placket runs down the front. The wind is the coast's open wind at a 42 %
          exposure (authored, against 12 % for the olive under the cave lip) plus eddies at 34 % of the local speed,
          advected onshore (`createTerraceDraft`), and `laundryOut` follows the doors' daylight rule. `createLaundryRig`
          draws one mesh per item from one shared buffer, the line as a tube and the pegs as one instanced mesh; it steps
          while any item's box is on screen and the laundry is about 40 px tall, at 30 Hz with six substeps, holds under
          Pause and composes a settled drape under reduced motion. Dense linen casts an ordinary shadow, which the shadow
          cache keeps once the laundry sleeps.
        files:
          - path: assets/js/home-scene/laundry-line.mjs
            role: The line, the pegs, the towels, the shirt and the terrace wind.
            functions: [createLaundryLine, createTerraceDraft, laundryOut, parapetPath]
          - path: assets/js/home-scene/laundry-rig.mjs
            role: The live laundry.
            functions: [createLaundryRig]
          - path: assets/js/home-scene/PHYSICS.md
            role: '"Laundry on the terrace".'
        tests:
          - test/laundry-line.test.mjs
          - test/visual/desk-scene.spec.js
        sources: [macklin2019smallsteps, bergou2006bending, kim2012lra, keckeisen2004wind]
        limits:
          - The towels and the shirt have no self-collision beyond the shirt's layer separation.
          - One pass per substep, so the towels stretch at most about 8 % locally, but a few edges at the shirt's shoulder pegs and armholes reach about 20 %.
          - The exposure is authored, not a shelter model of the terrace.
          - While it steps the laundry costs 1.4 ms a frame (2.7 ms at the 95th percentile) and 13 draws with its shadows; it is culled from room views.
        next:
          - move: Let Sirui hang the laundry and take it in himself in the routine, a short walk to the terrace after breakfast.
            readiness: needs-decision
            why: The routine's rooms do not include the terrace yet.
      - id: clifftop-sway
        name: Clifftop planting in the breeze
        status: shipped
        since: "2026-10-14"
        what: Sage, sagebrush, grass, wild oats, lemonade berry, Torrey pines and palm fronds bend in the coast's wind, with gusts rolling across the bluff downwind; their shadows bend too.
        how: >-
          `bin/coastal_flora.py` writes a sway weight into each leaf, needle and blade's UV x, 0 at the plant's base and 1
          at its top. `patchFloraSway` in `plant-motion.mjs` bends by that weight squared. The lean is reach · (U g)^1.4,
          with the gust envelope read 2/ω late: drag on a streamlining leaf grows like U^(2+V), with Vogel exponent near
          −0.6. A sway at each species' own frequency, phased by retarded time, rolls across the bluff downwind like wind
          over a field of grain. Flutter grows in with the speed, tips drop to keep their length, and normals follow the
          bend's Jacobian. The same hook runs on each planting mesh's depth and distance materials, so shadows sway too.
          Since October 16 it replaces the old independent sine.
        files:
          - path: bin/coastal_flora.py
            role: Writes the sway weights.
          - path: assets/js/home-scene/plant-motion.mjs
            role: The species profiles and the sway hook.
          - path: assets/js/home-scene/realism.mjs
            role: Applies the hook to the planting's beauty, depth and distance materials.
        tests:
          - test/coast-wind.test.mjs
        sources: [delangre2008wind, vogel1989drag, py2006lockin]
        limits:
          - A nominal height per species sets the tip drop and the normals' slope.
          - The indirect contact buffer sees the rest pose.
        next: []
      - id: wind-particles
        name: Dust and spray in the same wind
        status: shipped
        since: "2026-10-02"
        what: 42 dust motes and 140 surf droplets advect through the shared wind field on fixed ticks; spray also falls under gravity and drag.
        how: >-
          `wind-particles.mjs` integrates dust with midpoint RK2 in both position and time, and spray ballistically with
          gravity, air drag, seeded launches and lifetimes, at fixed 1/60 s ticks, so different frame rates give the same
          history. A deterministic prewarm from negative time gives a mature still composition, including under reduced
          motion. The original 18 steam points were replaced by the thermal field.
        files:
          - path: assets/js/home-scene/wind-particles.mjs
            role: Bounded particle integration.
          - path: assets/js/home-scene/environment.mjs
            role: Emitters, bounds and drawing.
        tests:
          - test/coastal-wind.test.mjs
        sources: [bridson2007curl]
        limits:
          - Bounds respawn particles; there is no collision with the house.
        next: []

  - id: characters
    name: Characters and animation
    summary: >-
      Five cartoon versions of me live one at a time on an authored San Diego routine. Their walks, activities, eyes and bed
      are fitted to the house's actual geometry.
    techniques:
      - id: avatars
        name: Five original avatars
        status: shipped
        since: "2026-09-12"
        what: Lizard, South Park, Simpsons, Ghibli and Rick and Morty interpretations share one bone convention and fourteen authored clips; one appears at a time, new on each refresh.
        how: >-
          `bin/coastal_characters.py` builds the four human models with shaped jaws, inset eyes and side-parted hair.
          `coastal_hair.py` and `coastal_clothing.py` make continuous hair and garment surfaces. `coastal_anatomy.py`
          lengthens long bones in rest space to adult proportions while keeping hands, feet, bone names and activity
          endpoints. `coastal_hands.py` adds Ghibli's twenty finger joints and anatomical wrist targets for the pull-up and
          dip grips, and `coastal_expression.py` adds paired eyelid surfaces with `BlinkL` and `BlinkR` morphs. Likeness is
          judged in front, profile and full-body Cycles renders, then at homepage size during an activity.
        files:
          - path: bin/coastal_characters.py
            role: The four human models.
          - path: bin/coastal_anatomy.py
            role: Adult rest proportions.
          - path: bin/coastal_hair.py
            role: Continuous swept-back hair.
          - path: bin/coastal_clothing.py
            role: Continuous garments.
          - path: bin/coastal_hands.py
            role: Finger joints and grip wrist targets.
          - path: bin/coastal_expression.py
            role: Eyelids and blink morphs.
          - path: artwork/coastal-home/portraits/
            role: Front, profile and full-body review renders.
        tests:
          - test/coastal-routine.test.mjs
          - test/test_coastal_assets.py
        sources: [blender]
        limits:
          - Authored stylization, not a likeness scan; my own judgment is the acceptance test.
          - No physical hair or cloth simulation on the bodies.
        next:
          - move: Film-studio character surfacing and close-up detail, which the brief names as the higher visual target.
            readiness: needs-research
      - id: routine
        name: An authored San Diego routine
        status: shipped
        since: "2026-09-12"
        what: A pure clock maps Pacific time to an activity and a room. Breakfast comes late, coding runs into the night, and the onsen faces the Pacific.
        how: >-
          `routine.mjs` resolves `America/Los_Angeles` with daylight saving and reads weekday and weekend schedules from the
          manifest; weekends extend coding to 04:00 and sleep to 12:30, and the evening drink rotates by date. The theme
          panel's sun arc can preview an hour through `setTimePreview(minute)`, and Now clears both previews. A theme chosen
          anywhere else never sets a preview. It is a little imagined day, not a location feed.
        files:
          - path: assets/js/home-scene/routine.mjs
            role: The pure clock and exploration state.
          - path: assets/models/home/manifest.json
            role: Schedules, activities and room anchors.
          - path: assets/js/sun-arc.mjs
            role: Hour previews from the theme panel.
        tests:
          - test/coastal-routine.test.mjs
        sources: []
        limits:
          - Authored fiction, with no telemetry by design.
        next:
          - move: A sunset hour on the new terrace.
            readiness: needs-decision
      - id: activities
        name: Activities fitted to equipment
        status: shipped
        since: "2026-09-14"
        what: Coffee, typing, meals and sleep use exported equipment contacts, so a cup travels between surfaces and hands.
        how: >-
          `activities.mjs` runs short deterministic phases against equipment anchors from `bin/coastal_furnishing.py`:
          grinding, brewing, pickup, carrying, drinking and returning the same cup, and the meals at the table. A runtime arm
          correction follows the mixed pose to remove residual drift, and `grip-targets.mjs` lets an articulated avatar
          name its own anatomical wrist target per clip. `bin/review_coastal_models.py` measures deformed source vertices
          and wrists at five key times per clip. Since October 16 the gym's sessions are staged and posed separately (see
          the gym technique below).
        files:
          - path: assets/js/home-scene/activities.mjs
            role: Activity phases and contact correction.
          - path: assets/js/home-scene/grip-targets.mjs
            role: Per-avatar wrist targets.
          - path: bin/coastal_furnishing.py
            role: Kitchen equipment and its contacts.
          - path: bin/review_coastal_models.py
            role: Contact measurements on the deformed sources.
        tests:
          - test/coastal-camera.test.mjs
          - test/coastal-grip-targets.test.mjs
        sources: []
        limits:
          - Authored poses with a small contact correction, not whole-body dynamics.
        next: []
      - id: gym-training
        name: Training on Sirui's program, with lifts posed on each figure
        status: shipped
        since: "2026-10-16"
        what: The gym follows Sirui's nSuns program, and every lift is posed each frame on the avatar's own skeleton, so the hands meet the real bar, handles and dumbbells whatever the body's proportions.
        how: >-
          `training.mjs` turns a date into the day's session as pure functions (`trainingAt`, `sessionPlan`,
          `sessionTimeline`): nSuns 5/3/1 LP on a six-day upper and lower split at the logged training maxes, with
          supersets and rests, from 18:00 on workdays and 14:00 on Saturdays. `gym-session.mjs` stages each set as data
          (`sessionPose`): where the body stands and faces, which bar is in the hands, and walks routed around the rack,
          the bench and the platform on a small visibility graph (`planRoute`). `lift-rig.mjs` poses the hips, spine and
          head, reaches each hand and foot with an analytic two-bone solve toward a movement's pole hint, measures each
          figure's head from its skinned vertices so a bar passes under or behind it, and eases every repetition in and
          out. `gym-props.mjs` loads each bar from the gym's two plate sets and draws the program and Sirui's training-max
          history, copied from his app, on the whiteboard.
        files:
          - path: assets/js/home-scene/training.mjs
            role: The program, as pure functions of the date.
          - path: assets/js/home-scene/gym-session.mjs
            role: Staged choreography and routing around the equipment.
          - path: assets/js/home-scene/lift-rig.mjs
            role: Per-frame lifts on each avatar's own skeleton.
          - path: assets/js/home-scene/gym-props.mjs
            role: Bars, plates, dumbbells, the backrest and the whiteboard.
          - path: bin/coastal_gym.py
            role: The gym room and its equipment.
          - path: bin/refresh_coastal_gym.py
            role: Rebuilds the gym in the retained house.
        tests:
          - test/coastal-training.test.mjs
          - test/coastal-gym-session.test.mjs
          - test/coastal-lift-rig.test.mjs
        sources: [tolani2000ik, thomas1981illusion, lozanoperez1979visibility]
        limits:
          - Kinematic poses, not dynamics. The body neither strains nor balances under the load.
          - The program follows Sirui's logged plan; the scene does not read a live training log.
        next: []
      - id: locomotion
        name: Walking on the real floor and treads
        status: shipped
        since: "2026-09-13"
        what: Walks follow authored corridors and every stair tread, and a short two-bone solve keeps each foot on its support.
        how: >-
          `navigation.mjs` routes between any two rooms along straight segments that stay inside the corridor, through the
          15-riser stair and its landing; a spline could cut through furniture or overshoot the first riser.
          `locomotion.mjs` constrains the mixer's gait to the exported floor polygons and treads, so a climbing foot never
          passes through a riser or hovers above it.
        files:
          - path: assets/js/home-scene/navigation.mjs
            role: Authored circulation over floors and treads.
          - path: assets/js/home-scene/locomotion.mjs
            role: Two-bone foot fitting.
          - path: bin/coastal_section.py
            role: Exports the floors, treads and corridors.
        tests:
          - test/coastal-navigation.test.mjs
        sources: []
        limits:
          - Authored paths, not a general collision or crowd solver.
        next: []
      - id: character-performance
        name: Eyes, blinks and attention
        status: shipped
        since: "2026-10-02"
        what: An additive layer adds asymmetric blinks, quiet breathing and a short eyes-first glance at the visitor's pointer, then returns to the routine.
        how: >-
          `character-performance.mjs` turns the pointer into a ray through the real camera, aims at a point halfway between
          the eyes and the visitor in the head's own optical frame, and lets the eyes lead the head with a short hold and
          habituation, after the eye and head bandwidths in Pan and colleagues' robot gaze work. Contact-sensitive clips
          (strength, walking, coffee, carrying) cancel head motion; eating and drinking allow the eyes only. Sleep closes the
          lids, and pause, reduced motion and hidden views compose neutral lids. Breathing moves the head joint at most
          0.65 mm, and no spine, wrist, finger, foot or root transform changes.
        files:
          - path: assets/js/home-scene/character-performance.mjs
            role: Blinks, breathing and attention.
          - path: artwork/coastal-home/CHARACTER_PERFORMANCE.md
            role: Eyelid authoring and retention checks.
          - path: docs/evidence/character-performance-2026-10-02/README.md
            role: Acceptance evidence.
        tests:
          - test/character-performance.test.mjs
        sources: [pan2020gaze]
        limits:
          - Pointer proximity stands in for a visitor; there is no camera perception or face detection.
          - There is no continuous eyelid and glasses collision proof.
        next: []
      - id: fitted-bedding
        name: Bedding fitted to each sleeper
        status: shipped
        since: "2026-10-14"
        what: Six bed variants, a made bed and one fitted pillow and duvet per avatar, replace a rigid pillow that heads sank into and a cover that cut through chests.
        how: >-
          `bin/refresh_coastal_bedding.py` dents each down pillow under its avatar's head with vertical ray casts against the
          sleep clip at its deepest and shallowest breath. `coastal_bedding.py` drops each duvet over its sleeper with an
