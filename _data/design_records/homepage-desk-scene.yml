  - id: wildlife
    name: Wildlife
    summary: >-
      Brush rabbits, California sea lions, harbor seals, a raccoon, western gulls, sandpipers, brown pelicans and Brandt's
      cormorants share the coast, 28 animals in all. Each species is one skinned mesh; its acting is authored and sampled
      from time, and its feet meet the same terrain, rock and sea the house and renderer use.
    techniques:
      - id: animal-masters
        name: Original animal masters
        status: shipped
        since: "2026-09-14"
        what: Every animal is an original Blender model with a continuous body and vertex-color coat marks, rigged since October 18 as one skinned mesh per species.
        how: >-
          `bin/build_coastal_wildlife.py` builds the rabbit, sea lion and seal masters, and `bin/build_coastal_neighbors.py`
          builds the raccoon, gull and sandpiper with canonical head, eye, muzzle, limb and wing parts, which the rig below
          turns into bones. Marine flipper roots overlap the torso through sampled acting extremes. Habitat choices follow the
          City of San Diego's Children's Pool information: sea lions on rock haul-outs, harbor seals on sheltered sand.
        files:
          - path: bin/build_coastal_wildlife.py
            role: Rabbit, sea lion and seal masters.
          - path: bin/build_coastal_neighbors.py
            role: Raccoon, gull and sandpiper masters.
          - path: artwork/coastal-home/NEIGHBORS.md
            role: Neighbour assets, pivots and rebuild commands.
          - path: assets/js/home-scene/wildlife.mjs
            role: Instances, habitats and inspection.
        tests:
          - test/wildlife-assets.test.mjs
        sources: [sandiego-childrens-pool]
        limits:
          - Authored acting, not measured biomechanics or a trained animal model.
        next: []
      - id: animal-acting
        name: Acting sampled from active time
        status: shipped
        since: "2026-10-02"
        what: Rabbits hop with held contacts, the raccoon plants its paws, sandpipers probe the wet edge, and gulls glide between perches.
        how: >-
          `wildlife-motion.mjs` holds rabbit travel at takeoff and landing and advances only while airborne, with quintic
          travel so velocity and acceleration never jump. `wildlife-neighbor-motion.mjs` keeps the raccoon's stance paws on
          world anchors while two-joint legs follow, pivots sandpipers gradually at each zero-speed reversal, and joins gull
          flight and perch with C2-continuous transfers and headings from the flight derivative. Nothing integrates frame by
          frame, so a pause or a slow renderer cannot accumulate drift. The rabbit loops follow clear scrub edges sampled
          against the finished ground (`rabbit_habitats.py`).
        files:
          - path: assets/js/home-scene/wildlife-motion.mjs
            role: Rabbit and marine acting.
          - path: assets/js/home-scene/wildlife-neighbor-motion.mjs
            role: Raccoon, sandpiper and gull acting.
          - path: bin/rabbit_habitats.py
            role: Clifftop rabbit loops.
        tests:
          - test/wildlife-motion.test.mjs
          - test/wildlife-neighbors.test.mjs
        sources: []
        limits:
          - Deterministic choreography, with no aerodynamics, general collision solver or feather simulation.
        next: []
      - id: perch-contact
        name: Gull feet fitted to real perches
        status: shipped
        since: "2026-10-02"
        what: Gull soles fit bounded patches of the retained coast and the gallery rail, and cormorants stand on rock roosts at the cliff foot, with fixed tarsus lengths and hidden hip accommodation.
        how: >-
          `bin/build_coastal_perch_support.py` exports bounded support patches matching the retained GLB tessellation: three
          clifftop perches and the gallery rail for the gulls (21 and 16 triangles) and four rock roosts for the cormorants (68
          triangles), with 194 projected sole samples per foot of the skinned gull, found by its vertex groups.
          `wildlife-perch-contact.mjs` fits each webbed foot to that surface through flare and toe-off with a one-sided
          clearance, keeps the 114 mm tarsus and accommodates the rest in the hidden hips. Plants are excluded from perch
          support, because gulls had sampled grass blades as footing.
