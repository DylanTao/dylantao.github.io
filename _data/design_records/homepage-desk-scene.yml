  - date: "2026-10-18"
    title: Measure the frame, then cut what it actually spends
    system: rendering-light
    frame: Sirui asked for further optimization of the site and the 3D scene, and for the state of the art to be written down for later models.
    dimensions:
      [
        per-pass draw attribution,
        script time against GPU time,
        uniform uploads,
        program switches,
        the shadow map,
        decoding,
        the full-screen buffer,
        pixel parity,
      ]
    move: >-
      Vector-array uniforms stored flat, opaque draws grouped by program, a cached static sun shadow, one shared Draco
      pool and a pixel budget for full screen. Outside, script time per frame fell from 89.8 to 56.9 ms and draws from
      1,554 to 1,292 in three interleaved pairs. The graphics record's performance system holds each change, its
      measurements, what was rejected, the WebGPU decision and the next techniques in priority order.
    backtalk: >-
      The outside view ran at about 10 fps. Per-pass attribution found four separate costs (three's transmission copy,
      the sea mirror, the shadow map and per-draw uniform uploads), and a CPU profile found the largest single cost in
      three's uniform code rather than in draw count. The first transmission check reported zero changed pixels, because
      hiding objects under reduced motion without requesting a frame re-captured the old frame; a sweep then showed the
      water from 21 of 108 cameras, and the gate built for it never engaged. A parity run differed by 2,334 px of
      wildlife, and holding the decoder change back showed the same race in the unchanged base.
    reframe: Per-draw uniform cost and the sea mirror remain; material sharing, a lighter mirror and a cheaper distant water are next, and the last two need Sirui.
    commit: "c861eed23"
    sources: [myers2021coldwar, binks2011dynres]
  - date: "2026-10-18"
    title: Linen on rings, and laundry in the breeze
    system: wind-plants
    frame: Sirui found the curtains "a bit weird" and asked for more cloth simulation, with three linen towels pegged on a sunny Mediterranean terrace as the reference.
    dimensions:
      [
        heading and hardware,
        fold shape from the rod to the hem,
        stack width and flare,
        translucency and grain,
        motion in gusts and lulls,
        timing against the doors,
        cost per frame,
        a place for cloth to shine,
      ]
    move: >-
      A new small-step XPBD cloth (`cloth-solver.mjs`) with isometric bending, long-range attachments, fold ordering and
      welded patterns. The panels now hang from six rings on bronze rods with a pinch-pleated heading, true fabric rest
      lengths below it, a weighted hem, blended linen translucency and a refined drawn mesh. Three towels and a shirt hang
      pegged on a line on the terrace in the same wind.
    backtalk: >-
      The October 16 panels repeated the heading's corrugation at every row, so a gathered stack was a white pole that
      twisted like a ribbon in the doorway jet, drawn panels read as a vertical blind, and alpha-to-coverage left a
      screen-door grain. A 10 cm bending length fanned a stack's hem 1.6 m wide; a free heading tape could not carry the
      columns once a stack folded it into a U; and a gathered bay of four cells drew as a brick pattern of facets until
      each row was drawn through a spline. The first laundry exploded: a light 50-node rope could not carry 0.4 kg with
      one pass per substep until each node was tethered to both posts, and a peg station half a column off a rounded peg
      column stretched a towel 34 %. Towels pegged flat hung like boards until they were pegged with slack. Drawn row by
      row, the blended stack showed a light line at every row, where the drawing order between its layers flipped; drawn
      column by column it holds. Seven rings, 25 rows and eight substeps cost 3 to 5 ms a frame in a room view, and fixed
      spheres around tall panels kept cloth stepping behind the camera; six rings, 21 rows, six substeps and box tests
      against the view brought the frame back within noise of the October 16 panels, with 3.4 ms of cloth a frame in the
      kitchen view.
    reframe: The heading tape and the stack's contacts are where real self-collision would pay off next, and Sirui could hang the laundry himself in the routine.
    commit: "6c796c017"
    sources: [bergou2006bending, macklin2019smallsteps, kim2012lra, catmull1974splines]
  - date: "2026-10-18"
    title: Water with depth, caustics and lamplight
    system: water-atmosphere
    frame: >-
      Sirui showed two three.js scenes he liked: a teal harbour that mirrors its lamps in long streaks through mist, and
      a Mediterranean cove whose turquoise shallows show the seabed with moving caustics. The Pacific was a painted teal
      with a wet-sand tint near the beach, and the onsen read as a white basin.
    dimensions:
      [optical depth over the seabed, caustics, the low sun, reflections at night, the waterline, the bath's light, GPU cost per frame, compile time]
    move: >-
      Read a seabed from the coast's own geometry and extended it offshore; coloured the sea with Lee and colleagues'
      shallow-water reflectance over it, with paraxial caustics from the wind ripples; stretched the mirror into vertical
      bands, broke the sun's path into glints in the hue of the day's real low sun and drew the terrace lamps' streaks;
      moved the swash to the captured waterline; and gave the onsen caustics from its own simulated surface, with sub-grid
      ripples that ride on the hand's waves.
    backtalk: >-
      The beach slopes only 0.75 m under the sea, so the near water is a shallow sandy shelf and the seabed past it had to
      be extended. A cliff's shadow on that shelf first looked like a navy stain until a debug view showed it was real, and
      a band of water at the waterline was shaded by the sand under it, so beach sand stopped casting sun shadows. The
      hand's own waves focused light by a tenth of a percent in 13 cm of water, which is why the sub-grid ripples exist.
      The first version cost 4 to 7 ms of GPU per frame outside and dropped the 160 m view from 30 to 20 fps; four-tap
      shadow compares, skipping unresolvable ripples and footprint-gated seabed detail brought the GPU back to the base's
      range. The optics then more than doubled the sea program's cold compile on ANGLE's Direct3D compiler, which unrolls
      constant loops and inlines every call; uniform-bound loops over flat arrays, explicit texture levels and a short
      integer hash brought it to 2.7 s against 2.1 s without the optics, and startup did not grow. Mean-preserving glints
      alone thinned the sunset path to scattered dots, because tone mapping compresses a rare bright flash far more than a
      steady path of the same mean, so half the lobe now stays a steady glow. A glint patch with no facets divided zero by
      zero, and the NaN bloomed into a white haze over the whole frame until the division was guarded.
    reframe: The depth under every point is now known, so the swell itself can start to feel the seabed.
    commit: "9c4e4007b"
    sources: [pope1997water, lee1998shallow, lee1999shallow, watt1990beam, kasten1989airmass, hansen1974rayleigh]
  - date: "2026-10-19"
    title: A sunset by scattering
    system: rendering-light
    frame: >-
      Sirui asked for a better-designed sunset and reflections, softer haze at the scene's edges, and fog and light
      simulation: "just make sure things look great on first principle, don't get limited by old rules."
    dimensions:
      [
        the sky model,
        the sun's colour by altitude,
        the eye's adaptation,
        the haze's colour,
        the world's edge,
        fog density and depth,
        the march's budget,
        cold shader compile,
      ]
    move: >-
      Hillaire's three tables on the GPU with a JavaScript twin for the light colours and the tests; the sun's disc set by
      NOAA's minute and squashed by refraction; the moon and stars placed by Meeus and the Almanac; a post-pass haze from
      the depth buffer that converges to the horizon's colour and dissolves the world's edge into the dome; and a
      half-resolution, shadow-mapped march for fog, shafts and indoor sunbeams. The scene's key light, fill and
      reflections follow the sky, and the sea reads its sun.
    backtalk: >-
      An explicitly lit haze (the sun times a phase function plus the mean sky) drew a dark band above a sunset horizon
      until it took the horizon's own colour. The aerosol optical depth of 0.1 first chosen washed the golden hour out and
      the bloom spread a capped disc over the frame; 0.045 and a 20-unit cap on the disc brought the gold back. Partial
      white balance turned the dawn sky green. The first twilight lift brightened the sky after sunset until it was
      derived from the model's own zenith. The fog never showed: a reversed smoothstep is undefined in GLSL and ANGLE's
      Direct3D path returned 0, and a bank 11 m deep at 300 m visibility is nearly transparent from above. The probe
      field's single horizon colour turned the shaded west-facing cliff red at sunrise until its bands were weighted
      toward the west.
    reframe: Clouds lit through Earth's shadow are the next step for the sunset.
    commit: "1104eb491"
    sources: [hillaire2020sky, bruneton2008atmosphere, noaa-solar, meeus1998algorithms, cox1954glitter, wronski2014fog, hillaire2015frostbite]
  - date: "2026-10-23"
    title: Lower the seats and connect the entrance
    system: authoring
    frame: The kitchen needed an open plan, a breakfast nook and a table for six; the living room needed a sunken pit, and the clifftop doorway needed an actual route into the house.
    dimensions: [floor supports, seated contacts, open circulation, the roof cut, an inland approach, task lighting, the terrace waterline]
    move: >-
      Cut both lower rooms 42 cm into the retained slab and mainland, kept their seated feet supported and separated
      the breakfast banquette from the dining table. Added the living-room flue and rock cap, a carved 32-riser arrival
      with a foyer, a supported pan station with front task lighting, and the terrace infinity basin. Native measurements
      and browser capture paths are retained in `artwork/coastal-home/reviews/interior-acceptance.json` and
      `interior-contacts.json`; the navigation tests cover all 36 room pairs.
    backtalk: >-
      A good free-camera nook view failed under the production spring arm because its target sat inside the table.
      The target moved above the furniture. The old closed doorway had no passage and was removed. The first Walk
      field stopped short of the inland stair until its bounds included the entrance. Room travel also treated the
      lower corridor's zero height as the sunken seat's walking floor, so its endpoints now read the actual supports
      and keep the two 21 cm local risers separate from the 15-riser main stair.
    reframe: Keep the native geometry, floor supports, pose offsets and corridor levels together, then verify the production camera and walking field rather than accepting a free-camera preview alone.
    sources: [blender]
  - date: "2026-10-25"
    title: A drawing that fills in as the house arrives
    system: loading
    frame: >-
      As the scene's details were being finalized, Sirui asked that "the complicated, and intricity of the line rawing laod
      screening can also start to be more detailed and polished to reveal a progressing in laoding finsihing."
    dimensions:
      [
        what the lines are,
        the order the pen draws them,
        how ink tracks finished work,
        what a stall looks like,
        the hand-off to the first frame,
        phone legibility,
        bytes,
      ]
    move: >-
      Continuous pen lines traced from the views' object-ID, normal and depth passes, with Zhang and Suen's thinning and
      Douglas and Peucker's simplification, replace the morphing dashes: about 13,000 strokes over the coast view and the
      six rooms an activity opens in. The pen draws the shell and its arched facade as the house streams in, the cliff and
      beach with the coast, then dives into the arrival room and draws its structure and furniture as the rooms arrive and
      its books, screens and textiles while the view's programs compile. Its ink never exceeds the finished work, a stall
      only rests and breathes, and the room drawing shares the first frame's camera, so the render arrives beneath its own
      lines.
    backtalk: >-
      Rooms are merged by material, so their walls first arrived as furniture until the largest surfaces of each view
      counted as structure. The coast view first spent half its ink on the cliff, though the shell streams first; a plan
      that gates each group of layers by the loading segment that brings it put the house first. A fixed pen speed would
      have needed about five seconds to catch up with a cached load, so the pen scales with each drawing. On a cold load
      here the bar held 80% for up to 45 seconds while the light and the programs warmed; the honest drawing rests through
      it rather than inventing ink. Tracing the first frame's edges was dropped: the room drawing already matches the
      render, and reading back the WebGL frame is main-thread work the hand-off no longer needs.
    reframe: The light stage reports no fraction, so the pen rests through it; a measured light or reflection progress would let the drawing keep moving there.
    sources: [saito1990comprehensible, harrison2007progress]
