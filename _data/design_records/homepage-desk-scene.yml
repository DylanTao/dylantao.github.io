      - id: skinned-animal-rigs
        name: One skinned mesh per species
        status: shipped
        since: "2026-10-18"
        what: Each of the eight species is one skinned mesh with its own rig, so backs bend, jaws open and tails, ears, flippers and wingtips follow through.
        how: >-
          `bin/coastal_wildlife_rig.py` bakes a master's part colours into a byte vertex-colour layer and binds one
          two-material mesh (a matte coat and a gloss) to bones that point along +Z with zero roll, so every joint rests at
          identity. The sea lion and seal have a hinged jaw, the gull a lower mandible, the raccoon a three-bone tail, and the
          rabbit and raccoon separate chest and hip bones. Each clone's two primitives share one skeleton and bone texture.
          The eight masters weigh 279,544 bytes against 361,576 for the former six, and 28 animals draw 56 primitives where
          17 drew 256; outside, scene draw calls fell from about 1,804 to 1,061 in an interleaved comparison.
        files:
          - path: bin/coastal_wildlife_rig.py
            role: Skinning, colour bake and export shared by the three builders.
            functions: [skin, export]
          - path: bin/build_coastal_wildlife.py
