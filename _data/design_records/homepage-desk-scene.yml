        how: >-
          `bin/coastal_flora.py` builds code-authored plants (leaf sprays on woody stems, needle tufts on leaning trunks,
          grass tufts, succulent mats) and keeps them off the doorway, the stepping stones, the rabbit paths, the perches and
          the 28 agaves. The second planting draws from its own random stream, so every plant from October 14 stays where it
          was. Species and October colors follow photographs of Torrey Pines, Goldfish Point and the Coast Walk, credited in
