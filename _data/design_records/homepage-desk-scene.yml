      - id: ridge-gliders
        name: Gliders soaring the bluffs
        status: shipped
        since: "2026-10-15"
        what: Three paragliders and a hang glider follow closed loops along the north bluffs, banking into their turns.
        how: >-
          `gliders.mjs` tabulates each closed loop as a centripetal Catmull–Rom curve by arc length and banks each wing by
          tan(bank) = v²κ/g, a coordinated turn. Poses are pure functions of the scene clock, so pause, hidden tabs and
          reduced motion hold every glider where it is.
        files:
          - path: assets/js/home-scene/gliders.mjs
            role: Routes, poses and banking.
