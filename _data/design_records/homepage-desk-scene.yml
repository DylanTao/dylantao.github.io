            role: The position-based drape.
          - path: bin/refresh_coastal_bedding.py
            role: Builds the six variants in the retained house.
          - path: bin/review_coastal_models.py
            role: Asserts the body, cover and pillow measurements.
          - path: assets/js/home-scene/bedding-breath.mjs
            role: The sleeper's cover rises and falls with the breath.
        tests:
          - test/bedding-breath.test.mjs
        sources: [muller2007pbd, fratarcangeli2016vivace]
        limits:
          - Authored drapes, not runtime cloth. Since October 17 the sleeper's cover breathes, a scripted swell of a few millimetres at the chest (`bedding-breath.mjs`, tested in `test/bedding-breath.test.mjs`).
