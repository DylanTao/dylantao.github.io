constraints:
  - The homepage opens in 2D on every screen. 3D loads only after a visitor chooses it, a deliberate choice holds for the session, and any WebGL or model failure returns the 2D desk.
  - Keep the five adult male Sirui likenesses (long black hair, round glasses, clean-shaven), one at a time and new on each refresh.
  - The routine runs on `America/Los_Angeles`. Previewing an hour never lets a later clock tick seize the camera, and Now clears both previews.
  - One connected house, cliff and Pacific. No pedestal, detached arch, image backdrop or scenic photograph; the cutaway lifts only the local ceiling.
  - The selected record, its spin, the discovered cards and the avatar survive every mode switch.
  - Reduced motion and Pause motion compose still poses. Hidden or offscreen views stop their loops and add no catch-up time when they return.
  - Every new material, pass or override draw joins `program-warmup.mjs`, or its first draw blocks the page again.
  - Render-cost changes must change 0 pixels in seeded, paused-clock captures. Look changes need a matched A/B.
  - Compare performance variants interleaved, never batch against batch.
  - Store any array-of-vectors uniform as a flat `Float32Array`; three r164 re-flattens arrays of vectors on every material switch.
  - A shadow caster animated only in its vertex shader carries its own depth material, or the shadow cache keeps its shadow in place.
  - Keep the renderer's pixel ratio fixed after creation and change the drawing buffer through `resolution.mjs`, which moves the renderer and the composer together.
  - A new camera angle on the kitchen or lounge looks through a door opening, not a mullion.
  - Rerun `bin/build_loading_sketch.cjs` after a room's geometry or camera changes, and the bedding refit after an avatar's body or sleep clip changes.
  - Keep the Draco decoder marked binary in `.gitattributes`.

tests:
  - path: test/visual/desk-scene.spec.js
    covers: Nonblank WebGL, visible orbit and zoom changes, room continuity, records, recovery, reduced motion and the four viewports.
    command: npm.cmd run test:visual:scene
  - path: test/visual/scene-groups.json
    covers: The scene cases grouped for one-worker runs (scene-core-1, scene-exploration, scene-footer-light and others).
    command: node bin/run_visual_scene_group.cjs scene-core-1 --project desktop-1440
  - path: test/coastal-routine.test.mjs
    covers: Schedule boundaries, weekends, daylight saving, previews and Now.
    command: node --test test/coastal-routine.test.mjs
  - path: test/test_coastal_assets.py
    covers: Exports and editable sources, room anchors, activity clips, the first scene's compressed budget and the local Draco decoder.
    command: python -m unittest test.test_coastal_assets
  - path: test/test_scene_program_warmup.py
    covers: The shader warmup, its batches and core throttle, and the loading bar's sources of progress.
    command: python -m unittest test.test_scene_program_warmup
  - path: test/coastal-fullscreen.test.mjs
    covers: Full screen's three modes, every way out, the history entry, focus and the F shortcut.
    command: node --test test/coastal-fullscreen.test.mjs
  - path: test/coastal-shadow-cache.test.mjs
    covers: Which casters the shadow cache keeps, what redraws it, and the cases that keep three's own shadow path.
    command: node --test test/coastal-shadow-cache.test.mjs

systems:
  - id: shared-desk
    name: Two views, one desk
    summary: >-
      The 2D collage and the 3D home share one record player, one discovery pile and one chosen avatar. The 3D home is an
      optional layer on top of a page that works without it.
    techniques:
      - id: shared-state
        name: One state across 2D and 3D
        status: shipped
        since: "2026-06-17"
        what: The 2D | 3D switch changes the view, not the state, so the selected record, its spin, the discovered cards and the avatar carry across.
        how: >-
          `assets/js/home.js` owns the 2D desk and the shared record state. Choosing 3D lazy-loads `home-scene/controller.mjs`
          through a small adapter, so the default page never downloads Three.js or the house. The choice is kept in
          `sessionStorage` for the session. If WebGL or a model fails, the controller dispatches `home-scene-unavailable` and
          the page returns to the 2D desk with its state intact. A cached back/forward return pauses and restores the
          controllers instead of rebuilding them.
        files:
          - path: assets/js/home.js
            role: The 2D desk, the shared record state and the lazy 3D adapter.
          - path: assets/js/home-scene/controller.mjs
            role: The 3D runtime. Loading, mixer, camera, interactions, lifecycle and the album adapter.
          - path: _includes/home/world_controls.liquid
            role: Scene controls, status line and loading bar.
          - path: _sass/_coastal-home.scss
            role: Scene composition, the feathered edge and responsive layout.
        tests:
          - test/visual/desk-scene.spec.js
          - test/record-keyboard.test.mjs
        sources: []
        limits:
          - "`controller.mjs` is one module of about 110 KB, so most scene work lands in the same file and parallel edits collide."
          - Room, avatar, activity and time controls exist only behind `?scene-lab=1`; ordinary visitors get the 2D album, the 2D | 3D switch and Look around.
        next: []
      - id: record-mechanics
        name: A driven record player
        status: shipped
        since: "2026-10-01"
        what: The platter is a driven rotor and the tonearm two critically damped coordinates, shared by the 2D player, its CSS fallback and the 3D study platter.
        how: >-
          `record-motion.mjs` targets 33⅓ RPM with a first-order motor, ω(t+dt) = ω_target + (ω − ω_target)·e^(−dt/τ), and
          integrates the angle exactly, so the result does not depend on frame rate. The motor responds in 0.72 s and brakes
          in 0.30 s. Each tonearm coordinate follows a critically damped equation with an exact update; the arm must lift
          clear of the disc before it swings, and a one-sided contact keeps the stylus above the record. All time is active
          time, so hiding the player adds no impulse. The inertia, 0.0036 kg·m², is illustrative rather than measured.
        files:
          - path: assets/js/home-scene/record-motion.mjs
            role: Rotor and tonearm mechanics.
          - path: assets/js/home-scene/PHYSICS.md
            role: Equations and evidence.
        tests:
          - test/coastal-physics.test.mjs
          - test/coast-wave-motion.test.mjs
        sources: []
        limits:
          - A controlled motor model, with no measured drive torque, bearing friction, wow and flutter, or stylus dynamics.
          - The record is a visual spinner. Nothing plays audio, by design.
        next: []
      - id: active-time
        name: One active clock
        status: shipped
        since: "2026-09-14"
        what: Walks, clips, water, steam, particles and wildlife all advance on active elapsed time, never on the frame count.
        how: >-
          The controller's clock stops while the scene is paused, hidden, offscreen or under reduced motion, and its timestamp
          resets on recovery. Solvers take fixed ticks and accept at most 0.25 s per call; anything beyond that is reported as
          dropped time rather than replayed, so a stalled tab never returns with a catch-up queue. Route and clip timing
          follow active time, so a software renderer with seconds between frames does not stretch a walk. Animal acting and
          the record are sampled from absolute active time, so they cannot drift.
        files:
          - path: assets/js/home-scene/controller.mjs
            role: The active clock, suspension and recovery.
          - path: assets/js/home-scene/wind-particles.mjs
            role: Fixed ticks with a bounded stall budget.
          - path: assets/js/home-scene/onsen-water.mjs
            role: The pool's bounded time partition.
        tests:
          - test/coastal-physics.test.mjs
          - test/coastal-wind.test.mjs
          - test/onsen-water.test.mjs
        sources: []
        limits:
          - A long stall is deliberately not reproduced, so a particle or a wave after a stall is not the uninterrupted trajectory.
        next: []

  - id: loading
    name: Loading and the first frame
    summary: >-
      What happens between choosing 3D and the first composed view. Models stream in a fixed order, shader programs compile
      without freezing the page, a loading bar reports only finished work, and a pen sketch fills the wait.
    techniques:
      - id: streaming-order
        name: Streaming order and Draco decoding
        status: shipped
        since: "2026-09-12"
        what: The shell, the coast, the occupied room and the selected avatar load first; the other rooms and the clifftop planting stream afterwards.
        how: >-
          Startup never draws a partial house while the occupied room or the avatar is still loading. The models are
          Draco-compressed GLBs exported from the Blender sources. `model-loader.mjs` decodes them through a pinned decoder
          served as ordinary same-origin files, because the loader's default inline blob worker conflicts with the site's
          Content-Security-Policy. Since October 18 every loader on the page (the home, its wildlife, the footer coast) shares
          one pool of up to four decoder workers, which decodes a model's primitives in parallel: the house shell in 118 ms
          instead of 323 when measured in isolation. Streamed rooms join the house only once their shader programs are ready,
          and the clifftop planting (`flora.glb`, 2.2 MB) loads the first time a visitor goes outside.
        files:
          - path: assets/js/home-scene/model-loader.mjs
            role: Same-origin Draco decoding through one shared worker pool.
            functions: [createModelLoader]
          - path: assets/js/home-scene/controller.mjs
            role: Load order and room streaming.
          - path: bin/prepare_draco_worker.py
            role: Extracts the static worker from the pinned loader.
          - path: assets/js/vendor/three-r164/README.md
            role: Vendored loader sources and their hashes.
          - path: assets/models/home/manifest.json
            role: Asset paths, room anchors and camera views.
        tests:
          - test/test_coastal_assets.py
        sources: [threejs-r164, draco]
        limits:
          - The shell (`home-shell.glb`, about 0.6 MB since the renovation's shared normals) and the selected avatar (0.5 to 0.85 MB) still gate the first view.
          - In full cold starts the shared pool's gain disappears in the noise; compiling about 70 shader programs dominated the 12 to 19 s to the first composed frame on October 18, with other agents loading the test laptop.
        next: []
      - id: program-warmup
        name: Shader programs compiled before the first draw
        status: shipped
        since: "2026-10-12"
        what: Every program the first view needs is created ahead of the draw and compiled on the driver's worker threads, in small batches, so the page keeps scrolling while the house compiles.
        how: >-
          Three.js compiles a program the first time it draws a material, and the draw blocks until the driver finishes. On
          ANGLE/D3D11 each of this scene's programs took 0.1 to 1.8 s, and the first view froze the page for about 13 s.
          `program-warmup.mjs` reproduces each draw's compile state exactly (target, lights, fog, object, shadow side), so the
          proxy it compiles is the program the real draw later finds. With `KHR_parallel_shader_compile` it asks whether a
          program is done instead of waiting. It creates programs in batches of six materials with a task boundary between
          them, and submits the next batch only while no more than half the logical cores' worth of programs are compiling.
          Polling uses the browser scheduler because test clocks freeze timers. Software rasterizers skip the warmup.
        files:
          - path: assets/js/home-scene/program-warmup.mjs
            role: Batched, throttled program creation and completion polling.
          - path: assets/js/home-scene/environment.mjs
            role: One environment generator for the home's lifetime, with its programs created before the first capture.
          - path: assets/js/home-scene/realism.mjs
            role: The finish passes register their extra programs with the warmup.
          - path: bin/profile_coastal_startup.cjs
            role: Cold-context startup profiler; set `COASTAL_PROFILE_SEED` for comparable A/B captures.
          - path: docs/evidence/coastal-startup-2026-10-12/README.md
            role: The October 12 startup checkpoint.
        tests:
          - test/test_scene_program_warmup.py
        sources: [khr-parallel-shader-compile, gregg2020systems]
        limits:
          - A material, pass or override draw that skips the warmup blocks the page on its first draw.
          - Throttling trades readiness for responsiveness. Half the cores moved median readiness from 4.66 to 5.17 s; a quarter removed almost every long task but cost 1.3 s.
        next:
          - move: Pick the compile throttle per device class (core count, software renderer) from interleaved measurements of readiness and the longest task.
            readiness: needs-measurement
      - id: loading-bar
        name: A loading bar that reports finished work
        status: shipped
        since: "2026-10-13"
        what: A five-segment progress bar fills only from real events, so it can never run ahead of the work or move backward.
        how: >-
          `world_controls.liquid` renders a `role="progressbar"` with five segments: the house, the coast, the room, Sirui,
          and the view's programs. `controller.mjs` fills the first four from each model's streamed bytes and parse, and the
          last from submitted warmup batches and the programs the driver reports finished. The bar hides once the first view
          is drawn. Harrison and colleagues found that the same wait feels shorter when a bar keeps moving toward the end;
          the honest way to earn that is to turn slow, invisible work into visible steps.
        files:
          - path: _includes/home/world_controls.liquid
            role: The progress bar markup.
          - path: assets/js/home-scene/controller.mjs
            role: Segment progress from load and compile events.
        tests:
          - test/test_scene_program_warmup.py
          - test/visual/desk-scene.spec.js
        sources: [harrison2007progress]
        limits:
          - GitHub Pages serves the models gzipped, so `Content-Length` is the compressed size and a model's segment holds just short of full until its last byte arrives.
        next: []
      - id: loading-sketch
        name: A pen sketch while the house loads
        status: shipped
        since: "2026-10-14"
        what: A pen draws the coast and the arched house as the shell and the coast stream in, then dives into the room the visitor will arrive in and draws it structure first and books last, never ahead of the finished work, until the first frame takes over beneath it.
        how: >-
          `bin/build_loading_sketch.cjs` renders object-ID, surface-normal and depth passes of the coast view and of every
          room an activity opens in, marks one-pixel outlines, depth silhouettes and creases sharper than 40°, and links them
          into about 13,000 simplified polylines in a planned order: the shell, then the coast, then interior glimpses; in a
          room, its structure and furniture, then the fine detail. Each group is drawn only as far as the loading segment
          that brings it has finished (house, coast, rooms, the view's programs), and only once every earlier group is
          complete. `loading-sketch.mjs` hands an OffscreenCanvas to a worker that fetches, decodes and draws, so model
          parsing never stalls the pen. While work stalls, the pen rests and the drawing breathes; it never adds ink. CSS
          transitions hand over to the render within 1.4 s, so a paused page clock cannot hold the scene. Reduced motion
          shows each stage's drawing still, and automation sees the plain loading state unless the URL carries
          `?cinematic=live`.
        files:
          - path: assets/js/home-scene/loading-sketch.mjs
            role: Page side, worker hand-off, stage and progress messages and the hand-over.
          - path: assets/js/home-scene/loading-sketch-core.mjs
            role: Decoding, plan gating, the pen and breathing.
          - path: assets/js/home-scene/loading-sketch-worker.mjs
            role: Fetches, decodes and draws off the main thread.
          - path: bin/build_loading_sketch.cjs
            role: Traces and orders the drawings from the views.
          - path: assets/models/home/loading-sketch.json
            role: The packed drawings and their plans.
        tests:
          - test/loading-sketch.test.mjs
          - test/visual/desk-scene.spec.js
        sources: [saito1990comprehensible]
        limits:
          - The drawings are fixed captures of the authored views and go stale when a room or camera changes.
          - Characters, P and the animals are left out of the traced drawings; the live first frame supplies whoever is home.
        next:
          - move: Rerun `node bin/build_loading_sketch.cjs` after any room or camera change and check the hand-over on desktop and phone.
            readiness: ready

  # Visitor navigation is being extended; add new navigation techniques to this system.
  - id: camera-navigation
    name: Camera and navigation
    summary: >-
      How visitors move the viewpoint. One envelope bounds every input, camera motion keeps its velocity through changes,
      zoom moves from room to house to coast, and the animals outside can be visited up close.
    techniques:
      - id: camera-envelopes
        name: Camera envelopes from the finished terrain
        status: shipped
        since: "2026-09-14"
        what: One set of limits applies to pointer, touch, wheel, keys and camera settling, built from a height grid ray-cast against the finished terrain.
        how: >-
          `bin/coastal_camera.py` ray-casts the final authored surfaces into a terrain-height proxy and writes per-view camera
          envelopes and cutaway tags into the manifest; a miss is sea at the renderer's mean level, never invented land.
          `camera.mjs` applies those limits to every input and to interpolated transitions. Front-room orbits dolly in before
          reaching a side wall or the gallery slab, the glass front may be crossed but the camera never rests close enough
          to slice a pane, and a room-to-room move projects an intersecting near plane toward the Pacific opening.
        files:
          - path: bin/coastal_camera.py
            role: Terrain-height proxy and camera envelopes.
          - path: assets/js/home-scene/camera.mjs
            role: Applies the envelopes to every input.
        tests:
          - test/coastal-camera.test.mjs
        sources: []
        limits:
          - The height proxy is static and does not sample the animated wave surface.
          - Until the collision field is ready, interior views use bounded arcs and a near-plane clearance proxy; then the spring arm below takes over.
        next: []
      - id: camera-motion
        name: Critically damped camera motion
        status: shipped
        since: "2026-10-09"
        what: Camera coordinates follow an analytic critically damped response, so a changed destination keeps the current velocity instead of restarting the ease.
        how: >-
          `camera-motion.mjs` integrates each coordinate in closed form, with no substep loop and no backlog after a slow
          frame. Reduced motion composes the target immediately, pause and hidden views clear any residual velocity, and the
          room clearance bounds cancel velocity at a constraint.
        files:
          - path: assets/js/home-scene/camera-motion.mjs
            role: Closed-form damped coordinates.
          - path: assets/js/home-scene/camera.mjs
            role: Clearance bounds that cancel velocity.
        tests:
          - test/coastal-camera-motion.test.mjs
        sources: []
        limits: []
        next: []
      - id: semantic-zoom
        name: Semantic zoom and panning
        status: shipped
        since: "2026-10-14"
        what: Zooming changes what is shown. Pushing past a room's widest view opens the whole house, then the coast, and zooming in walks back into the room under the pointer.
        how: >-
          A view changes only after a further push within 0.7 s (the zoom factors' logarithms summing past 0.32), so one hard
          flick still stops at the edge. Shift-drag, right- or middle-drag, two fingers and Shift+arrows move the viewpoint
          across the floor, within 1 m of a room's authored target, 6 m of the house's and 26 m outside. In the whole house,
          hovering names a room and a click or the keys 1 to 6 visit it. ⌘/Ctrl+scroll, which a trackpad pinch sends, zooms
          without focusing the canvas; a plain scroll still scrolls the page and shows a hint at most three times. The idea
          is Perlin and Fox's Pad and Bederson and Hollan's Pad++, with the home's own hierarchy (room, house, coast) as the
          zoom axis.
        files:
          - path: assets/js/home-scene/controller.mjs
            role: Gesture interpretation, view changes and room hover.
          - path: assets/js/home-scene/camera.mjs
            role: Zoom and pan limits per view.
        tests:
          - test/visual/desk-scene.spec.js
        sources: [perlin1993pad, bederson1994padpp]
        limits:
          - Every view settles on its authored framing, because keeping the visitor's heading when zooming out framed the house badly.
          - Room pans stopped at 1 m until the collision field arrived; they now reach 1.8 m and stop at furniture (see the spring arm).
        next: []
      - id: animal-inspection
        name: Close views of the coastal neighbours
        status: shipped
        since: "2026-10-02"
        what: Clicking an animal outside opens a model-sized orbit around it; N cycles the neighbours, Enter restores the coastline and Escape returns inside.
        how: >-
          Each of the 28 animals caches conservative inspection bounds and named eye and muzzle anchors once.
          Arrival visibility scores candidate camera positions with exact local triangle subsets (`occlusion-region.mjs`) and
          counts the other animals and P from their own scene roots, without altering the rendered terrain or plants. Close
          inspections enable the room's contact-light pass; the sea gets a contact-only exemption, so its undisplaced
          override plane cannot invent contacts.
        files:
          - path: assets/js/home-scene/wildlife.mjs
            role: Inspection bounds, anchors and arrival scoring.
          - path: assets/js/home-scene/occlusion-region.mjs
            role: Exact local triangle subsets for visibility rays.
        tests:
          - test/occlusion-region.test.mjs
          - test/coastal-camera.test.mjs
        sources: []
        limits:
          - Visibility is checked on arrival; it is not continuous occlusion avoidance while the animal moves.
        next: []

      - id: camera-collision-field
        name: A collision field voxelized from the loaded house
        status: shipped
        since: "2026-10-15"
        what: Every static house, room and nearby coast mesh is voxelized into a 12 cm field once it loads, so the camera knows the house's real walls, furniture and rock.
        how: >-
          `createCameraField` in `camera-field.mjs` voxelizes each mesh in a module worker (`camera-field-worker.mjs`), or
          in small background slices where workers are unavailable, and `camera.mjs` classifies the cells. Connected pieces
          under 45 cm in every direction are detail and block only in a dense canopy; a structural cell blocks when its
          7-cell neighbourhood holds a plane's worth of structure (walls, floors, cabinets, beds, rock, dense slat
          screens), while rails, posts, mullions and the rack's uprights stay thin. Blocking cells grow a 24 cm clearance
          shell, and air is flooded from each room's target and authored camera, so the inside of a solid is never a place
          to stand. Glass, the cut-away roof, sliding doors and props are left out; the onsen steam is an explicit solid.
          Rays walk the field cell by cell, after Amanatides and Woo.
        files:
          - path: assets/js/home-scene/camera-field.mjs
            role: Voxelizes the loaded meshes and decides what may hold the camera back.
          - path: assets/js/home-scene/camera-field-worker.mjs
            role: Voxelizes off the main thread.
          - path: assets/js/home-scene/camera.mjs
            role: Classifies the cells and walks rays through them.
        tests:
          - test/coastal-camera.test.mjs
          - test/visual/desk-scene.spec.js
