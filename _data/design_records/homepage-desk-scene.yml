      - id: spring-arm
        name: Spring arm, free orbits and steering
        status: shipped
        since: "2026-10-15"
        what: The camera sits at the farthest point on its orbit ray that the path reaches without crossing a blocking cell, so rooms open to free orbits and pans that slide along obstacles.
        how: >-
          The arm is the farthest point on the orbit ray the path reaches without crossing a blocking cell, with eight side
          rays on a 7° cone pulling in before an edge reaches the ray. It shortens within about 0.1 s, recovers over about
          0.4 s and never passes a hard limit 10 cm before the first blocking surface. Orbit, pan and coasting steps that
          would leave the arm under 40 % of the requested distance are refused, sliding along obstacles. Once the field is
          ready, rooms get free yaw, pitch from −0.12 to 1.25 rad and zoom to 1.5 times the authored distance, and room pans
          reach 1.8 m and stop at furniture. Released drags coast with a 0.32 s decay in closed form; reduced motion and
          Pause keep drags exact; Home recentres and Page Up and Page Down zoom.
        files:
          - path: assets/js/home-scene/camera.mjs
            role: The arm, the hard limit and the steering.
          - path: assets/js/home-scene/camera-motion.mjs
            role: Closed-form coasting.
          - path: assets/js/home-scene/controller.mjs
            role: Gestures, keys and the field's readiness.
        tests:
