        next: []
      - id: decor
        name: River stones and things on the walls
        status: shipped
        since: "2026-10-14"
        what: 24 rounded river stones replace the onsen's faceted slabs, and each room gains objects chosen for its use.
        how: >-
          `bin/coastal_decor.py` adds a bamboo spout, a bucket and stool and a cedar slat panel to the onsen, a framed
          seascape over the bed, a pinboard of sketches above the desk, and a coiled-rope sun and three thrown pots in the
