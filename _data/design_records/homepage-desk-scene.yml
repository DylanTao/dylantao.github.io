    why: The active brief. Priority order, interaction contracts, the San Diego routine and the acceptance evidence map.
  - path: artwork/coastal-home/PROVENANCE.md
    why: What was authored, generated or referenced, and every rebuild command.
  - path: assets/js/home-scene/CONTACT-LIGHTING.md
    why: Contact-light equations, controlled comparisons and measured cost.
  - path: assets/js/home-scene/ONSEN-WATER.md
    why: The height-field pool, its hand coupling and its numerical evidence.
  - path: assets/js/home-scene/PHYSICS.md
    why: The ocean spectrum, sea reflection, sun position and record mechanics.
  - path: assets/js/home-scene/SKIN-DIFFUSION.md
    why: The skin diffusion profile, curvature and its limits.
  - path: assets/js/home-scene/THERMAL-STEAM.md
    why: Steam transport, volume compositing around glass and the light-well mask.
  - path: docs/static-light-field.md
    why: The traced sky and lamp bounce, its probes and its cost.
  - path: docs/coherent-wind-equations.md
    why: The curl wind field, leaf attachment and particle integration.
  - path: docs/performance-notes.md
    why: Where the frame goes, what was cut on October 18, the rules for later work and the next techniques to try.
  - path: docs/studio-log-2026-10.md
    why: The October design moves in full, with dimensions, backtalk and concepts.
  - path: .codex/skills/homepage-desk-scene/SKILL.md
