      - id: hinterland
        name: The land beyond the mainland's walls
        status: shipped
        since: "2026-10-15"
        what: A terraced mesa with badland canyons, bluffs with the gliderport, a headland with sea caves and a distant point continue the coast past the mainland's flat walls.
        how: >-
          `bin/build_coastal_hinterland.py` snaps the new ground to the mainland's 225 back-edge and 41 end-edge vertices and
          continues its own height, cliff and beach functions across each seam, eased over 25 m. North, the coast runs to
          32 m Torrey sandstone bluffs with the gliderport's lawn, fence, benches and a wind sock that turns with
          `coastWind.vane`; south, to a cove, a headland with three sea caves under a timber viewing deck, and a distant
          point. Trails, 2,365 shrubs and 156 Torrey pines are placed by distance, with a sparse planting on the mainland's
          bare rear. One constrained Delaunay triangulation, after Shewchuk's Triangle, runs from 0.5 m triangles at the
          walls to 18 m on the far hill, with occlusion baked into vertex colours. The 1.36 MB Draco model (about 206,000
          triangles) loads on the first visit outside.
