      - id: animal-repertoires
        name: Varied repertoires from keyed springs
        status: shipped
        since: "2026-10-18"
        what: Every animal acts in irregular epochs of varied behaviour, with overshoot, settling and follow-through, as a pure function of active time.
        how: >-
          `wildlife-acting.mjs` places epoch boundaries with jitter (`epochAt`), so nothing repeats on a fixed beat, and opens
          and closes each epoch in a settled pose. Posture channels are springs driven by keyed targets (`sprung`): a linear
          spring's response to stepped targets is the sum of one step response per change, so a turn overshoots and settles
          with no integration. Heads lead and ears, tails and wingtips follow on lagged springs; gaze moves in quick turns
          with irregular holds. Rabbits graze, groom, freeze and bolt; sea lions bark, sky-point, roll and scratch; seals
          shuffle to the wash by whole humps; two sea lions porpoise and raft; the raccoon sleeps by day and forages at night;
          gulls bank, flare, preen, call and squabble over a perch. Unseen animals act on every twelfth frame and catch up
          just before a draw.
        files:
          - path: assets/js/home-scene/wildlife-acting.mjs
            role: Epochs, springs, glances, quintic transfers, flight attitude and wingbeats.
            functions: [epochAt, sprung, glanceKeys, transfer, flightAttitude, wingbeat]
          - path: assets/js/home-scene/wildlife-motion.mjs
            role: Rabbit, pinniped and swimming sea lion acting.
          - path: assets/js/home-scene/wildlife-neighbor-motion.mjs
            role: Raccoon, sandpiper and gull acting.
          - path: bin/capture_coastal_wildlife.cjs
            role: Frame-stepped captures on a paused clock.
        tests:
          - test/wildlife-motion.test.mjs
          - test/wildlife-neighbors.test.mjs
          - test/wildlife-scene.test.mjs
        sources: [allaboutbirds-sanderling, sandiego-childrens-pool]
        limits:
          - Authored acting, not measured biomechanics, aerodynamics or motion capture.
          - The swash edge uses the sea's vertical displacement only, read once per half-second tick.
        next: []
      - id: coastal-seabirds
        name: Pelicans over the swell and cormorants on the rocks
        status: shipped
        since: "2026-10-18"
        what: Five brown pelicans glide in a line over the swell and the last one plunge-dives now and then; four Brandt's cormorants dry their wings on the rocks at the cliff foot.
        how: >-
          `bin/build_coastal_seabirds.py` builds both masters in `seabirds.blend`. Pelicans fly a closed route about a metre
          above the displaced, wind-driven sea the renderer draws, each repeating the leader's wingbeats at the same place, so
          a wave of flaps runs down the line (`pelicanMotion`). On alternate laps the last bird climbs, folds, rolls a quarter
          turn and plunges in, drains its pouch on the surface, runs off the water and flies 20 % faster until it regains its
          place. Cormorants stand on rock roosts that `bin/build_coastal_perch_support.py` exports beside the gull perches
          (`cormorantMotion`).
        files:
          - path: bin/build_coastal_seabirds.py
            role: Brown pelican and Brandt's cormorant masters.
            functions: [pelican, cormorant]
          - path: assets/js/home-scene/wildlife-seabird-motion.mjs
            role: Pelican route, flap wave and dive; cormorant acting.
            functions: [pelicanMotion, cormorantMotion, pelicanDive]
        tests:
          - test/wildlife-seabirds.test.mjs
          - test/wildlife-perch-contact.test.mjs
        sources: [allaboutbirds-brown-pelican, allaboutbirds-brandts-cormorant]
        limits:
          - The splash is a small particle crown and the sea contact a sampled height, not a fluid simulation.
          - The cormorants' wing-drying, preening and throat flutter are authored, not taken from the cited page.
        next: []

  - id: authoring
    name: Terrain, architecture and flora authoring
    summary: >-
      Everything on the page is exported from editable Blender sources by Python scripts run in Blender 4.5 LTS's
      background mode, then baked, optimized and reviewed. Focused refresh scripts change one aspect of the retained
      house without rebuilding it.
    techniques:
      - id: blender-pipeline
        name: Rebuildable Blender sources
        status: shipped
        since: "2026-09-12"
        what: One build script writes the house, the characters, their GLBs and review portraits; bake, export and review scripts follow every geometry change.
        how: >-
          `bin/build_coastal_home.py` writes `coastal-home.blend`, the character sources, the GLBs and review portraits in
          one run, and flags such as `--house-only`, `--avatar=ghibli`, `--section-only`, `--coast-only` and `--export-only`
          rebuild part of it. After geometry changes, `bake_coastal_light.py` and then `optimize_coastal_exports.py` rebake
          and export. `render_coastal_review.py` renders neutral-clay and material views from the manifest cameras, and
          `review_coastal_models.py` records contacts, hashes and triangle counts under `artwork/coastal-home/reviews/`.
          Focused `refresh_coastal_*.py` scripts change finishes, decoration, the facade, the planting or the light well in
          the retained house.
        files:
          - path: bin/build_coastal_home.py
            role: The full authoring entry point.
          - path: bin/coastal_sculpt.py
            role: Continuous sculpt surfaces.
          - path: bin/coastal_craft.py
            role: Floorboards, joinery, shelves and small objects.
          - path: bin/render_coastal_review.py
            role: Matched-camera review renders.
          - path: artwork/coastal-home/reviews/
            role: Review renders and measurement reports.
          - path: artwork/coastal-home/PROVENANCE.md
            role: Authorship, references and rebuild commands.
        sources: [blender]
        limits:
          - Blender ran through its Python API; no hand sculpting in the interface is claimed.
          - Generated concept boards guided direction and are not finished models.
        next: []
      - id: section-and-terrain
        name: One section for house, cliff and beach
        status: shipped
        since: "2026-09-13"
        what: Two storeys at 0 and 2.6 m are carved into one continuous mainland cliff that meets a sloping beach about seven meters below the lower floor.
        how: >-
          `bin/coastal_section.py` carves the cave from closed solids with exact Boolean operations, welds and caps the
          mainland and the removable roof, and rejects nonmanifold edges; only the local ceiling lifts for cutaways.
          `coastal_landscape.py` composes headlands, coves and ledges and exports habitat paths, shoreline samples, perches
          and tidal basins into the version-5 manifest, so the browser's animals and surf stand on the same coast. Planting,
          paths and perches are ray-cast against the carved mesh. The sandstone layering and fallen rock follow UC San
          Diego's beach-walk notes and Scripps' cliff-failure research as reference, not as a survey.
        files:
          - path: bin/coastal_section.py
            role: The carved two-storey section.
          - path: bin/coastal_landscape.py
            role: Headlands, beach and exported contact data.
          - path: assets/models/home/manifest.json
            role: Shared floors, treads, habitats and shoreline.
        sources: [sio15-beachwalk, scripps-cliffs]
        limits:
          - An imagined home, not a surveyed reconstruction of a real place or building.
        next: []
      - id: facade-terrace
        name: Glass front, terrace and alcove screens
        status: shipped
        since: "2026-10-14"
        what: A bronze-framed glass front sits inside the cave lip, a corbelled sandstone terrace is carved below it, and cedar screens turn the bedroom and onsen into alcoves.
        how: >-
          `bin/coastal_facade.py` sets the frame 0.4 m inside the rock lip, where a ray survey found the jamb continuous (a
          cut-stone pier fills one eroded notch), and puts the two lift-and-slide doors where the kitchen and lounge cameras
          look in; their view frusta cross the glass line at x −3.3 to −0.9 m and 2.1 to 3.7 m. By day the browser slides the
          doors into the rock. The terrace is 3.1 m deep against the sheltered south rock and narrows to a walk at the north,
          with a bench and fire bowl, loungers, a bistro table, an olive, rosemary and a festoon. The plan runs from prospect
          to refuge, after Christopher Alexander's Intimacy Gradient, Six-Foot Balcony and Half-Open Wall patterns.
