open_problems:
  - id: spectral-ocean
    title: A spectral ocean
    system: water-atmosphere
    why_hard: >-
      The Pacific is ten authored Gerstner components. A spectral FFT ocean would give realistic wave statistics, but
      WebGL2 has no compute shaders, so the transform needs several ping-pong passes, cascades to hide tiling, and a CPU
      sampler that agrees with it, because floating objects and arrival rays read the same wave heights.
    candidate_moves:
      - Prototype a 128² FFT height field on a separate page and compare it with the authored spectrum from the same camera.
      - Keep the authored components for CPU sampling and use the FFT only for normal detail, so contacts stay exact.
    sources: [tessendorf2004ocean, arcblanc2025, bruneton2010ocean]
    readiness: needs-research
  - id: pool-caustics
    title: Caustics on the onsen vault, and beyond one sheet
    system: light-lab
    why_hard: >-
      Since October 18 the basin's stone takes paraxial caustics from the simulated surface (the onsen-water technique),
      one sheet for light from overhead. Light that reflects off the rippled water onto the vault, light from the low pool
      light, and strongly folded caustics are chains of specular bounces that must end in a small sun or a small lamp.
      Next-event estimation cannot aim through the water, which is the case the light lab measured, and the house has no
      runtime ray tracer.
    candidate_moves:
      - Add the pool light to the lab scene and render its caustics on the vault.
      - Reflect the same paraxial lens off the surface onto the vault, and check it against the lab's reference.
      - Try manifold exploration or specular manifold sampling in the lab before anything reaches the house.
    sources: [veach1997mlt, jakob2012manifold, zeltner2020sms, watt1990beam]
    readiness: needs-research
  - id: outside-frame-rate
    title: The outside view on integrated GPUs
    system: rendering-light
    why_hard: >-
      Outside, about 1,600 draws a frame went through four passes: the view, the shadow map, the opaque copy refraction
      needs, and the sea mirror. The October 18 performance pass cut script time per outside frame from 89.8 to 56.9 ms
      and draws to about 1,290 without changing a still beyond a few tie pixels (the graphics record's performance
      system), but the frame is still bound by three's per-draw work: about 800 draws for the view and the opaque copy,
      about 400 for the mirror, each refreshing its own material. Most objects are interactive, animated, wind-swayed or
      skinned, so merging meshes stays off the table, and every remaining large saving changes pixels.
    candidate_moves:
      - A distant, non-refracting onsen material and hopper glass outside, which drops the opaque copy, about a quarter of the frame's draws.
      - A lighter sea mirror, without interiors or redrawn every other frame while the camera is still (13 of 108 sampled stills changed).
      - Share identical materials between meshes, so grouped draws skip three's material refresh.
      - Skip objects smaller than a pixel (about 180 draws).
      - Judge each with a matched A/B before shipping.
    sources: [amdahl1967]
    readiness: needs-decision
  - id: temporal-antialiasing
    title: Temporal antialiasing
    system: rendering-light
    why_hard: >-
      Without per-object motion vectors, temporal antialiasing would trade a little shimmer for ghosting on the characters,
      animals, plants and waves, which move on almost every frame. 8× multisampling cost about 3 ms of GPU time for no
      visible gain.
    candidate_moves:
      - Motion vectors for skinned and wind-deformed meshes.
      - A still photo mode where a temporal filter can accumulate.
      - Revisit under WebGPURenderer's temporal reprojection node once the graphics record's WebGPU conditions hold.
    sources: []
    readiness: blocked
  - id: dynamic-light-field
    title: Light that sees people and plants
    system: rendering-light
    why_hard: >-
      The traced light field is static and has one bounce, so the avatar, P and the swaying plants never shade it.
      Retracing on the CPU every frame is too slow, and probe updates in the style of DDGI rely on GPU ray tracing that
      WebGL does not offer.
    candidate_moves:
      - Subtract soft analytic occluders (capsules) for the avatar and P from probe visibility.
    sources: [majercik2019ddgi]
    readiness: needs-research
  - id: onsen-choice
    title: Grotto or open onsen
    system: rendering-light
    why_hard: >-
      The light well makes the bath a grotto that gets sun only through the shaft, so outside midday it is darker than the
      open cutaway was. Both are defensible; it is a taste decision.
    candidate_moves:
      - Keep the grotto.
      - Open the onsen and show the well only from the clifftop; `?onsen-light=open` previews it.
    sources: []
    readiness: needs-decision
  - id: terrace-hour
    title: A sunset hour on the terrace
    system: characters
    why_hard: >-
      The terrace has loungers, a bench and a fire bowl but no activity in the routine. A new activity needs fitted
      contacts, a camera that looks through a door opening, and a place in the schedule.
    candidate_moves:
      - Add an evening terrace activity with contacts on a lounger or the bench, timed with the festoon and fire bowl.
    sources: []
    readiness: needs-decision
  - id: alternate-treatments
    title: Architectural and Illustrated treatments
    system: rendering-light
    why_hard: >-
      In September the three treatments read as too similar, and Realistic worked best. A shader swap alone does not make
      a different way of seeing the same home.
    candidate_moves:
      - A same-camera comparison where each treatment has its own form, light, mark-making and motion, kept behind `?scene-lab=1`.
    sources: []
    readiness: blocked
  - id: close-up-detail
    title: Close-up character and environment detail
    system: characters
    why_hard: >-
      The scene is a stylized browser world. Film-studio character surfacing and close-up environmental detail remain a
      higher target, bounded by download size and frame budget.
    candidate_moves:
      - Pick one close-up (a face at the desk, the onsen rim) and compare a detail pass against the current frame at the same camera.
    sources: []
    readiness: needs-research
  - id: renovation-choices
    title: The renovation's open choices
    system: authoring
    why_hard: >-
      The renovation followed a designer's brief, but several of its choices are taste and comfort calls that only Sirui
      can make, and each touches geometry, the routine's anchors or the light field's cages, so changing one later means a
      rebuild and a new bake.
    candidate_moves:
      - The kitchen run parting around the gallery's fin, and the refrigerator in the back kitchen.
      - Two soffit downlights, and the dining top at 82.5 cm with a 22 cm footrest ring.
      - The profile view at the desk, and the speed of the PC's RGB cycle.
      - Where the TV wall and the reading nook sit.
      - The plaster texture's strength and the oak's tone.
      - What furnishes the sparse deeper back of the house.
    sources: []
    readiness: needs-decision
  - id: cloth-choices
    title: The cloth's open choices
    system: wind-plants
    why_hard: >-
      The linen and the laundry follow a reference Sirui chose, but how much cloth the house shows, how lively it is and
      what it costs are taste calls, and each one moves a schedule, an authored exposure or the frame's budget.
    candidate_moves:
      - Keep, move or restyle the laundry (an indigo towel with natural stripes, the white linen shirt, a natural towel with an ochre band and a terracotta towel), and choose whether it hangs whenever the house is open or Sirui hangs it himself in the routine.
      - How lively the terrace is, at 42 % of the open coast's wind (towels lift 30 to 45 degrees toward the house) or calmer at about 30 %.
      - The doorway breeze on the curtains (0.55 of the onshore breeze, damping 0.22 per second), and the hardware (dark bronze rods with ball finials, six clipped rings and a pinch-pleated heading, against light oak or brass, eyelets or a ripple fold on a hidden track).
      - More linen by day, the panels over fixed glass half drawn, which changes the schedule; `?sheer=coverage` restores the October 16 grain for comparison.
      - Accept the cloth's cost, or step the panels on a worker or try vertex block descent to cut the substeps.
    sources: []
    readiness: needs-decision
