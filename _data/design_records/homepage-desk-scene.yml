# Technical record for the homepage's 3D coastal home, rendered at /projects/homepage-desk-scene/record/
# and served as JSON at /assets/json/design-records/homepage-desk-scene.json.
#
# Schema version 1, shared by every file in _data/design_records/ and checked by test/test_design_records.py:
#   systems[]        id, name, summary, techniques[]
#     techniques[]   id, name, status (shipped | experimental | retired), since, what, how,
#                    files[] {path, role}, tests[], sources[] (source ids), limits[],
#                    next[] {move, readiness, why}; retired {date, commit, reason} when status is retired
#   history[]        date, title, system (a system id), frame, dimensions[], move, backtalk, reframe,
#                    commit (quoted short sha, optional), sources[]; oldest first
#   open_problems[]  id, title, system, why_hard, candidate_moves[], sources[], readiness
#   sources[]        id, label, citation, url
# Readiness, most to least ready: ready, needs-measurement, needs-decision, needs-research, blocked.
# Paths are repository paths tracked by git; a trailing slash marks a directory.
#
# To extend: add a technique to the system it belongs to (or a new system), append each new move to the
# end of history, move a solved open problem into its technique, and add every new source to sources.
# Quote dates and commit shas. Run `python -m unittest test.test_design_records` before committing.

