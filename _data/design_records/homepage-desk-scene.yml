updated: "2026-10-23"
summary: >-
  How the homepage's 3D coastal home is built: the Blender scripts that author the cave house, the cliff, five cartoon
  versions of me and their animal neighbours; the browser runtime that loads, lights and animates them; and the light lab
  that grew out of the onsen. Each technique names its files, the research it borrows from, what it cannot do yet, and
  the next move worth trying.
scope: >-
  The home is an original, stylized browser world in an imagined La Jolla, not a surveyed place. Several techniques adapt
  published graphics research in small, bounded forms, and each entry says where it simplifies. Measurements come from
  one shared Windows laptop (Intel Core Ultra 7 155H with Arc integrated graphics) unless an entry says otherwise; they
  are not phone benchmarks.
credit: >-
  Compiled on October 15, 2026 by Anthropic's Claude from the code, the scene notes, the provenance files and the October
  studio log, for Sirui Tao to review and extend. The coast's wind, the curtains, the gym, the camera and the hinterland
  joined on October 17, and the renovation, full screen, the gym's tripod camera, the skinned wildlife and the
  performance pass on October 18, from entries the agents who built them prepared and checked. The October 23 house
  entries follow the retained Blender source, native contact measurements and inspected browser captures.

