# The 3D home's build diary: what I noticed, what changed, and the same view before and after.
#
# _includes/build-diary.liquid renders every entry on /projects/homepage-desk-scene/ and one stream's
# entries, with their `detail` and `extra` pairs, on that stream's own page. test/test_home_world_diary.py
# checks this file, its images and the pages that render it.
#
# To add an entry:
#   1. Make the images with `python bin/build_diary_images.py <name> <capture>`; both halves of a slider
#      pair come out the same size. Copy the printed width and height, and keep the capture's path in
#      `source`.
#   2. Append the entry under `entries`, oldest first, and name its phase (add a phase when a new
#      stretch of work begins).
#   3. A `quote` is only Sirui's own words, with typos fixed and the wording kept (a [bracket] marks an
#      added word). Otherwise write `text` in his first person from the review record, and say who
#      noticed: `by: sirui` for his review, `by: review` for a problem the builders' own review found.
#   4. Name the crew only when a commit trailer or a record names it.
#
# Fields:
#   start              the day the 3D view first shipped; each entry counts its day from it
#   image_dir          where bin/build_diary_images.py writes the WebP files
#   streams.<id>       label, short (the entry's stamp), url (the stream's deeper page)
#   phases[]           id, when, title, summary (a phase shows only when it has entries)
#   entries[]          id, date, phase, stream, title, status (done | in-progress | open)
#     note             by (sirui | review), quote or text, said (date, optional), context (optional)
#     change           what changed, one to three sentences; required once the entry is done
#     detail           more for the stream's page (optional)
#     crew             who built it, only when recorded
#     compare          kind (slider: the same camera | pair: different cameras), view (the caption),
#                      before and after {img, width, height, alt, stamp, source}; the page labels each
#                      view Before or After and adds the stamp (a date or a short label) when there is one.
#                      `source` is the capture's repository path; a path under .jekyll-cache/ is a local
#                      capture the coordinator kept outside the repository.
#     extra[]          further compares, shown on the stream's page
#     metrics[]        label, before, after (exact values from the record)
#     links[]          label, url (a site path or an https URL)

schema_version: 1
start: "2026-06-17"
image_dir: /assets/img/project_pics/homepage-desk-scene/diary/

streams:
  house:
    label: The House in the Cliff
    short: House
    url: /projects/house-in-the-cliff/
  people:
    label: the people who live there
    short: People
    url: /projects/homepage-desk-scene/record/#characters
  coast:
    label: A little La Jolla
    short: La Jolla
    url: /projects/la-jolla/
  speed:
    label: Making the 3D home fast
    short: Speed
    url: /projects/graphics-performance/
  desk:
    label: the 2D desk
    short: 2D desk
    url: /projects/website-revamp/record/#coffee-stain

phases:
  - id: first-room
    when: June–July
    title: The first room
    summary: A 3D view joins the paper desk, then becomes one room seen from inside and out.
  - id: moving-in
    when: September
    title: Moving in
    summary: September's reviews turned the room into a two-floor home in a sandstone cliff.
  - id: up-close
    when: October 1–12
    title: Details that hold up close
    summary: Fingers, lamps and loading get the attention a close look asks for.
  - id: retreat
    when: October 24
    title: A long day of fixes
    summary: The house moves eight metres into the rock, and the plants, the first-person view and the desk's coffee ring get their fixes.
  - id: walk-through
    when: October 24, evening
    title: The walk-through
    summary: I checked the home on my laptop and on a 4K PC with an RTX 3080, then sent these notes. The work continues; finished entries gain their before and after here.

