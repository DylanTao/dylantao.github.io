  - id: two-floors
    date: "2026-09-13"
    phase: moving-in
    stream: house
    title: Two floors carved into one cliff
    status: done
    note:
      by: sirui
      text: A room on a freestanding pedestal reads as a stage, not a home in a cliff. Carve the cave into land that continues inland, with the beach at its foot and the ocean beyond.
      context: the left image is my own review screenshot
    change: The study, sleeping alcove and onsen moved to an upper gallery 2.6 m above the kitchen, lounge and gym, joined by fifteen closed risers. The cave is carved from one continuous mainland, the beach follows the shore beneath it, and the cutaway lifts only the local ceiling.
    detail: Hiding the whole roof had erased the mountain behind the rooms, which is why only the local ceiling lifts. Walking began to follow the exported stair treads instead of an approximate equation.
    compare:
      kind: pair
      view: Not the same camera. My screenshot shows the house on its pedestal at night; the new view frames the whole shore and the two floors by day.
