  - id: warmup
    date: "2026-10-12"
    phase: up-close
    stream: speed
    title: Moving shader work off the page
    status: done
    note:
      by: review
      text: Opening the 3D home froze the page for about 13 seconds, then again when the rooms streamed in and on the first Look around.
    change: The October 12 checkpoint prepared the first view's shader programs before drawing and waited for parallel driver compilation. On the tested Windows desktop with an RTX 3080 Ti, blocking program-log reads across the session fell from 26.0 to 0.6 seconds. Two fixed study and exterior views were pixel-identical. The house has grown since, and loading remains an open task.
    detail: These were same-day local measurements, not a phone benchmark or a current loading guarantee. The back-to-back ready measurements fell from 11.3 seconds to 7.4–7.6 seconds; later runs on the shared workstation ranged from 8.3 to 13.8 seconds. Software rendering keeps a separate compile path.
    metrics:
      - label: Oct 12 blocking reads, session
        before: 26 s
        after: 0.6 s
      - label: Oct 12 desktop ready, paired runs
        before: 11.3 s
        after: 7.4–7.6 s
    links:
      - label: October 12 measurements and limits
        url: https://github.com/DylanTao/dylantao.github.io/blob/main/docs/evidence/coastal-startup-2026-10-12/README.md
      - label: How the house opens without freezing
        url: /projects/graphics-performance/#opening-without-freezing-the-page
      - label: Commit 011fe99b2
        url: https://github.com/DylanTao/dylantao.github.io/commit/011fe99b2

  - id: retreat
    date: "2026-10-24"
    phase: retreat
    stream: house
    title: The house steps eight metres into the cliff
    status: done
    note:
      by: sirui
      text: The house belongs inside the cliff. The pool should read as a light court on real rock, with a dry walk from the living room, and upstairs should be a quiet private floor.
    change: Only the house moved, eight metres landward; the coast stayed where it was. The pool now sits in a basin cut into the rock, without the deep girder and three exposed piers. My desk moved into a tall library, and the old upstairs office became a quiet room with two chaises.
    detail: The setback has a cost I kept visible. From the pool, the cliff faces now enter its sideward ocean view, and the playful laundry line still crosses that camera. The excavated sandstone is still angular, and the bedroom is still a long walk from the library.
    crew: Codex
    compare:
      kind: pair
      view: Comparable authored overviews at 1:20 pm on October 2 in clear weather, at 1440 × 1000 without the page controls. The camera moves eight metres with the house, so these are not pixel-registered views.
