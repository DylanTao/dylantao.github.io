        alt: The same overview after the retreat, the house set deeper under the sandstone, its upper floor now holding two chaises and a low table above the same living room
        stamp: Oct 24
        source: artwork/coastal-home/reviews/retreat-integration-2026-10-24/matched-final-clear/overview.png
    extra:
