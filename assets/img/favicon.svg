<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Noon still of the navbar orange floating behind blue water. -->
  <defs>
    <linearGradient id="brand-orange-light" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop class="brand-float-stop-light" offset="0" stop-color="#f79c55"></stop>
      <stop class="brand-float-stop-body" offset="0.58" stop-color="#f07a38"></stop>
      <stop class="brand-float-stop-deep" offset="1" stop-color="#e77332"></stop>
    </linearGradient>
    <clipPath id="brand-orange-waterline" clipPathUnits="userSpaceOnUse"><path class="brand-orange-current" d="M-20 19Q-15 17-10 19T0 19T10 19T20 19T30 19T40 19T50 19T60 19V-20H-20Z"></path></clipPath>
    <clipPath id="brand-orange-wave-window"><path d="M1 15H31V29H1Z"></path></clipPath>
    <clipPath id="brand-orange-glint-window"><path class="brand-orange-glint-zone" d="M14 15H18V29H14Z"></path></clipPath>
  </defs>
  <g clip-path="url(#brand-orange-waterline)">
    <g class="brand-orange-sun"><circle class="brand-orange-body" cx="16" cy="13.2" r="9.5" fill="url(#brand-orange-light)"></circle></g>
  </g>
  <g clip-path="url(#brand-orange-wave-window)">
    <g class="brand-orange-current"><path class="brand-orange-sea" d="M-20 19Q-15 17-10 19T0 19T10 19T20 19T30 19T40 19T50 19T60 19" fill="none" stroke="#3d7eb8" stroke-width="1.25" stroke-linecap="round"></path></g>
    <g class="brand-orange-ripple"><path class="brand-orange-sea-back" d="M6 24.7Q10.5 23.5 15 24.7T26 24.7" fill="none" stroke="#3d7eb8" stroke-width="0.95" stroke-linecap="round" opacity="0.65"></path></g>
    <g clip-path="url(#brand-orange-glint-window)">
      <g class="brand-orange-current"><path class="brand-orange-glint" d="M-20 19Q-15 17-10 19T0 19T10 19T20 19T30 19T40 19T50 19T60 19" fill="none" stroke="#f6a866" stroke-width="0.65" stroke-linecap="round" opacity="0.6"></path></g>
      <g class="brand-orange-ripple"><path class="brand-orange-glint brand-orange-glint-back" d="M6 24.7Q10.5 23.5 15 24.7T26 24.7" fill="none" stroke="#f6a866" stroke-width="0.55" stroke-linecap="round" opacity="0.45"></path></g>
    </g>
  </g>
</svg>
