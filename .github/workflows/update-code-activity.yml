name: Update personal code activity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-autocommit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0

      - name: Checkout public personal snapshot
        uses: actions/checkout@v4
        with:
          repository: DylanTao/DylanTao
          path: profile
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Import completed personal UTC days
        run: >-
          python site/bin/import_personal_code_activity.py
          --personal-repo profile
          --repo-root site

      - name: Validate importer and privacy contracts
        working-directory: site
        shell: bash
        run: |
          for test_file in \
            test_import_personal_code_activity.py \
            test_github_activity_privacy.py \
            test_build_rhythm_story.py; do
            python -m unittest discover -s test -p "$test_file"
          done

      - name: Scan the public projection
        working-directory: site
        shell: bash
        run: |
          if grep -nEi '(repository|repo[_-]?name|employer|organization|account[_-]?(id|name|login)|author|email|host|sha|message|timestamp|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|access[_-]?token|refresh[_-]?token|authorization|bearer[[:space:]]+[A-Za-z0-9._-]{16,})' -- \
            _data/personal_code_activity.json; then
            echo "Personal code activity violates the public privacy contract." >&2
            exit 1
          fi
          git diff --check

      - name: Detect public change
        id: change
        working-directory: site
        shell: bash
        run: |
          git add -- _data/personal_code_activity.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish personal snapshot
        if: steps.change.outputs.changed == 'true'
        working-directory: site
        shell: bash
        run: |
          git config user.name "Dylan Metrics Bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git commit -m "chore: refresh personal code activity"
          git push origin HEAD:main
